syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExperimentLifecycleServiceProto";
option java_package = "com.acme.experiments.v1";

// Moves an experiment between the states of its lifecycle.
service ExperimentLifecycleService {
  // Activates an experiment.
  rpc ActivateExperiment(ActivateExperimentRequest) returns (ActivateExperimentResponse);

  // Suspends an experiment.
  rpc SuspendExperiment(SuspendExperimentRequest) returns (SuspendExperimentResponse);

  // Reinstates an experiment.
  rpc ReinstateExperiment(ReinstateExperimentRequest) returns (ReinstateExperimentResponse);

  // Terminates an experiment.
  rpc TerminateExperiment(TerminateExperimentRequest) returns (TerminateExperimentResponse);

  // Renews an experiment.
  rpc RenewExperiment(RenewExperimentRequest) returns (RenewExperimentResponse);

  // Expires an experiment.
  rpc ExpireExperiment(ExpireExperimentRequest) returns (ExpireExperimentResponse);

  // Returns an experiment.
  rpc GetExperimentLifecycle(GetExperimentLifecycleRequest) returns (GetExperimentLifecycleResponse);

  // Schedules an experiment.
  rpc ScheduleExperimentExpiry(ScheduleExperimentExpiryRequest) returns (ScheduleExperimentExpiryResponse);
}

// The request of `ActivateExperiment`.
message ActivateExperimentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  ActivateExperimentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateExperiment`.
message ActivateExperimentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Experiment experiment = 1;
  ActivateExperimentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

