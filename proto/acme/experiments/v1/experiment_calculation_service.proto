syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExperimentCalculationServiceProto";
option java_package = "com.acme.experiments.v1";

// Computes the figures of an experiment, such as totals, taxes, and estimates.
service ExperimentCalculationService {
  // Calculates an experiment.
  rpc CalculateExperiment(CalculateExperimentRequest) returns (CalculateExperimentResponse);

  // Estimates an experiment.
  rpc EstimateExperiment(EstimateExperimentRequest) returns (EstimateExperimentResponse);

  // Quotes an experiment.
  rpc QuoteExperiment(QuoteExperimentRequest) returns (QuoteExperimentResponse);

  // Compares an experiment.
  rpc CompareExperimentOptions(CompareExperimentOptionsRequest) returns (CompareExperimentOptionsResponse);

  // Recalculates an experiment.
  rpc RecalculateExperiments(RecalculateExperimentsRequest) returns (RecalculateExperimentsResponse);

  // Simulates an experiment.
  rpc SimulateExperiment(SimulateExperimentRequest) returns (SimulateExperimentResponse);

  // Explains an experiment.
  rpc ExplainExperimentCalculation(ExplainExperimentCalculationRequest) returns (ExplainExperimentCalculationResponse);

  // Returns an experiment.
  rpc GetExperimentRates(GetExperimentRatesRequest) returns (GetExperimentRatesResponse);
}

// The request of `CalculateExperiment`.
message CalculateExperimentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  Experiment experiment = 3;
  CalculateExperimentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateExperiment`.
message CalculateExperimentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateExperimentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Experiment experiment = 1;
  CalculateExperimentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

