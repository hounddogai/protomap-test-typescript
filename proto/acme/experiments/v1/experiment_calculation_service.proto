    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  Experiment experiment = 3;
  ExplainExperimentCalculationRequest.Details details = 4;
  string reason = 5;
