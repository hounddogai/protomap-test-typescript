syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExperimentValidationServiceProto";
option java_package = "com.acme.experiments.v1";

// Checks experiments against the rules before anything acts on them.
service ExperimentValidationService {
  // Validates an experiment.
  rpc ValidateExperiment(ValidateExperimentRequest) returns (ValidateExperimentResponse);

  // Previews an experiment.
  rpc PreviewExperiment(PreviewExperimentRequest) returns (PreviewExperimentResponse);

  // Checks an experiment.
  rpc CheckExperimentEligibility(CheckExperimentEligibilityRequest) returns (CheckExperimentEligibilityResponse);

  // Normalizes an experiment.
  rpc NormalizeExperiment(NormalizeExperimentRequest) returns (NormalizeExperimentResponse);

  // Explains an experiment.
  rpc ExplainExperimentDecision(ExplainExperimentDecisionRequest) returns (ExplainExperimentDecisionResponse);

  // Scores an experiment.
  rpc ScoreExperiment(ScoreExperimentRequest) returns (ScoreExperimentResponse);

  // Lints an experiment.
  rpc LintExperiments(LintExperimentsRequest) returns (LintExperimentsResponse);

  // Returns an experiment.
  rpc GetExperimentRules(GetExperimentRulesRequest) returns (GetExperimentRulesResponse);
}

// The request of `ValidateExperiment`.
message ValidateExperimentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  Experiment experiment = 3;
  ValidateExperimentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateExperiment`.
message ValidateExperimentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Experiment experiment = 1;
  ValidateExperimentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

