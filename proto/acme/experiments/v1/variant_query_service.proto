syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "VariantQueryServiceProto";
option java_package = "com.acme.experiments.v1";

// Answers read-only questions about variants, for screens and reports.
service VariantQueryService {
  // Returns a variant.
  rpc LookupVariant(LookupVariantRequest) returns (LookupVariantResponse);

  // Lists variants a page at a time.
  rpc BrowseVariants(BrowseVariantsRequest) returns (BrowseVariantsResponse);

  // Lists variants a page at a time.
  rpc FindVariants(FindVariantsRequest) returns (FindVariantsResponse);

  // Counts variants by status.
  rpc CountVariants(CountVariantsRequest) returns (CountVariantsResponse);

  // Returns several variants at once.
  rpc ResolveVariants(ResolveVariantsRequest) returns (ResolveVariantsResponse);

  // Streams every matching variant.
  rpc ExportVariants(ExportVariantsRequest) returns (stream ExportVariantsResponse);

  // Summarizes a variant.
  rpc SummarizeVariants(SummarizeVariantsRequest) returns (SummarizeVariantsResponse);

  // Lists variants a page at a time.
  rpc SuggestVariants(SuggestVariantsRequest) returns (SuggestVariantsResponse);

  // Returns a variant.
  rpc PeekVariant(PeekVariantRequest) returns (PeekVariantResponse);
}

// The request of `LookupVariant`.
message LookupVariantRequest {
  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupVariant`.
message LookupVariantResponse {
  Variant variant = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseVariants`.
message BrowseVariantsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseVariantsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseVariants`.
message BrowseVariantsResponse {
  repeated Variant variants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindVariants`.
message FindVariantsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindVariantsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindVariants`.
message FindVariantsResponse {
  repeated Variant variants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountVariants`.
message CountVariantsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountVariantsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountVariants`.
message CountVariantsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveVariants`.
message ResolveVariantsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string variant_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveVariants`.
message ResolveVariantsResponse {
  repeated Variant variants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportVariants`.
message ExportVariantsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportVariantsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportVariants`.
message ExportVariantsResponse {
  Variant variant = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeVariants`.
message SummarizeVariantsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  SummarizeVariantsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeVariants`.
message SummarizeVariantsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestVariants`.
message SuggestVariantsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VariantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestVariantsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestVariants`.
message SuggestVariantsResponse {
  repeated Variant variants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekVariant`.
message PeekVariantRequest {
  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekVariant`.
message PeekVariantResponse {
  Variant variant = 1;
  acme.common.v1.OperationResult result = 2;
}
