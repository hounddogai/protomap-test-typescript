syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExposureValidationServiceProto";
option java_package = "com.acme.experiments.v1";

// Checks exposures against the rules before anything acts on them.
service ExposureValidationService {
  // Validates an exposure.
  rpc ValidateExposure(ValidateExposureRequest) returns (ValidateExposureResponse);

  // Previews an exposure.
  rpc PreviewExposure(PreviewExposureRequest) returns (PreviewExposureResponse);

  // Checks an exposure.
  rpc CheckExposureEligibility(CheckExposureEligibilityRequest) returns (CheckExposureEligibilityResponse);

  // Normalizes an exposure.
  rpc NormalizeExposure(NormalizeExposureRequest) returns (NormalizeExposureResponse);

  // Explains an exposure.
  rpc ExplainExposureDecision(ExplainExposureDecisionRequest) returns (ExplainExposureDecisionResponse);

  // Scores an exposure.
  rpc ScoreExposure(ScoreExposureRequest) returns (ScoreExposureResponse);

  // Lints an exposure.
  rpc LintExposures(LintExposuresRequest) returns (LintExposuresResponse);
}

// The request of `ValidateExposure`.
message ValidateExposureRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  Exposure exposure = 3;
  ValidateExposureRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateExposure`.
message ValidateExposureResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Exposure exposure = 1;
  ValidateExposureResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

