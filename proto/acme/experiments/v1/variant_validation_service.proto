syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "VariantValidationServiceProto";
option java_package = "com.acme.experiments.v1";

// Checks variants against the rules before anything acts on them.
service VariantValidationService {
  // Validates a variant.
  rpc ValidateVariant(ValidateVariantRequest) returns (ValidateVariantResponse);

  // Previews a variant.
  rpc PreviewVariant(PreviewVariantRequest) returns (PreviewVariantResponse);

  // Checks a variant.
  rpc CheckVariantEligibility(CheckVariantEligibilityRequest) returns (CheckVariantEligibilityResponse);

  // Normalizes a variant.
  rpc NormalizeVariant(NormalizeVariantRequest) returns (NormalizeVariantResponse);

  // Explains a variant.
  rpc ExplainVariantDecision(ExplainVariantDecisionRequest) returns (ExplainVariantDecisionResponse);

  // Scores a variant.
  rpc ScoreVariant(ScoreVariantRequest) returns (ScoreVariantResponse);

  // Lints a variant.
  rpc LintVariants(LintVariantsRequest) returns (LintVariantsResponse);
}

// The request of `ValidateVariant`.
message ValidateVariantRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  Variant variant = 3;
  ValidateVariantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVariant`.
message ValidateVariantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variant variant = 1;
  ValidateVariantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

