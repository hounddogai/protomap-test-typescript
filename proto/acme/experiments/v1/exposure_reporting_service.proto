syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExposureReportingServiceProto";
option java_package = "com.acme.experiments.v1";

// Builds and schedules reports about exposures.
service ExposureReportingService {
  // Generates an exposure.
  rpc GenerateExposureReport(GenerateExposureReportRequest) returns (GenerateExposureReportResponse);

  // Returns an exposure.
  rpc FetchExposureReport(FetchExposureReportRequest) returns (FetchExposureReportResponse);

  // Schedules an exposure.
  rpc ScheduleExposureReport(ScheduleExposureReportRequest) returns (ScheduleExposureReportResponse);

  // Streams the changes of exposures as they happen.
  rpc StreamExposureMetrics(StreamExposureMetricsRequest) returns (stream StreamExposureMetricsResponse);

  // Lists exposures a page at a time.
  rpc ListExposureReports(ListExposureReportsRequest) returns (ListExposureReportsResponse);

  // Shares an exposure.
  rpc ShareExposureReport(ShareExposureReportRequest) returns (ShareExposureReportResponse);

  // Counts exposures by status.
  rpc CountExposureTotals(CountExposureTotalsRequest) returns (CountExposureTotalsResponse);
}

// The request of `GenerateExposureReport`.
message GenerateExposureReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  GenerateExposureReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateExposureReport`.
message GenerateExposureReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchExposureReport`.
message FetchExposureReportRequest {
  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchExposureReport`.
message FetchExposureReportResponse {
  Exposure exposure = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleExposureReport`.
message ScheduleExposureReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  ScheduleExposureReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleExposureReport`.
message ScheduleExposureReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamExposureMetrics`.
message StreamExposureMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExposureStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamExposureMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamExposureMetrics`.
message StreamExposureMetricsResponse {
  Exposure exposure = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListExposureReports`.
message ListExposureReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExposureStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListExposureReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListExposureReports`.
message ListExposureReportsResponse {
  repeated Exposure exposures = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareExposureReport`.
message ShareExposureReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  ShareExposureReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareExposureReport`.
message ShareExposureReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Exposure exposure = 1;
  ShareExposureReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountExposureTotals`.
message CountExposureTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExposureStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountExposureTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountExposureTotals`.
message CountExposureTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
