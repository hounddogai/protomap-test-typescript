syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "VariantCalculationServiceProto";
option java_package = "com.acme.experiments.v1";

// Computes the figures of a variant, such as totals, taxes, and estimates.
service VariantCalculationService {
  // Calculates a variant.
  rpc CalculateVariant(CalculateVariantRequest) returns (CalculateVariantResponse);

  // Estimates a variant.
  rpc EstimateVariant(EstimateVariantRequest) returns (EstimateVariantResponse);

  // Quotes a variant.
  rpc QuoteVariant(QuoteVariantRequest) returns (QuoteVariantResponse);

  // Compares a variant.
  rpc CompareVariantOptions(CompareVariantOptionsRequest) returns (CompareVariantOptionsResponse);

  // Recalculates a variant.
  rpc RecalculateVariants(RecalculateVariantsRequest) returns (RecalculateVariantsResponse);

  // Explains a variant.
  rpc ExplainVariantCalculation(ExplainVariantCalculationRequest) returns (ExplainVariantCalculationResponse);

  // Returns a variant.
  rpc GetVariantRates(GetVariantRatesRequest) returns (GetVariantRatesResponse);
}

// The request of `CalculateVariant`.
message CalculateVariantRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  Variant variant = 3;
  CalculateVariantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateVariant`.
message CalculateVariantResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateVariantResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Variant variant = 1;
  CalculateVariantResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

