syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExposureCalculationServiceProto";
option java_package = "com.acme.experiments.v1";

// Computes the figures of an exposure, such as totals, taxes, and estimates.
service ExposureCalculationService {
  // Calculates an exposure.
  rpc CalculateExposure(CalculateExposureRequest) returns (CalculateExposureResponse);

  // Estimates an exposure.
  rpc EstimateExposure(EstimateExposureRequest) returns (EstimateExposureResponse);

  // Quotes an exposure.
  rpc QuoteExposure(QuoteExposureRequest) returns (QuoteExposureResponse);

  // Compares an exposure.
  rpc CompareExposureOptions(CompareExposureOptionsRequest) returns (CompareExposureOptionsResponse);

  // Recalculates an exposure.
  rpc RecalculateExposures(RecalculateExposuresRequest) returns (RecalculateExposuresResponse);

  // Simulates an exposure.
  rpc SimulateExposure(SimulateExposureRequest) returns (SimulateExposureResponse);

  // Explains an exposure.
  rpc ExplainExposureCalculation(ExplainExposureCalculationRequest) returns (ExplainExposureCalculationResponse);
}

// The request of `CalculateExposure`.
message CalculateExposureRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  Exposure exposure = 3;
  CalculateExposureRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateExposure`.
message CalculateExposureResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateExposureResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Exposure exposure = 1;
  CalculateExposureResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

