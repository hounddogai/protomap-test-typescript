syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExposureLifecycleServiceProto";
option java_package = "com.acme.experiments.v1";

// Moves an exposure between the states of its lifecycle.
service ExposureLifecycleService {
  // Activates an exposure.
  rpc ActivateExposure(ActivateExposureRequest) returns (ActivateExposureResponse);

  // Suspends an exposure.
  rpc SuspendExposure(SuspendExposureRequest) returns (SuspendExposureResponse);

  // Reinstates an exposure.
  rpc ReinstateExposure(ReinstateExposureRequest) returns (ReinstateExposureResponse);

  // Terminates an exposure.
  rpc TerminateExposure(TerminateExposureRequest) returns (TerminateExposureResponse);

  // Renews an exposure.
  rpc RenewExposure(RenewExposureRequest) returns (RenewExposureResponse);

  // Expires an exposure.
  rpc ExpireExposure(ExpireExposureRequest) returns (ExpireExposureResponse);

  // Returns an exposure.
  rpc GetExposureLifecycle(GetExposureLifecycleRequest) returns (GetExposureLifecycleResponse);
}

// The request of `ActivateExposure`.
message ActivateExposureRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  ActivateExposureRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateExposure`.
message ActivateExposureResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Exposure exposure = 1;
  ActivateExposureResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

