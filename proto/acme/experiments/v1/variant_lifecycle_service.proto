syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/experiments/v1/experiments.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "VariantLifecycleServiceProto";
option java_package = "com.acme.experiments.v1";

// Moves a variant between the states of its lifecycle.
service VariantLifecycleService {
  // Activates a variant.
  rpc ActivateVariant(ActivateVariantRequest) returns (ActivateVariantResponse);

  // Suspends a variant.
  rpc SuspendVariant(SuspendVariantRequest) returns (SuspendVariantResponse);

  // Reinstates a variant.
  rpc ReinstateVariant(ReinstateVariantRequest) returns (ReinstateVariantResponse);

  // Terminates a variant.
  rpc TerminateVariant(TerminateVariantRequest) returns (TerminateVariantResponse);

  // Renews a variant.
  rpc RenewVariant(RenewVariantRequest) returns (RenewVariantResponse);

  // Expires a variant.
  rpc ExpireVariant(ExpireVariantRequest) returns (ExpireVariantResponse);

  // Returns a variant.
  rpc GetVariantLifecycle(GetVariantLifecycleRequest) returns (GetVariantLifecycleResponse);
}

// The request of `ActivateVariant`.
message ActivateVariantRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  ActivateVariantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateVariant`.
message ActivateVariantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variant variant = 1;
  ActivateVariantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

