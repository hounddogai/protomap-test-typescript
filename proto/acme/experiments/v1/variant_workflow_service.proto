syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "VariantWorkflowServiceProto";
option java_package = "com.acme.experiments.v1";

// Runs the long-lived workflow that takes a variant from start to finish.
service VariantWorkflowService {
  // Starts a variant.
  rpc StartVariantWorkflow(StartVariantWorkflowRequest) returns (StartVariantWorkflowResponse);

  // Advances a variant.
  rpc AdvanceVariantWorkflow(AdvanceVariantWorkflowRequest) returns (AdvanceVariantWorkflowResponse);

  // Cancels a variant.
  rpc CancelVariantWorkflow(CancelVariantWorkflowRequest) returns (CancelVariantWorkflowResponse);

  // Retrys a variant.
  rpc RetryVariantWorkflow(RetryVariantWorkflowRequest) returns (RetryVariantWorkflowResponse);

  // Pauses a variant.
  rpc PauseVariantWorkflow(PauseVariantWorkflowRequest) returns (PauseVariantWorkflowResponse);

  // Resumes a variant.
  rpc ResumeVariantWorkflow(ResumeVariantWorkflowRequest) returns (ResumeVariantWorkflowResponse);

  // Returns a variant.
  rpc InspectVariantWorkflow(InspectVariantWorkflowRequest) returns (InspectVariantWorkflowResponse);

  // Lists variants a page at a time.
  rpc ListVariantWorkflows(ListVariantWorkflowsRequest) returns (ListVariantWorkflowsResponse);

  // Signals a variant.
  rpc SignalVariantWorkflow(SignalVariantWorkflowRequest) returns (SignalVariantWorkflowResponse);
}

// The request of `StartVariantWorkflow`.
message StartVariantWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  Variant variant = 3;
  StartVariantWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartVariantWorkflow`.
message StartVariantWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variant variant = 1;
  StartVariantWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

