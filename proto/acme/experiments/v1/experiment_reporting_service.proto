syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "ExperimentReportingServiceProto";
option java_package = "com.acme.experiments.v1";

// Builds and schedules reports about experiments.
service ExperimentReportingService {
  // Generates an experiment.
  rpc GenerateExperimentReport(GenerateExperimentReportRequest) returns (GenerateExperimentReportResponse);

  // Returns an experiment.
  rpc FetchExperimentReport(FetchExperimentReportRequest) returns (FetchExperimentReportResponse);

  // Schedules an experiment.
  rpc ScheduleExperimentReport(ScheduleExperimentReportRequest) returns (ScheduleExperimentReportResponse);

  // Streams the changes of experiments as they happen.
  rpc StreamExperimentMetrics(StreamExperimentMetricsRequest) returns (stream StreamExperimentMetricsResponse);

  // Lists experiments a page at a time.
  rpc ListExperimentReports(ListExperimentReportsRequest) returns (ListExperimentReportsResponse);

  // Shares an experiment.
  rpc ShareExperimentReport(ShareExperimentReportRequest) returns (ShareExperimentReportResponse);

  // Counts experiments by status.
  rpc CountExperimentTotals(CountExperimentTotalsRequest) returns (CountExperimentTotalsResponse);

  // Deletes an experiment.
  rpc DeleteExperimentReport(DeleteExperimentReportRequest) returns (DeleteExperimentReportResponse);
}

// The request of `GenerateExperimentReport`.
message GenerateExperimentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  GenerateExperimentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateExperimentReport`.
message GenerateExperimentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchExperimentReport`.
message FetchExperimentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchExperimentReport`.
message FetchExperimentReportResponse {
  Experiment experiment = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleExperimentReport`.
message ScheduleExperimentReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  ScheduleExperimentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleExperimentReport`.
message ScheduleExperimentReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamExperimentMetrics`.
message StreamExperimentMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamExperimentMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamExperimentMetrics`.
message StreamExperimentMetricsResponse {
  Experiment experiment = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListExperimentReports`.
message ListExperimentReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListExperimentReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListExperimentReports`.
message ListExperimentReportsResponse {
  repeated Experiment experiments = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareExperimentReport`.
message ShareExperimentReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  ShareExperimentReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareExperimentReport`.
message ShareExperimentReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Experiment experiment = 1;
  ShareExperimentReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountExperimentTotals`.
message CountExperimentTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExperimentStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountExperimentTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountExperimentTotals`.
message CountExperimentTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteExperimentReport`.
message DeleteExperimentReportRequest {
  acme.common.v1.RequestContext context = 1;
  string experiment_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteExperimentReport`.
message DeleteExperimentReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
