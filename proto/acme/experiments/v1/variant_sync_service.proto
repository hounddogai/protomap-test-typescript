    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  Variant variant = 3;
  ReconcileVariantsRequest.Details details = 4;
  string reason = 5;
