syntax = "proto3";

package acme.experiments.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/experiments/v1/experiments.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Experiments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/experiments/v1;experimentsv1";
option java_multiple_files = true;
option java_outer_classname = "VariantSyncServiceProto";
option java_package = "com.acme.experiments.v1";

// Keeps variants in step with the systems of record in other regions.
service VariantSyncService {
  // Syncs a variant.
  rpc SyncVariants(SyncVariantsRequest) returns (SyncVariantsResponse);

  // Pushs a variant.
  rpc PushVariant(PushVariantRequest) returns (PushVariantResponse);

  // Pulls a variant.
  rpc PullVariants(PullVariantsRequest) returns (PullVariantsResponse);

  // Reconciles a variant.
  rpc ReconcileVariants(ReconcileVariantsRequest) returns (ReconcileVariantsResponse);

  // Exchanges changes of variants with a peer.
  rpc StreamVariantChanges(stream StreamVariantChangesRequest) returns (stream StreamVariantChangesResponse);

  // Resolves a variant.
  rpc ResolveVariantConflict(ResolveVariantConflictRequest) returns (ResolveVariantConflictResponse);

  // Returns a variant.
  rpc GetVariantSyncState(GetVariantSyncStateRequest) returns (GetVariantSyncStateResponse);

  // Lists variants a page at a time.
  rpc ListVariantConflicts(ListVariantConflictsRequest) returns (ListVariantConflictsResponse);
}

// The request of `SyncVariants`.
message SyncVariantsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  Variant variant = 3;
  SyncVariantsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncVariants`.
message SyncVariantsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variant variant = 1;
  SyncVariantsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushVariant`.
message PushVariantRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variant_id = 2;
  Variant variant = 3;
  PushVariantRequest.Details details = 4;
  string reason = 5;
