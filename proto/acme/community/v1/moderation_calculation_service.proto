syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ModerationCalculationServiceProto";
option java_package = "com.acme.community.v1";

// Computes the figures of a moderation, such as totals, taxes, and estimates.
service ModerationCalculationService {
  // Calculates a moderation.
  rpc CalculateModeration(CalculateModerationRequest) returns (CalculateModerationResponse);

  // Estimates a moderation.
  rpc EstimateModeration(EstimateModerationRequest) returns (EstimateModerationResponse);

  // Quotes a moderation.
  rpc QuoteModeration(QuoteModerationRequest) returns (QuoteModerationResponse);

  // Compares a moderation.
  rpc CompareModerationOptions(CompareModerationOptionsRequest) returns (CompareModerationOptionsResponse);

  // Recalculates a moderation.
  rpc RecalculateModerations(RecalculateModerationsRequest) returns (RecalculateModerationsResponse);

  // Simulates a moderation.
  rpc SimulateModeration(SimulateModerationRequest) returns (SimulateModerationResponse);

  // Explains a moderation.
  rpc ExplainModerationCalculation(ExplainModerationCalculationRequest) returns (ExplainModerationCalculationResponse);

  // Returns a moderation.
  rpc GetModerationRates(GetModerationRatesRequest) returns (GetModerationRatesResponse);
}

// The request of `CalculateModeration`.
message CalculateModerationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string moderation_id = 2;
  Moderation moderation = 3;
  CalculateModerationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateModeration`.
message CalculateModerationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateModerationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Moderation moderation = 1;
  CalculateModerationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

