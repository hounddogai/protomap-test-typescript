syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ForumWorkflowServiceProto";
option java_package = "com.acme.community.v1";

// Runs the long-lived workflow that takes a forum from start to finish.
service ForumWorkflowService {
  // Starts a forum.
  rpc StartForumWorkflow(StartForumWorkflowRequest) returns (StartForumWorkflowResponse);

  // Advances a forum.
  rpc AdvanceForumWorkflow(AdvanceForumWorkflowRequest) returns (AdvanceForumWorkflowResponse);

  // Cancels a forum.
  rpc CancelForumWorkflow(CancelForumWorkflowRequest) returns (CancelForumWorkflowResponse);

  // Retrys a forum.
  rpc RetryForumWorkflow(RetryForumWorkflowRequest) returns (RetryForumWorkflowResponse);

  // Pauses a forum.
  rpc PauseForumWorkflow(PauseForumWorkflowRequest) returns (PauseForumWorkflowResponse);

  // Resumes a forum.
  rpc ResumeForumWorkflow(ResumeForumWorkflowRequest) returns (ResumeForumWorkflowResponse);

  // Returns a forum.
  rpc InspectForumWorkflow(InspectForumWorkflowRequest) returns (InspectForumWorkflowResponse);

  // Signals a forum.
  rpc SignalForumWorkflow(SignalForumWorkflowRequest) returns (SignalForumWorkflowResponse);
}

// The request of `StartForumWorkflow`.
message StartForumWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forum_id = 2;
  Forum forum = 3;
  StartForumWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartForumWorkflow`.
message StartForumWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forum forum = 1;
  StartForumWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

