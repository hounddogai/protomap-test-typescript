syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ForumValidationServiceProto";
option java_package = "com.acme.community.v1";

// Checks forums against the rules before anything acts on them.
service ForumValidationService {
  // Validates a forum.
  rpc ValidateForum(ValidateForumRequest) returns (ValidateForumResponse);

  // Previews a forum.
  rpc PreviewForum(PreviewForumRequest) returns (PreviewForumResponse);

  // Checks a forum.
  rpc CheckForumEligibility(CheckForumEligibilityRequest) returns (CheckForumEligibilityResponse);

  // Normalizes a forum.
  rpc NormalizeForum(NormalizeForumRequest) returns (NormalizeForumResponse);

  // Explains a forum.
  rpc ExplainForumDecision(ExplainForumDecisionRequest) returns (ExplainForumDecisionResponse);

  // Scores a forum.
  rpc ScoreForum(ScoreForumRequest) returns (ScoreForumResponse);

  // Lints a forum.
  rpc LintForums(LintForumsRequest) returns (LintForumsResponse);

  // Returns a forum.
  rpc GetForumRules(GetForumRulesRequest) returns (GetForumRulesResponse);
}

// The request of `ValidateForum`.
message ValidateForumRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string forum_id = 2;
  Forum forum = 3;
  ValidateForumRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateForum`.
message ValidateForumResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forum forum = 1;
  ValidateForumResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

