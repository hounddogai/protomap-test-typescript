syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/community/v1/community.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ForumApprovalServiceProto";
option java_package = "com.acme.community.v1";

// Routes forums through approval, with escalation and delegation.
service ForumApprovalService {
  // Submits a forum.
  rpc SubmitForum(SubmitForumRequest) returns (SubmitForumResponse);

  // Approves a forum.
  rpc ApproveForum(ApproveForumRequest) returns (ApproveForumResponse);

  // Rejects a forum.
  rpc RejectForum(RejectForumRequest) returns (RejectForumResponse);

  // Escalates a forum.
  rpc EscalateForum(EscalateForumRequest) returns (EscalateForumResponse);

  // Lists forums a page at a time.
  rpc ListPendingForums(ListPendingForumsRequest) returns (ListPendingForumsResponse);

  // Delegates a forum.
  rpc DelegateForumApproval(DelegateForumApprovalRequest) returns (DelegateForumApprovalResponse);

  // Recalls a forum.
  rpc RecallForum(RecallForumRequest) returns (RecallForumResponse);

  // Returns a forum.
  rpc GetForumApprovalStatus(GetForumApprovalStatusRequest) returns (GetForumApprovalStatusResponse);

  // Comments a forum.
  rpc CommentForumApproval(CommentForumApprovalRequest) returns (CommentForumApprovalResponse);
}

// The request of `SubmitForum`.
message SubmitForumRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forum_id = 2;
  Forum forum = 3;
  SubmitForumRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitForum`.
message SubmitForumResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forum forum = 1;
  SubmitForumResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

