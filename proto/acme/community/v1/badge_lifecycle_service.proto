syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "BadgeLifecycleServiceProto";
option java_package = "com.acme.community.v1";

// Moves a badge between the states of its lifecycle.
service BadgeLifecycleService {
  // Activates a badge.
  rpc ActivateBadge(ActivateBadgeRequest) returns (ActivateBadgeResponse);

  // Suspends a badge.
  rpc SuspendBadge(SuspendBadgeRequest) returns (SuspendBadgeResponse);

  // Reinstates a badge.
  rpc ReinstateBadge(ReinstateBadgeRequest) returns (ReinstateBadgeResponse);

  // Renews a badge.
  rpc RenewBadge(RenewBadgeRequest) returns (RenewBadgeResponse);

  // Expires a badge.
  rpc ExpireBadge(ExpireBadgeRequest) returns (ExpireBadgeResponse);

  // Returns a badge.
  rpc GetBadgeLifecycle(GetBadgeLifecycleRequest) returns (GetBadgeLifecycleResponse);

  // Schedules a badge.
  rpc ScheduleBadgeExpiry(ScheduleBadgeExpiryRequest) returns (ScheduleBadgeExpiryResponse);
}

// The request of `ActivateBadge`.
message ActivateBadgeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string badge_id = 2;
  ActivateBadgeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateBadge`.
message ActivateBadgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Badge badge = 1;
  ActivateBadgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

