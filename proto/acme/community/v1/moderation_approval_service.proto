syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/community/v1/community.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ModerationApprovalServiceProto";
option java_package = "com.acme.community.v1";

// Routes moderations through approval, with escalation and delegation.
service ModerationApprovalService {
  // Submits a moderation.
  rpc SubmitModeration(SubmitModerationRequest) returns (SubmitModerationResponse);

  // Approves a moderation.
  rpc ApproveModeration(ApproveModerationRequest) returns (ApproveModerationResponse);

  // Rejects a moderation.
  rpc RejectModeration(RejectModerationRequest) returns (RejectModerationResponse);

  // Escalates a moderation.
  rpc EscalateModeration(EscalateModerationRequest) returns (EscalateModerationResponse);

  // Lists moderations a page at a time.
  rpc ListPendingModerations(ListPendingModerationsRequest) returns (ListPendingModerationsResponse);

  // Delegates a moderation.
  rpc DelegateModerationApproval(DelegateModerationApprovalRequest) returns (DelegateModerationApprovalResponse);

  // Recalls a moderation.
  rpc RecallModeration(RecallModerationRequest) returns (RecallModerationResponse);

  // Comments a moderation.
  rpc CommentModerationApproval(CommentModerationApprovalRequest) returns (CommentModerationApprovalResponse);
}

// The request of `SubmitModeration`.
message SubmitModerationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string moderation_id = 2;
  Moderation moderation = 3;
  SubmitModerationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitModeration`.
message SubmitModerationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Moderation moderation = 1;
  SubmitModerationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

