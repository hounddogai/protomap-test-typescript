syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "BadgeWorkflowServiceProto";
option java_package = "com.acme.community.v1";

// Runs the long-lived workflow that takes a badge from start to finish.
service BadgeWorkflowService {
  // Starts a badge.
  rpc StartBadgeWorkflow(StartBadgeWorkflowRequest) returns (StartBadgeWorkflowResponse);

  // Advances a badge.
  rpc AdvanceBadgeWorkflow(AdvanceBadgeWorkflowRequest) returns (AdvanceBadgeWorkflowResponse);

  // Cancels a badge.
  rpc CancelBadgeWorkflow(CancelBadgeWorkflowRequest) returns (CancelBadgeWorkflowResponse);

  // Retrys a badge.
  rpc RetryBadgeWorkflow(RetryBadgeWorkflowRequest) returns (RetryBadgeWorkflowResponse);

  // Pauses a badge.
  rpc PauseBadgeWorkflow(PauseBadgeWorkflowRequest) returns (PauseBadgeWorkflowResponse);

  // Returns a badge.
  rpc InspectBadgeWorkflow(InspectBadgeWorkflowRequest) returns (InspectBadgeWorkflowResponse);

  // Lists badges a page at a time.
  rpc ListBadgeWorkflows(ListBadgeWorkflowsRequest) returns (ListBadgeWorkflowsResponse);

  // Signals a badge.
  rpc SignalBadgeWorkflow(SignalBadgeWorkflowRequest) returns (SignalBadgeWorkflowResponse);
}

// The request of `StartBadgeWorkflow`.
message StartBadgeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string badge_id = 2;
  Badge badge = 3;
  StartBadgeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBadgeWorkflow`.
message StartBadgeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Badge badge = 1;
  StartBadgeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

