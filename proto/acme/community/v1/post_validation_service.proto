syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "PostValidationServiceProto";
option java_package = "com.acme.community.v1";

// Checks posts against the rules before anything acts on them.
service PostValidationService {
  // Validates a post.
  rpc ValidatePost(ValidatePostRequest) returns (ValidatePostResponse);

  // Previews a post.
  rpc PreviewPost(PreviewPostRequest) returns (PreviewPostResponse);

  // Checks a post.
  rpc CheckPostEligibility(CheckPostEligibilityRequest) returns (CheckPostEligibilityResponse);

  // Normalizes a post.
  rpc NormalizePost(NormalizePostRequest) returns (NormalizePostResponse);

  // Explains a post.
  rpc ExplainPostDecision(ExplainPostDecisionRequest) returns (ExplainPostDecisionResponse);

  // Scores a post.
  rpc ScorePost(ScorePostRequest) returns (ScorePostResponse);

  // Lints a post.
  rpc LintPosts(LintPostsRequest) returns (LintPostsResponse);

  // Returns a post.
  rpc GetPostRules(GetPostRulesRequest) returns (GetPostRulesResponse);
}

// The request of `ValidatePost`.
message ValidatePostRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string post_id = 2;
  Post post = 3;
  ValidatePostRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePost`.
message ValidatePostResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Post post = 1;
  ValidatePostResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

