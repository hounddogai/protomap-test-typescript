syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "PostWorkflowServiceProto";
option java_package = "com.acme.community.v1";

// Runs the long-lived workflow that takes a post from start to finish.
service PostWorkflowService {
  // Starts a post.
  rpc StartPostWorkflow(StartPostWorkflowRequest) returns (StartPostWorkflowResponse);

  // Advances a post.
  rpc AdvancePostWorkflow(AdvancePostWorkflowRequest) returns (AdvancePostWorkflowResponse);

  // Cancels a post.
  rpc CancelPostWorkflow(CancelPostWorkflowRequest) returns (CancelPostWorkflowResponse);

  // Retrys a post.
  rpc RetryPostWorkflow(RetryPostWorkflowRequest) returns (RetryPostWorkflowResponse);

  // Pauses a post.
  rpc PausePostWorkflow(PausePostWorkflowRequest) returns (PausePostWorkflowResponse);

  // Resumes a post.
  rpc ResumePostWorkflow(ResumePostWorkflowRequest) returns (ResumePostWorkflowResponse);

  // Returns a post.
  rpc InspectPostWorkflow(InspectPostWorkflowRequest) returns (InspectPostWorkflowResponse);

  // Lists posts a page at a time.
  rpc ListPostWorkflows(ListPostWorkflowsRequest) returns (ListPostWorkflowsResponse);
}

// The request of `StartPostWorkflow`.
message StartPostWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string post_id = 2;
  Post post = 3;
  StartPostWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPostWorkflow`.
message StartPostWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Post post = 1;
  StartPostWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

