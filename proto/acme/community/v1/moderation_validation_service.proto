syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "ModerationValidationServiceProto";
option java_package = "com.acme.community.v1";

// Checks moderations against the rules before anything acts on them.
service ModerationValidationService {
  // Validates a moderation.
  rpc ValidateModeration(ValidateModerationRequest) returns (ValidateModerationResponse);

  // Previews a moderation.
  rpc PreviewModeration(PreviewModerationRequest) returns (PreviewModerationResponse);

  // Checks a moderation.
  rpc CheckModerationEligibility(CheckModerationEligibilityRequest) returns (CheckModerationEligibilityResponse);

  // Normalizes a moderation.
  rpc NormalizeModeration(NormalizeModerationRequest) returns (NormalizeModerationResponse);

  // Explains a moderation.
  rpc ExplainModerationDecision(ExplainModerationDecisionRequest) returns (ExplainModerationDecisionResponse);

  // Scores a moderation.
  rpc ScoreModeration(ScoreModerationRequest) returns (ScoreModerationResponse);

  // Lints a moderation.
  rpc LintModerations(LintModerationsRequest) returns (LintModerationsResponse);

  // Returns a moderation.
  rpc GetModerationRules(GetModerationRulesRequest) returns (GetModerationRulesResponse);
}

// The request of `ValidateModeration`.
message ValidateModerationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string moderation_id = 2;
  Moderation moderation = 3;
  ValidateModerationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateModeration`.
message ValidateModerationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Moderation moderation = 1;
  ValidateModerationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

