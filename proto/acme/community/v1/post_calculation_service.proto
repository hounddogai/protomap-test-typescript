syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "PostCalculationServiceProto";
option java_package = "com.acme.community.v1";

// Computes the figures of a post, such as totals, taxes, and estimates.
service PostCalculationService {
  // Calculates a post.
  rpc CalculatePost(CalculatePostRequest) returns (CalculatePostResponse);

  // Estimates a post.
  rpc EstimatePost(EstimatePostRequest) returns (EstimatePostResponse);

  // Quotes a post.
  rpc QuotePost(QuotePostRequest) returns (QuotePostResponse);

  // Compares a post.
  rpc ComparePostOptions(ComparePostOptionsRequest) returns (ComparePostOptionsResponse);

  // Simulates a post.
  rpc SimulatePost(SimulatePostRequest) returns (SimulatePostResponse);

  // Returns a post.
  rpc GetPostRates(GetPostRatesRequest) returns (GetPostRatesResponse);
}

// The request of `CalculatePost`.
message CalculatePostRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string post_id = 2;
  Post post = 3;
  CalculatePostRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePost`.
message CalculatePostResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePostResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Post post = 1;
  CalculatePostResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

