syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/community/v1/community.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "BadgeValidationServiceProto";
option java_package = "com.acme.community.v1";

// Checks badges against the rules before anything acts on them.
service BadgeValidationService {
  // Validates a badge.
  rpc ValidateBadge(ValidateBadgeRequest) returns (ValidateBadgeResponse);

  // Previews a badge.
  rpc PreviewBadge(PreviewBadgeRequest) returns (PreviewBadgeResponse);

  // Checks a badge.
  rpc CheckBadgeEligibility(CheckBadgeEligibilityRequest) returns (CheckBadgeEligibilityResponse);

  // Normalizes a badge.
  rpc NormalizeBadge(NormalizeBadgeRequest) returns (NormalizeBadgeResponse);

  // Explains a badge.
  rpc ExplainBadgeDecision(ExplainBadgeDecisionRequest) returns (ExplainBadgeDecisionResponse);

  // Scores a badge.
  rpc ScoreBadge(ScoreBadgeRequest) returns (ScoreBadgeResponse);

  // Lints a badge.
  rpc LintBadges(LintBadgesRequest) returns (LintBadgesResponse);

  // Returns a badge.
  rpc GetBadgeRules(GetBadgeRulesRequest) returns (GetBadgeRulesResponse);
}

// The request of `ValidateBadge`.
message ValidateBadgeRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string badge_id = 2;
  Badge badge = 3;
  ValidateBadgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBadge`.
message ValidateBadgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Badge badge = 1;
  ValidateBadgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

