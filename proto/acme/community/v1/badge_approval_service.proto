syntax = "proto3";

package acme.community.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/community/v1/community.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Community.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/community/v1;communityv1";
option java_multiple_files = true;
option java_outer_classname = "BadgeApprovalServiceProto";
option java_package = "com.acme.community.v1";

// Routes badges through approval, with escalation and delegation.
service BadgeApprovalService {
  // Submits a badge.
  rpc SubmitBadge(SubmitBadgeRequest) returns (SubmitBadgeResponse);

  // Approves a badge.
  rpc ApproveBadge(ApproveBadgeRequest) returns (ApproveBadgeResponse);

  // Rejects a badge.
  rpc RejectBadge(RejectBadgeRequest) returns (RejectBadgeResponse);

  // Escalates a badge.
  rpc EscalateBadge(EscalateBadgeRequest) returns (EscalateBadgeResponse);

  // Lists badges a page at a time.
  rpc ListPendingBadges(ListPendingBadgesRequest) returns (ListPendingBadgesResponse);

  // Delegates a badge.
  rpc DelegateBadgeApproval(DelegateBadgeApprovalRequest) returns (DelegateBadgeApprovalResponse);

  // Recalls a badge.
  rpc RecallBadge(RecallBadgeRequest) returns (RecallBadgeResponse);

  // Returns a badge.
  rpc GetBadgeApprovalStatus(GetBadgeApprovalStatusRequest) returns (GetBadgeApprovalStatusResponse);

  // Comments a badge.
  rpc CommentBadgeApproval(CommentBadgeApprovalRequest) returns (CommentBadgeApprovalResponse);
}

// The request of `SubmitBadge`.
message SubmitBadgeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string badge_id = 2;
  Badge badge = 3;
  SubmitBadgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBadge`.
message SubmitBadgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Badge badge = 1;
  SubmitBadgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

