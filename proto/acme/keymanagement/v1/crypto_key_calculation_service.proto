syntax = "proto3";

package acme.keymanagement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/keymanagement/v1/keymanagement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Keymanagement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/keymanagement/v1;keymanagementv1";
option java_multiple_files = true;
option java_outer_classname = "CryptoKeyCalculationServiceProto";
option java_package = "com.acme.keymanagement.v1";

// Computes the figures of a crypto key, such as totals, taxes, and estimates.
service CryptoKeyCalculationService {
  // Calculates a crypto key.
  rpc CalculateCryptoKey(CalculateCryptoKeyRequest) returns (CalculateCryptoKeyResponse);

  // Estimates a crypto key.
  rpc EstimateCryptoKey(EstimateCryptoKeyRequest) returns (EstimateCryptoKeyResponse);

  // Quotes a crypto key.
  rpc QuoteCryptoKey(QuoteCryptoKeyRequest) returns (QuoteCryptoKeyResponse);

  // Compares a crypto key.
  rpc CompareCryptoKeyOptions(CompareCryptoKeyOptionsRequest) returns (CompareCryptoKeyOptionsResponse);

  // Recalculates a crypto key.
  rpc RecalculateCryptoKeys(RecalculateCryptoKeysRequest) returns (RecalculateCryptoKeysResponse);

  // Simulates a crypto key.
  rpc SimulateCryptoKey(SimulateCryptoKeyRequest) returns (SimulateCryptoKeyResponse);

  // Explains a crypto key.
  rpc ExplainCryptoKeyCalculation(ExplainCryptoKeyCalculationRequest) returns (ExplainCryptoKeyCalculationResponse);

  // Returns a crypto key.
  rpc GetCryptoKeyRates(GetCryptoKeyRatesRequest) returns (GetCryptoKeyRatesResponse);
}

// The request of `CalculateCryptoKey`.
message CalculateCryptoKeyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string crypto_key_id = 2;
  CryptoKey crypto_key = 3;
  CalculateCryptoKeyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCryptoKey`.
message CalculateCryptoKeyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCryptoKeyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CryptoKey crypto_key = 1;
  CalculateCryptoKeyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

