syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/forms/v1/forms.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormSubmissionLifecycleServiceProto";
option java_package = "com.acme.forms.v1";

// Moves a form submission between the states of its lifecycle.
service FormSubmissionLifecycleService {
  // Activates a form submission.
  rpc ActivateFormSubmission(ActivateFormSubmissionRequest) returns (ActivateFormSubmissionResponse);

  // Suspends a form submission.
  rpc SuspendFormSubmission(SuspendFormSubmissionRequest) returns (SuspendFormSubmissionResponse);

  // Reinstates a form submission.
  rpc ReinstateFormSubmission(ReinstateFormSubmissionRequest) returns (ReinstateFormSubmissionResponse);

  // Terminates a form submission.
  rpc TerminateFormSubmission(TerminateFormSubmissionRequest) returns (TerminateFormSubmissionResponse);

  // Expires a form submission.
  rpc ExpireFormSubmission(ExpireFormSubmissionRequest) returns (ExpireFormSubmissionResponse);

  // Returns a form submission.
  rpc GetFormSubmissionLifecycle(GetFormSubmissionLifecycleRequest) returns (GetFormSubmissionLifecycleResponse);

  // Schedules a form submission.
  rpc ScheduleFormSubmissionExpiry(ScheduleFormSubmissionExpiryRequest) returns (ScheduleFormSubmissionExpiryResponse);
}

// The request of `ActivateFormSubmission`.
message ActivateFormSubmissionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string form_submission_id = 2;
  ActivateFormSubmissionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFormSubmission`.
message ActivateFormSubmissionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FormSubmission form_submission = 1;
  ActivateFormSubmissionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

