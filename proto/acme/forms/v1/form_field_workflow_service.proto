syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forms/v1/forms.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormFieldWorkflowServiceProto";
option java_package = "com.acme.forms.v1";

// Runs the long-lived workflow that takes a form field from start to finish.
service FormFieldWorkflowService {
  // Starts a form field.
  rpc StartFormFieldWorkflow(StartFormFieldWorkflowRequest) returns (StartFormFieldWorkflowResponse);

  // Advances a form field.
  rpc AdvanceFormFieldWorkflow(AdvanceFormFieldWorkflowRequest) returns (AdvanceFormFieldWorkflowResponse);

  // Cancels a form field.
  rpc CancelFormFieldWorkflow(CancelFormFieldWorkflowRequest) returns (CancelFormFieldWorkflowResponse);

  // Retrys a form field.
  rpc RetryFormFieldWorkflow(RetryFormFieldWorkflowRequest) returns (RetryFormFieldWorkflowResponse);

  // Returns a form field.
  rpc InspectFormFieldWorkflow(InspectFormFieldWorkflowRequest) returns (InspectFormFieldWorkflowResponse);

  // Lists form fields a page at a time.
  rpc ListFormFieldWorkflows(ListFormFieldWorkflowsRequest) returns (ListFormFieldWorkflowsResponse);

  // Signals a form field.
  rpc SignalFormFieldWorkflow(SignalFormFieldWorkflowRequest) returns (SignalFormFieldWorkflowResponse);
}

// The request of `StartFormFieldWorkflow`.
message StartFormFieldWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string form_field_id = 2;
  FormField form_field = 3;
  StartFormFieldWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFormFieldWorkflow`.
message StartFormFieldWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FormField form_field = 1;
  StartFormFieldWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

