syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/forms/v1/forms.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormFieldLifecycleServiceProto";
option java_package = "com.acme.forms.v1";

// Moves a form field between the states of its lifecycle.
service FormFieldLifecycleService {
  // Activates a form field.
  rpc ActivateFormField(ActivateFormFieldRequest) returns (ActivateFormFieldResponse);

  // Suspends a form field.
  rpc SuspendFormField(SuspendFormFieldRequest) returns (SuspendFormFieldResponse);

  // Reinstates a form field.
  rpc ReinstateFormField(ReinstateFormFieldRequest) returns (ReinstateFormFieldResponse);

  // Renews a form field.
  rpc RenewFormField(RenewFormFieldRequest) returns (RenewFormFieldResponse);

  // Expires a form field.
  rpc ExpireFormField(ExpireFormFieldRequest) returns (ExpireFormFieldResponse);

  // Returns a form field.
  rpc GetFormFieldLifecycle(GetFormFieldLifecycleRequest) returns (GetFormFieldLifecycleResponse);

  // Schedules a form field.
  rpc ScheduleFormFieldExpiry(ScheduleFormFieldExpiryRequest) returns (ScheduleFormFieldExpiryResponse);
}

// The request of `ActivateFormField`.
message ActivateFormFieldRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string form_field_id = 2;
  ActivateFormFieldRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFormField`.
message ActivateFormFieldResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FormField form_field = 1;
  ActivateFormFieldResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

