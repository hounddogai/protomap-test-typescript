syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/forms/v1/forms.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormValidationServiceProto";
option java_package = "com.acme.forms.v1";

// Checks forms against the rules before anything acts on them.
service FormValidationService {
  // Validates a form.
  rpc ValidateForm(ValidateFormRequest) returns (ValidateFormResponse);

  // Previews a form.
  rpc PreviewForm(PreviewFormRequest) returns (PreviewFormResponse);

  // Checks a form.
  rpc CheckFormEligibility(CheckFormEligibilityRequest) returns (CheckFormEligibilityResponse);

  // Normalizes a form.
  rpc NormalizeForm(NormalizeFormRequest) returns (NormalizeFormResponse);

  // Explains a form.
  rpc ExplainFormDecision(ExplainFormDecisionRequest) returns (ExplainFormDecisionResponse);

  // Scores a form.
  rpc ScoreForm(ScoreFormRequest) returns (ScoreFormResponse);

  // Lints a form.
  rpc LintForms(LintFormsRequest) returns (LintFormsResponse);

  // Returns a form.
  rpc GetFormRules(GetFormRulesRequest) returns (GetFormRulesResponse);
}

// The request of `ValidateForm`.
message ValidateFormRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string form_id = 2;
  Form form = 3;
  ValidateFormRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateForm`.
message ValidateFormResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Form form = 1;
  ValidateFormResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

