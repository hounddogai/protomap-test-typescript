syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/forms/v1/forms.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormSubmissionValidationServiceProto";
option java_package = "com.acme.forms.v1";

// Checks form submissions against the rules before anything acts on them.
service FormSubmissionValidationService {
  // Validates a form submission.
  rpc ValidateFormSubmission(ValidateFormSubmissionRequest) returns (ValidateFormSubmissionResponse);

  // Previews a form submission.
  rpc PreviewFormSubmission(PreviewFormSubmissionRequest) returns (PreviewFormSubmissionResponse);

  // Checks a form submission.
  rpc CheckFormSubmissionEligibility(CheckFormSubmissionEligibilityRequest) returns (CheckFormSubmissionEligibilityResponse);

  // Normalizes a form submission.
  rpc NormalizeFormSubmission(NormalizeFormSubmissionRequest) returns (NormalizeFormSubmissionResponse);

  // Explains a form submission.
  rpc ExplainFormSubmissionDecision(ExplainFormSubmissionDecisionRequest) returns (ExplainFormSubmissionDecisionResponse);

  // Scores a form submission.
  rpc ScoreFormSubmission(ScoreFormSubmissionRequest) returns (ScoreFormSubmissionResponse);

  // Lints a form submission.
  rpc LintFormSubmissions(LintFormSubmissionsRequest) returns (LintFormSubmissionsResponse);

  // Returns a form submission.
  rpc GetFormSubmissionRules(GetFormSubmissionRulesRequest) returns (GetFormSubmissionRulesResponse);
}

// The request of `ValidateFormSubmission`.
message ValidateFormSubmissionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string form_submission_id = 2;
  FormSubmission form_submission = 3;
  ValidateFormSubmissionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFormSubmission`.
message ValidateFormSubmissionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FormSubmission form_submission = 1;
  ValidateFormSubmissionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

