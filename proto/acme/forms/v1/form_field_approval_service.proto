syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/forms/v1/forms.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormFieldApprovalServiceProto";
option java_package = "com.acme.forms.v1";

// Routes form fields through approval, with escalation and delegation.
service FormFieldApprovalService {
  // Submits a form field.
  rpc SubmitFormField(SubmitFormFieldRequest) returns (SubmitFormFieldResponse);

  // Approves a form field.
  rpc ApproveFormField(ApproveFormFieldRequest) returns (ApproveFormFieldResponse);

  // Rejects a form field.
  rpc RejectFormField(RejectFormFieldRequest) returns (RejectFormFieldResponse);

  // Escalates a form field.
  rpc EscalateFormField(EscalateFormFieldRequest) returns (EscalateFormFieldResponse);

  // Lists form fields a page at a time.
  rpc ListPendingFormFields(ListPendingFormFieldsRequest) returns (ListPendingFormFieldsResponse);

  // Delegates a form field.
  rpc DelegateFormFieldApproval(DelegateFormFieldApprovalRequest) returns (DelegateFormFieldApprovalResponse);

  // Comments a form field.
  rpc CommentFormFieldApproval(CommentFormFieldApprovalRequest) returns (CommentFormFieldApprovalResponse);
}

// The request of `SubmitFormField`.
message SubmitFormFieldRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string form_field_id = 2;
  FormField form_field = 3;
  SubmitFormFieldRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFormField`.
message SubmitFormFieldResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FormField form_field = 1;
  SubmitFormFieldResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

