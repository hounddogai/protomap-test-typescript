syntax = "proto3";

package acme.forms.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/forms/v1/forms.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Forms.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/forms/v1;formsv1";
option java_multiple_files = true;
option java_outer_classname = "FormFieldCalculationServiceProto";
option java_package = "com.acme.forms.v1";

// Computes the figures of a form field, such as totals, taxes, and estimates.
service FormFieldCalculationService {
  // Calculates a form field.
  rpc CalculateFormField(CalculateFormFieldRequest) returns (CalculateFormFieldResponse);

  // Estimates a form field.
  rpc EstimateFormField(EstimateFormFieldRequest) returns (EstimateFormFieldResponse);

  // Quotes a form field.
  rpc QuoteFormField(QuoteFormFieldRequest) returns (QuoteFormFieldResponse);

  // Compares a form field.
  rpc CompareFormFieldOptions(CompareFormFieldOptionsRequest) returns (CompareFormFieldOptionsResponse);

  // Simulates a form field.
  rpc SimulateFormField(SimulateFormFieldRequest) returns (SimulateFormFieldResponse);

  // Returns a form field.
  rpc GetFormFieldRates(GetFormFieldRatesRequest) returns (GetFormFieldRatesResponse);
}

// The request of `CalculateFormField`.
message CalculateFormFieldRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string form_field_id = 2;
  FormField form_field = 3;
  CalculateFormFieldRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateFormField`.
message CalculateFormFieldResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateFormFieldResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FormField form_field = 1;
  CalculateFormFieldResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

