syntax = "proto3";

package acme.certificates.v1;

import "acme/certificates/v1/certificates.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Certificates.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/certificates/v1;certificatesv1";
option java_multiple_files = true;
option java_outer_classname = "CertificateCalculationServiceProto";
option java_package = "com.acme.certificates.v1";

// Computes the figures of a certificate, such as totals, taxes, and estimates.
service CertificateCalculationService {
  // Calculates a certificate.
  rpc CalculateCertificate(CalculateCertificateRequest) returns (CalculateCertificateResponse);

  // Estimates a certificate.
  rpc EstimateCertificate(EstimateCertificateRequest) returns (EstimateCertificateResponse);

  // Quotes a certificate.
  rpc QuoteCertificate(QuoteCertificateRequest) returns (QuoteCertificateResponse);

  // Compares a certificate.
  rpc CompareCertificateOptions(CompareCertificateOptionsRequest) returns (CompareCertificateOptionsResponse);

  // Recalculates a certificate.
  rpc RecalculateCertificates(RecalculateCertificatesRequest) returns (RecalculateCertificatesResponse);

  // Simulates a certificate.
  rpc SimulateCertificate(SimulateCertificateRequest) returns (SimulateCertificateResponse);

  // Explains a certificate.
  rpc ExplainCertificateCalculation(ExplainCertificateCalculationRequest) returns (ExplainCertificateCalculationResponse);

  // Returns a certificate.
  rpc GetCertificateRates(GetCertificateRatesRequest) returns (GetCertificateRatesResponse);
}

// The request of `CalculateCertificate`.
message CalculateCertificateRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string certificate_id = 2;
  Certificate certificate = 3;
  CalculateCertificateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCertificate`.
message CalculateCertificateResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCertificateResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Certificate certificate = 1;
  CalculateCertificateResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

