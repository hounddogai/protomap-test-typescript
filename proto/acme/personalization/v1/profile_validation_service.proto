syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "ProfileValidationServiceProto";
option java_package = "com.acme.personalization.v1";

// Checks profiles against the rules before anything acts on them.
service ProfileValidationService {
  // Validates a profile.
  rpc ValidateProfile(ValidateProfileRequest) returns (ValidateProfileResponse);

  // Previews a profile.
  rpc PreviewProfile(PreviewProfileRequest) returns (PreviewProfileResponse);

  // Checks a profile.
  rpc CheckProfileEligibility(CheckProfileEligibilityRequest) returns (CheckProfileEligibilityResponse);

  // Normalizes a profile.
  rpc NormalizeProfile(NormalizeProfileRequest) returns (NormalizeProfileResponse);

  // Explains a profile.
  rpc ExplainProfileDecision(ExplainProfileDecisionRequest) returns (ExplainProfileDecisionResponse);

  // Scores a profile.
  rpc ScoreProfile(ScoreProfileRequest) returns (ScoreProfileResponse);

  // Lints a profile.
  rpc LintProfiles(LintProfilesRequest) returns (LintProfilesResponse);

  // Returns a profile.
  rpc GetProfileRules(GetProfileRulesRequest) returns (GetProfileRulesResponse);
}

// The request of `ValidateProfile`.
message ValidateProfileRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  Profile profile = 3;
  ValidateProfileRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateProfile`.
message ValidateProfileResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Profile profile = 1;
  ValidateProfileResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

