syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationValidationServiceProto";
option java_package = "com.acme.personalization.v1";

// Checks recommendations against the rules before anything acts on them.
service RecommendationValidationService {
  // Validates a recommendation.
  rpc ValidateRecommendation(ValidateRecommendationRequest) returns (ValidateRecommendationResponse);

  // Previews a recommendation.
  rpc PreviewRecommendation(PreviewRecommendationRequest) returns (PreviewRecommendationResponse);

  // Checks a recommendation.
  rpc CheckRecommendationEligibility(CheckRecommendationEligibilityRequest) returns (CheckRecommendationEligibilityResponse);

  // Normalizes a recommendation.
  rpc NormalizeRecommendation(NormalizeRecommendationRequest) returns (NormalizeRecommendationResponse);

  // Explains a recommendation.
  rpc ExplainRecommendationDecision(ExplainRecommendationDecisionRequest) returns (ExplainRecommendationDecisionResponse);

  // Scores a recommendation.
  rpc ScoreRecommendation(ScoreRecommendationRequest) returns (ScoreRecommendationResponse);

  // Lints a recommendation.
  rpc LintRecommendations(LintRecommendationsRequest) returns (LintRecommendationsResponse);

  // Returns a recommendation.
  rpc GetRecommendationRules(GetRecommendationRulesRequest) returns (GetRecommendationRulesResponse);
}

// The request of `ValidateRecommendation`.
message ValidateRecommendationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  Recommendation recommendation = 3;
  ValidateRecommendationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRecommendation`.
message ValidateRecommendationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Recommendation recommendation = 1;
  ValidateRecommendationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

