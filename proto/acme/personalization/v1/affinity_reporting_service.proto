syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "AffinityReportingServiceProto";
option java_package = "com.acme.personalization.v1";

// Builds and schedules reports about affinities.
service AffinityReportingService {
  // Generates an affinity.
  rpc GenerateAffinityReport(GenerateAffinityReportRequest) returns (GenerateAffinityReportResponse);

  // Returns an affinity.
  rpc FetchAffinityReport(FetchAffinityReportRequest) returns (FetchAffinityReportResponse);

  // Schedules an affinity.
  rpc ScheduleAffinityReport(ScheduleAffinityReportRequest) returns (ScheduleAffinityReportResponse);

  // Lists affinities a page at a time.
  rpc ListAffinityReports(ListAffinityReportsRequest) returns (ListAffinityReportsResponse);

  // Shares an affinity.
  rpc ShareAffinityReport(ShareAffinityReportRequest) returns (ShareAffinityReportResponse);

  // Counts affinities by status.
  rpc CountAffinityTotals(CountAffinityTotalsRequest) returns (CountAffinityTotalsResponse);

  // Deletes an affinity.
  rpc DeleteAffinityReport(DeleteAffinityReportRequest) returns (DeleteAffinityReportResponse);
}

// The request of `GenerateAffinityReport`.
message GenerateAffinityReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  GenerateAffinityReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateAffinityReport`.
message GenerateAffinityReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchAffinityReport`.
message FetchAffinityReportRequest {
  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchAffinityReport`.
message FetchAffinityReportResponse {
  Affinity affinity = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleAffinityReport`.
message ScheduleAffinityReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  ScheduleAffinityReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleAffinityReport`.
message ScheduleAffinityReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListAffinityReports`.
message ListAffinityReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AffinityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAffinityReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAffinityReports`.
message ListAffinityReportsResponse {
  repeated Affinity affinities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareAffinityReport`.
message ShareAffinityReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  ShareAffinityReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareAffinityReport`.
message ShareAffinityReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Affinity affinity = 1;
  ShareAffinityReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAffinityTotals`.
message CountAffinityTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AffinityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAffinityTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAffinityTotals`.
message CountAffinityTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteAffinityReport`.
message DeleteAffinityReportRequest {
  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteAffinityReport`.
message DeleteAffinityReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
