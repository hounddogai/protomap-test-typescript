syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "AffinityCalculationServiceProto";
option java_package = "com.acme.personalization.v1";

// Computes the figures of an affinity, such as totals, taxes, and estimates.
service AffinityCalculationService {
  // Calculates an affinity.
  rpc CalculateAffinity(CalculateAffinityRequest) returns (CalculateAffinityResponse);

  // Estimates an affinity.
  rpc EstimateAffinity(EstimateAffinityRequest) returns (EstimateAffinityResponse);

  // Quotes an affinity.
  rpc QuoteAffinity(QuoteAffinityRequest) returns (QuoteAffinityResponse);

  // Compares an affinity.
  rpc CompareAffinityOptions(CompareAffinityOptionsRequest) returns (CompareAffinityOptionsResponse);

  // Simulates an affinity.
  rpc SimulateAffinity(SimulateAffinityRequest) returns (SimulateAffinityResponse);

  // Explains an affinity.
  rpc ExplainAffinityCalculation(ExplainAffinityCalculationRequest) returns (ExplainAffinityCalculationResponse);

  // Returns an affinity.
  rpc GetAffinityRates(GetAffinityRatesRequest) returns (GetAffinityRatesResponse);
}

// The request of `CalculateAffinity`.
message CalculateAffinityRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  Affinity affinity = 3;
  CalculateAffinityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAffinity`.
message CalculateAffinityResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAffinityResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Affinity affinity = 1;
  CalculateAffinityResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

