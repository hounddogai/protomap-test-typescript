syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationCalculationServiceProto";
option java_package = "com.acme.personalization.v1";

// Computes the figures of a recommendation, such as totals, taxes, and estimates.
service RecommendationCalculationService {
  // Calculates a recommendation.
  rpc CalculateRecommendation(CalculateRecommendationRequest) returns (CalculateRecommendationResponse);

  // Estimates a recommendation.
  rpc EstimateRecommendation(EstimateRecommendationRequest) returns (EstimateRecommendationResponse);

  // Quotes a recommendation.
  rpc QuoteRecommendation(QuoteRecommendationRequest) returns (QuoteRecommendationResponse);

  // Compares a recommendation.
  rpc CompareRecommendationOptions(CompareRecommendationOptionsRequest) returns (CompareRecommendationOptionsResponse);

  // Recalculates a recommendation.
  rpc RecalculateRecommendations(RecalculateRecommendationsRequest) returns (RecalculateRecommendationsResponse);

  // Simulates a recommendation.
  rpc SimulateRecommendation(SimulateRecommendationRequest) returns (SimulateRecommendationResponse);

  // Explains a recommendation.
  rpc ExplainRecommendationCalculation(ExplainRecommendationCalculationRequest) returns (ExplainRecommendationCalculationResponse);

  // Returns a recommendation.
  rpc GetRecommendationRates(GetRecommendationRatesRequest) returns (GetRecommendationRatesResponse);
}

// The request of `CalculateRecommendation`.
message CalculateRecommendationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  Recommendation recommendation = 3;
  CalculateRecommendationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRecommendation`.
message CalculateRecommendationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRecommendationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Recommendation recommendation = 1;
  CalculateRecommendationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

