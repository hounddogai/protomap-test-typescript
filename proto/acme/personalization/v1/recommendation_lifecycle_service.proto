syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationLifecycleServiceProto";
option java_package = "com.acme.personalization.v1";

// Moves a recommendation between the states of its lifecycle.
service RecommendationLifecycleService {
  // Activates a recommendation.
  rpc ActivateRecommendation(ActivateRecommendationRequest) returns (ActivateRecommendationResponse);

  // Suspends a recommendation.
  rpc SuspendRecommendation(SuspendRecommendationRequest) returns (SuspendRecommendationResponse);

  // Reinstates a recommendation.
  rpc ReinstateRecommendation(ReinstateRecommendationRequest) returns (ReinstateRecommendationResponse);

  // Terminates a recommendation.
  rpc TerminateRecommendation(TerminateRecommendationRequest) returns (TerminateRecommendationResponse);

  // Renews a recommendation.
  rpc RenewRecommendation(RenewRecommendationRequest) returns (RenewRecommendationResponse);

  // Expires a recommendation.
  rpc ExpireRecommendation(ExpireRecommendationRequest) returns (ExpireRecommendationResponse);

  // Returns a recommendation.
  rpc GetRecommendationLifecycle(GetRecommendationLifecycleRequest) returns (GetRecommendationLifecycleResponse);
}

// The request of `ActivateRecommendation`.
message ActivateRecommendationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  ActivateRecommendationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRecommendation`.
message ActivateRecommendationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Recommendation recommendation = 1;
  ActivateRecommendationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

