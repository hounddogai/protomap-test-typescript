syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "ProfileReportingServiceProto";
option java_package = "com.acme.personalization.v1";

// Builds and schedules reports about profiles.
service ProfileReportingService {
  // Generates a profile.
  rpc GenerateProfileReport(GenerateProfileReportRequest) returns (GenerateProfileReportResponse);

  // Returns a profile.
  rpc FetchProfileReport(FetchProfileReportRequest) returns (FetchProfileReportResponse);

  // Lists profiles a page at a time.
  rpc ListProfileReports(ListProfileReportsRequest) returns (ListProfileReportsResponse);

  // Shares a profile.
  rpc ShareProfileReport(ShareProfileReportRequest) returns (ShareProfileReportResponse);

  // Counts profiles by status.
  rpc CountProfileTotals(CountProfileTotalsRequest) returns (CountProfileTotalsResponse);

  // Deletes a profile.
  rpc DeleteProfileReport(DeleteProfileReportRequest) returns (DeleteProfileReportResponse);
}

// The request of `GenerateProfileReport`.
message GenerateProfileReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  GenerateProfileReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateProfileReport`.
message GenerateProfileReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchProfileReport`.
message FetchProfileReportRequest {
  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchProfileReport`.
message FetchProfileReportResponse {
  Profile profile = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListProfileReports`.
message ListProfileReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ProfileStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListProfileReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListProfileReports`.
message ListProfileReportsResponse {
  repeated Profile profiles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareProfileReport`.
message ShareProfileReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  ShareProfileReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareProfileReport`.
message ShareProfileReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Profile profile = 1;
  ShareProfileReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountProfileTotals`.
message CountProfileTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ProfileStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountProfileTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountProfileTotals`.
message CountProfileTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteProfileReport`.
message DeleteProfileReportRequest {
  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteProfileReport`.
message DeleteProfileReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
