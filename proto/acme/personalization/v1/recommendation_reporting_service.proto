syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationReportingServiceProto";
option java_package = "com.acme.personalization.v1";

// Builds and schedules reports about recommendations.
service RecommendationReportingService {
  // Generates a recommendation.
  rpc GenerateRecommendationReport(GenerateRecommendationReportRequest) returns (GenerateRecommendationReportResponse);

  // Returns a recommendation.
  rpc FetchRecommendationReport(FetchRecommendationReportRequest) returns (FetchRecommendationReportResponse);

  // Schedules a recommendation.
  rpc ScheduleRecommendationReport(ScheduleRecommendationReportRequest) returns (ScheduleRecommendationReportResponse);

  // Streams the changes of recommendations as they happen.
  rpc StreamRecommendationMetrics(StreamRecommendationMetricsRequest) returns (stream StreamRecommendationMetricsResponse);

  // Lists recommendations a page at a time.
  rpc ListRecommendationReports(ListRecommendationReportsRequest) returns (ListRecommendationReportsResponse);

  // Shares a recommendation.
  rpc ShareRecommendationReport(ShareRecommendationReportRequest) returns (ShareRecommendationReportResponse);

  // Counts recommendations by status.
  rpc CountRecommendationTotals(CountRecommendationTotalsRequest) returns (CountRecommendationTotalsResponse);

  // Deletes a recommendation.
  rpc DeleteRecommendationReport(DeleteRecommendationReportRequest) returns (DeleteRecommendationReportResponse);
}

// The request of `GenerateRecommendationReport`.
message GenerateRecommendationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  GenerateRecommendationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRecommendationReport`.
message GenerateRecommendationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRecommendationReport`.
message FetchRecommendationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRecommendationReport`.
message FetchRecommendationReportResponse {
  Recommendation recommendation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleRecommendationReport`.
message ScheduleRecommendationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  ScheduleRecommendationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRecommendationReport`.
message ScheduleRecommendationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamRecommendationMetrics`.
message StreamRecommendationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRecommendationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRecommendationMetrics`.
message StreamRecommendationMetricsResponse {
  Recommendation recommendation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRecommendationReports`.
message ListRecommendationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRecommendationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRecommendationReports`.
message ListRecommendationReportsResponse {
  repeated Recommendation recommendations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRecommendationReport`.
message ShareRecommendationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  ShareRecommendationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRecommendationReport`.
message ShareRecommendationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Recommendation recommendation = 1;
  ShareRecommendationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRecommendationTotals`.
message CountRecommendationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RecommendationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRecommendationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRecommendationTotals`.
message CountRecommendationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteRecommendationReport`.
message DeleteRecommendationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRecommendationReport`.
message DeleteRecommendationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
