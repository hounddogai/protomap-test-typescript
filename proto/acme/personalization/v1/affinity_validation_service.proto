syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "AffinityValidationServiceProto";
option java_package = "com.acme.personalization.v1";

// Checks affinities against the rules before anything acts on them.
service AffinityValidationService {
  // Validates an affinity.
  rpc ValidateAffinity(ValidateAffinityRequest) returns (ValidateAffinityResponse);

  // Previews an affinity.
  rpc PreviewAffinity(PreviewAffinityRequest) returns (PreviewAffinityResponse);

  // Checks an affinity.
  rpc CheckAffinityEligibility(CheckAffinityEligibilityRequest) returns (CheckAffinityEligibilityResponse);

  // Normalizes an affinity.
  rpc NormalizeAffinity(NormalizeAffinityRequest) returns (NormalizeAffinityResponse);

  // Explains an affinity.
  rpc ExplainAffinityDecision(ExplainAffinityDecisionRequest) returns (ExplainAffinityDecisionResponse);

  // Lints an affinity.
  rpc LintAffinities(LintAffinitiesRequest) returns (LintAffinitiesResponse);
}

// The request of `ValidateAffinity`.
message ValidateAffinityRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  Affinity affinity = 3;
  ValidateAffinityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAffinity`.
message ValidateAffinityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Affinity affinity = 1;
  ValidateAffinityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

