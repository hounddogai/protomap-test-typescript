syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "AffinityImportServiceProto";
option java_package = "com.acme.personalization.v1";

// Takes affinities in bulk from partners and legacy systems.
service AffinityImportService {
  // Takes a stream of affinities and answers once at the end.
  rpc ImportAffinities(stream ImportAffinitiesRequest) returns (ImportAffinitiesResponse);

  // Returns an affinity.
  rpc GetAffinityImportStatus(GetAffinityImportStatusRequest) returns (GetAffinityImportStatusResponse);

  // Cancels an affinity.
  rpc CancelAffinityImport(CancelAffinityImportRequest) returns (CancelAffinityImportResponse);

  // Lists affinities a page at a time.
  rpc ListAffinityImports(ListAffinityImportsRequest) returns (ListAffinityImportsResponse);

  // Retrys an affinity.
  rpc RetryAffinityImport(RetryAffinityImportRequest) returns (RetryAffinityImportResponse);

  // Maps an affinity.
  rpc MapAffinityImportColumns(MapAffinityImportColumnsRequest) returns (MapAffinityImportColumnsResponse);
}

// The request of `ImportAffinities`.
message ImportAffinitiesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportAffinitiesRequest.StreamHeader header = 2;
    Affinity record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportAffinities`.
message ImportAffinitiesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string affinity_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportAffinitiesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetAffinityImportStatus`.
message GetAffinityImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAffinityImportStatus`.
message GetAffinityImportStatusResponse {
  Affinity affinity = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelAffinityImport`.
message CancelAffinityImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  CancelAffinityImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelAffinityImport`.
message CancelAffinityImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Affinity affinity = 1;
  CancelAffinityImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListAffinityImports`.
message ListAffinityImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AffinityStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAffinityImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAffinityImports`.
message ListAffinityImportsResponse {
  repeated Affinity affinities = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryAffinityImport`.
message RetryAffinityImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  Affinity affinity = 3;
  RetryAffinityImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryAffinityImport`.
message RetryAffinityImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Affinity affinity = 1;
  RetryAffinityImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapAffinityImportColumns`.
message MapAffinityImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  Affinity affinity = 3;
  MapAffinityImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapAffinityImportColumns`.
message MapAffinityImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Affinity affinity = 1;
  MapAffinityImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
