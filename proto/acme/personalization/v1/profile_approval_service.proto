syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "ProfileApprovalServiceProto";
option java_package = "com.acme.personalization.v1";

// Routes profiles through approval, with escalation and delegation.
service ProfileApprovalService {
  // Submits a profile.
  rpc SubmitProfile(SubmitProfileRequest) returns (SubmitProfileResponse);

  // Approves a profile.
  rpc ApproveProfile(ApproveProfileRequest) returns (ApproveProfileResponse);

  // Rejects a profile.
  rpc RejectProfile(RejectProfileRequest) returns (RejectProfileResponse);

  // Escalates a profile.
  rpc EscalateProfile(EscalateProfileRequest) returns (EscalateProfileResponse);

  // Lists profiles a page at a time.
  rpc ListPendingProfiles(ListPendingProfilesRequest) returns (ListPendingProfilesResponse);

  // Delegates a profile.
  rpc DelegateProfileApproval(DelegateProfileApprovalRequest) returns (DelegateProfileApprovalResponse);

  // Recalls a profile.
  rpc RecallProfile(RecallProfileRequest) returns (RecallProfileResponse);

  // Returns a profile.
  rpc GetProfileApprovalStatus(GetProfileApprovalStatusRequest) returns (GetProfileApprovalStatusResponse);

  // Comments a profile.
  rpc CommentProfileApproval(CommentProfileApprovalRequest) returns (CommentProfileApprovalResponse);
}

// The request of `SubmitProfile`.
message SubmitProfileRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  Profile profile = 3;
  SubmitProfileRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitProfile`.
message SubmitProfileResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Profile profile = 1;
  SubmitProfileResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

