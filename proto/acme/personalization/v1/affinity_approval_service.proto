syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "AffinityApprovalServiceProto";
option java_package = "com.acme.personalization.v1";

// Routes affinities through approval, with escalation and delegation.
service AffinityApprovalService {
  // Submits an affinity.
  rpc SubmitAffinity(SubmitAffinityRequest) returns (SubmitAffinityResponse);

  // Approves an affinity.
  rpc ApproveAffinity(ApproveAffinityRequest) returns (ApproveAffinityResponse);

  // Rejects an affinity.
  rpc RejectAffinity(RejectAffinityRequest) returns (RejectAffinityResponse);

  // Escalates an affinity.
  rpc EscalateAffinity(EscalateAffinityRequest) returns (EscalateAffinityResponse);

  // Lists affinities a page at a time.
  rpc ListPendingAffinities(ListPendingAffinitiesRequest) returns (ListPendingAffinitiesResponse);

  // Delegates an affinity.
  rpc DelegateAffinityApproval(DelegateAffinityApprovalRequest) returns (DelegateAffinityApprovalResponse);

  // Recalls an affinity.
  rpc RecallAffinity(RecallAffinityRequest) returns (RecallAffinityResponse);

  // Returns an affinity.
  rpc GetAffinityApprovalStatus(GetAffinityApprovalStatusRequest) returns (GetAffinityApprovalStatusResponse);

  // Comments an affinity.
  rpc CommentAffinityApproval(CommentAffinityApprovalRequest) returns (CommentAffinityApprovalResponse);
}

// The request of `SubmitAffinity`.
message SubmitAffinityRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string affinity_id = 2;
  Affinity affinity = 3;
  SubmitAffinityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAffinity`.
message SubmitAffinityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Affinity affinity = 1;
  SubmitAffinityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

