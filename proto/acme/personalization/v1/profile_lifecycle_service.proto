syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "ProfileLifecycleServiceProto";
option java_package = "com.acme.personalization.v1";

// Moves a profile between the states of its lifecycle.
service ProfileLifecycleService {
  // Activates a profile.
  rpc ActivateProfile(ActivateProfileRequest) returns (ActivateProfileResponse);

  // Suspends a profile.
  rpc SuspendProfile(SuspendProfileRequest) returns (SuspendProfileResponse);

  // Reinstates a profile.
  rpc ReinstateProfile(ReinstateProfileRequest) returns (ReinstateProfileResponse);

  // Terminates a profile.
  rpc TerminateProfile(TerminateProfileRequest) returns (TerminateProfileResponse);

  // Renews a profile.
  rpc RenewProfile(RenewProfileRequest) returns (RenewProfileResponse);

  // Expires a profile.
  rpc ExpireProfile(ExpireProfileRequest) returns (ExpireProfileResponse);

  // Returns a profile.
  rpc GetProfileLifecycle(GetProfileLifecycleRequest) returns (GetProfileLifecycleResponse);

  // Schedules a profile.
  rpc ScheduleProfileExpiry(ScheduleProfileExpiryRequest) returns (ScheduleProfileExpiryResponse);
}

// The request of `ActivateProfile`.
message ActivateProfileRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string profile_id = 2;
  ActivateProfileRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateProfile`.
message ActivateProfileResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Profile profile = 1;
  ActivateProfileResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

