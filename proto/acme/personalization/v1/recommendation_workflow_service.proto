syntax = "proto3";

package acme.personalization.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/personalization/v1/personalization.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Personalization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/personalization/v1;personalizationv1";
option java_multiple_files = true;
option java_outer_classname = "RecommendationWorkflowServiceProto";
option java_package = "com.acme.personalization.v1";

// Runs the long-lived workflow that takes a recommendation from start to finish.
service RecommendationWorkflowService {
  // Starts a recommendation.
  rpc StartRecommendationWorkflow(StartRecommendationWorkflowRequest) returns (StartRecommendationWorkflowResponse);

  // Advances a recommendation.
  rpc AdvanceRecommendationWorkflow(AdvanceRecommendationWorkflowRequest) returns (AdvanceRecommendationWorkflowResponse);

  // Cancels a recommendation.
  rpc CancelRecommendationWorkflow(CancelRecommendationWorkflowRequest) returns (CancelRecommendationWorkflowResponse);

  // Retrys a recommendation.
  rpc RetryRecommendationWorkflow(RetryRecommendationWorkflowRequest) returns (RetryRecommendationWorkflowResponse);

  // Pauses a recommendation.
  rpc PauseRecommendationWorkflow(PauseRecommendationWorkflowRequest) returns (PauseRecommendationWorkflowResponse);

  // Resumes a recommendation.
  rpc ResumeRecommendationWorkflow(ResumeRecommendationWorkflowRequest) returns (ResumeRecommendationWorkflowResponse);

  // Lists recommendations a page at a time.
  rpc ListRecommendationWorkflows(ListRecommendationWorkflowsRequest) returns (ListRecommendationWorkflowsResponse);

  // Signals a recommendation.
  rpc SignalRecommendationWorkflow(SignalRecommendationWorkflowRequest) returns (SignalRecommendationWorkflowResponse);
}

// The request of `StartRecommendationWorkflow`.
message StartRecommendationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string recommendation_id = 2;
  Recommendation recommendation = 3;
  StartRecommendationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRecommendationWorkflow`.
message StartRecommendationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Recommendation recommendation = 1;
  StartRecommendationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

