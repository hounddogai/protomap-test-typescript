syntax = "proto3";

package acme.helpdesk.v1;

option csharp_namespace = "Acme.Helpdesk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/helpdesk/v1;helpdeskv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.helpdesk.v1";

// A reference to a ticket of the helpdesk domain.
message TicketRef {
  string ticket_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a knowledge article of the helpdesk domain.
message KnowledgeArticleRef {
  string knowledge_article_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a sla policy of the helpdesk domain.
message SlaPolicyRef {
  string sla_policy_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to an escalation of the helpdesk domain.
message EscalationRef {
  string escalation_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
