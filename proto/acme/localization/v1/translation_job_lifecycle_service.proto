option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationJobLifecycleServiceProto";
option java_package = "com.acme.localization.v1";

// Moves a translation job between the states of its lifecycle.
service TranslationJobLifecycleService {
  // Activates a translation job.
  rpc ActivateTranslationJob(ActivateTranslationJobRequest) returns (ActivateTranslationJobResponse);

  // Suspends a translation job.
  rpc SuspendTranslationJob(SuspendTranslationJobRequest) returns (SuspendTranslationJobResponse);

  // Reinstates a translation job.
  rpc ReinstateTranslationJob(ReinstateTranslationJobRequest) returns (ReinstateTranslationJobResponse);

  // Terminates a translation job.
  rpc TerminateTranslationJob(TerminateTranslationJobRequest) returns (TerminateTranslationJobResponse);

  // Renews a translation job.
  rpc RenewTranslationJob(RenewTranslationJobRequest) returns (RenewTranslationJobResponse);

  // Expires a translation job.
  rpc ExpireTranslationJob(ExpireTranslationJobRequest) returns (ExpireTranslationJobResponse);

  // Returns a translation job.
  rpc GetTranslationJobLifecycle(GetTranslationJobLifecycleRequest) returns (GetTranslationJobLifecycleResponse);

  // Schedules a translation job.
  rpc ScheduleTranslationJobExpiry(ScheduleTranslationJobExpiryRequest) returns (ScheduleTranslationJobExpiryResponse);
}

// The request of `ActivateTranslationJob`.
message ActivateTranslationJobRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  ActivateTranslationJobRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTranslationJob`.
message ActivateTranslationJobResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranslationJob translation_job = 1;
  ActivateTranslationJobResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

