syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "LocaleCalculationServiceProto";
option java_package = "com.acme.localization.v1";

// Computes the figures of a locale, such as totals, taxes, and estimates.
service LocaleCalculationService {
  // Calculates a locale.
  rpc CalculateLocale(CalculateLocaleRequest) returns (CalculateLocaleResponse);

  // Estimates a locale.
  rpc EstimateLocale(EstimateLocaleRequest) returns (EstimateLocaleResponse);

  // Quotes a locale.
  rpc QuoteLocale(QuoteLocaleRequest) returns (QuoteLocaleResponse);

  // Compares a locale.
  rpc CompareLocaleOptions(CompareLocaleOptionsRequest) returns (CompareLocaleOptionsResponse);

  // Recalculates a locale.
  rpc RecalculateLocales(RecalculateLocalesRequest) returns (RecalculateLocalesResponse);

  // Simulates a locale.
  rpc SimulateLocale(SimulateLocaleRequest) returns (SimulateLocaleResponse);

  // Explains a locale.
  rpc ExplainLocaleCalculation(ExplainLocaleCalculationRequest) returns (ExplainLocaleCalculationResponse);

  // Returns a locale.
  rpc GetLocaleRates(GetLocaleRatesRequest) returns (GetLocaleRatesResponse);
}

// The request of `CalculateLocale`.
message CalculateLocaleRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string locale_id = 2;
  Locale locale = 3;
  CalculateLocaleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLocale`.
message CalculateLocaleResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLocaleResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Locale locale = 1;
  CalculateLocaleResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

