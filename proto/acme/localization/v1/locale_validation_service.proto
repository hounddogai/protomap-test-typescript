syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "LocaleValidationServiceProto";
option java_package = "com.acme.localization.v1";

// Checks locales against the rules before anything acts on them.
service LocaleValidationService {
  // Validates a locale.
  rpc ValidateLocale(ValidateLocaleRequest) returns (ValidateLocaleResponse);

  // Previews a locale.
  rpc PreviewLocale(PreviewLocaleRequest) returns (PreviewLocaleResponse);

  // Checks a locale.
  rpc CheckLocaleEligibility(CheckLocaleEligibilityRequest) returns (CheckLocaleEligibilityResponse);

  // Normalizes a locale.
  rpc NormalizeLocale(NormalizeLocaleRequest) returns (NormalizeLocaleResponse);

  // Explains a locale.
  rpc ExplainLocaleDecision(ExplainLocaleDecisionRequest) returns (ExplainLocaleDecisionResponse);

  // Scores a locale.
  rpc ScoreLocale(ScoreLocaleRequest) returns (ScoreLocaleResponse);

  // Lints a locale.
  rpc LintLocales(LintLocalesRequest) returns (LintLocalesResponse);

  // Returns a locale.
  rpc GetLocaleRules(GetLocaleRulesRequest) returns (GetLocaleRulesResponse);
}

// The request of `ValidateLocale`.
message ValidateLocaleRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string locale_id = 2;
  Locale locale = 3;
  ValidateLocaleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLocale`.
message ValidateLocaleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Locale locale = 1;
  ValidateLocaleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

