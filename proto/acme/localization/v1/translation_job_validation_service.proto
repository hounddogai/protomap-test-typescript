syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationJobValidationServiceProto";
option java_package = "com.acme.localization.v1";

// Checks translation jobs against the rules before anything acts on them.
service TranslationJobValidationService {
  // Validates a translation job.
  rpc ValidateTranslationJob(ValidateTranslationJobRequest) returns (ValidateTranslationJobResponse);

  // Previews a translation job.
  rpc PreviewTranslationJob(PreviewTranslationJobRequest) returns (PreviewTranslationJobResponse);

  // Normalizes a translation job.
  rpc NormalizeTranslationJob(NormalizeTranslationJobRequest) returns (NormalizeTranslationJobResponse);

  // Explains a translation job.
  rpc ExplainTranslationJobDecision(ExplainTranslationJobDecisionRequest) returns (ExplainTranslationJobDecisionResponse);

  // Scores a translation job.
  rpc ScoreTranslationJob(ScoreTranslationJobRequest) returns (ScoreTranslationJobResponse);

  // Lints a translation job.
  rpc LintTranslationJobs(LintTranslationJobsRequest) returns (LintTranslationJobsResponse);

  // Returns a translation job.
  rpc GetTranslationJobRules(GetTranslationJobRulesRequest) returns (GetTranslationJobRulesResponse);
}

// The request of `ValidateTranslationJob`.
message ValidateTranslationJobRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  TranslationJob translation_job = 3;
  ValidateTranslationJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTranslationJob`.
message ValidateTranslationJobResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranslationJob translation_job = 1;
  ValidateTranslationJobResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

