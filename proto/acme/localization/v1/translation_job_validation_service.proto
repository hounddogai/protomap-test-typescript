}

// The request of `GetTranslationJobRules`.
message GetTranslationJobRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTranslationJobRules`.
message GetTranslationJobRulesResponse {
  TranslationJob translation_job = 1;
  acme.common.v1.OperationResult result = 2;
}
