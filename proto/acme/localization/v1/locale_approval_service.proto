syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "LocaleApprovalServiceProto";
option java_package = "com.acme.localization.v1";

// Routes locales through approval, with escalation and delegation.
service LocaleApprovalService {
  // Submits a locale.
  rpc SubmitLocale(SubmitLocaleRequest) returns (SubmitLocaleResponse);

  // Approves a locale.
  rpc ApproveLocale(ApproveLocaleRequest) returns (ApproveLocaleResponse);

  // Rejects a locale.
  rpc RejectLocale(RejectLocaleRequest) returns (RejectLocaleResponse);

  // Escalates a locale.
  rpc EscalateLocale(EscalateLocaleRequest) returns (EscalateLocaleResponse);

  // Lists locales a page at a time.
  rpc ListPendingLocales(ListPendingLocalesRequest) returns (ListPendingLocalesResponse);

  // Delegates a locale.
  rpc DelegateLocaleApproval(DelegateLocaleApprovalRequest) returns (DelegateLocaleApprovalResponse);

  // Recalls a locale.
  rpc RecallLocale(RecallLocaleRequest) returns (RecallLocaleResponse);

  // Returns a locale.
  rpc GetLocaleApprovalStatus(GetLocaleApprovalStatusRequest) returns (GetLocaleApprovalStatusResponse);

  // Comments a locale.
  rpc CommentLocaleApproval(CommentLocaleApprovalRequest) returns (CommentLocaleApprovalResponse);
}

// The request of `SubmitLocale`.
message SubmitLocaleRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string locale_id = 2;
  Locale locale = 3;
  SubmitLocaleRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitLocale`.
message SubmitLocaleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Locale locale = 1;
  SubmitLocaleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

