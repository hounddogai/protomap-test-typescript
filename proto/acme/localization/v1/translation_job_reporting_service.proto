syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationJobReportingServiceProto";
option java_package = "com.acme.localization.v1";

// Builds and schedules reports about translation jobs.
service TranslationJobReportingService {
  // Generates a translation job.
  rpc GenerateTranslationJobReport(GenerateTranslationJobReportRequest) returns (GenerateTranslationJobReportResponse);

  // Returns a translation job.
  rpc FetchTranslationJobReport(FetchTranslationJobReportRequest) returns (FetchTranslationJobReportResponse);

  // Schedules a translation job.
  rpc ScheduleTranslationJobReport(ScheduleTranslationJobReportRequest) returns (ScheduleTranslationJobReportResponse);

  // Streams the changes of translation jobs as they happen.
  rpc StreamTranslationJobMetrics(StreamTranslationJobMetricsRequest) returns (stream StreamTranslationJobMetricsResponse);

  // Lists translation jobs a page at a time.
  rpc ListTranslationJobReports(ListTranslationJobReportsRequest) returns (ListTranslationJobReportsResponse);

  // Shares a translation job.
  rpc ShareTranslationJobReport(ShareTranslationJobReportRequest) returns (ShareTranslationJobReportResponse);

  // Counts translation jobs by status.
  rpc CountTranslationJobTotals(CountTranslationJobTotalsRequest) returns (CountTranslationJobTotalsResponse);

  // Deletes a translation job.
  rpc DeleteTranslationJobReport(DeleteTranslationJobReportRequest) returns (DeleteTranslationJobReportResponse);
}

// The request of `GenerateTranslationJobReport`.
message GenerateTranslationJobReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  GenerateTranslationJobReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTranslationJobReport`.
message GenerateTranslationJobReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTranslationJobReport`.
message FetchTranslationJobReportRequest {
  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTranslationJobReport`.
message FetchTranslationJobReportResponse {
  TranslationJob translation_job = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTranslationJobReport`.
message ScheduleTranslationJobReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  ScheduleTranslationJobReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTranslationJobReport`.
message ScheduleTranslationJobReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTranslationJobMetrics`.
message StreamTranslationJobMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranslationJobStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTranslationJobMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTranslationJobMetrics`.
message StreamTranslationJobMetricsResponse {
  TranslationJob translation_job = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListTranslationJobReports`.
message ListTranslationJobReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranslationJobStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTranslationJobReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTranslationJobReports`.
message ListTranslationJobReportsResponse {
  repeated TranslationJob translation_jobs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareTranslationJobReport`.
message ShareTranslationJobReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  ShareTranslationJobReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTranslationJobReport`.
message ShareTranslationJobReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranslationJob translation_job = 1;
  ShareTranslationJobReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTranslationJobTotals`.
message CountTranslationJobTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranslationJobStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTranslationJobTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTranslationJobTotals`.
message CountTranslationJobTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteTranslationJobReport`.
message DeleteTranslationJobReportRequest {
  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTranslationJobReport`.
message DeleteTranslationJobReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
