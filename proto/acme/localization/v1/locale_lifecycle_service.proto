option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "LocaleLifecycleServiceProto";
option java_package = "com.acme.localization.v1";

// Moves a locale between the states of its lifecycle.
service LocaleLifecycleService {
  // Activates a locale.
  rpc ActivateLocale(ActivateLocaleRequest) returns (ActivateLocaleResponse);

  // Suspends a locale.
  rpc SuspendLocale(SuspendLocaleRequest) returns (SuspendLocaleResponse);

  // Reinstates a locale.
  rpc ReinstateLocale(ReinstateLocaleRequest) returns (ReinstateLocaleResponse);

  // Terminates a locale.
  rpc TerminateLocale(TerminateLocaleRequest) returns (TerminateLocaleResponse);

  // Renews a locale.
  rpc RenewLocale(RenewLocaleRequest) returns (RenewLocaleResponse);

  // Expires a locale.
  rpc ExpireLocale(ExpireLocaleRequest) returns (ExpireLocaleResponse);

  // Returns a locale.
  rpc GetLocaleLifecycle(GetLocaleLifecycleRequest) returns (GetLocaleLifecycleResponse);

  // Schedules a locale.
  rpc ScheduleLocaleExpiry(ScheduleLocaleExpiryRequest) returns (ScheduleLocaleExpiryResponse);
}

// The request of `ActivateLocale`.
message ActivateLocaleRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string locale_id = 2;
  ActivateLocaleRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLocale`.
message ActivateLocaleResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Locale locale = 1;
  ActivateLocaleResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

