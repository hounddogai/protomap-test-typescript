option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationKeyWorkflowServiceProto";
option java_package = "com.acme.localization.v1";

// Runs the long-lived workflow that takes a translation key from start to finish.
service TranslationKeyWorkflowService {
  // Starts a translation key.
  rpc StartTranslationKeyWorkflow(StartTranslationKeyWorkflowRequest) returns (StartTranslationKeyWorkflowResponse);

  // Advances a translation key.
  rpc AdvanceTranslationKeyWorkflow(AdvanceTranslationKeyWorkflowRequest) returns (AdvanceTranslationKeyWorkflowResponse);

  // Cancels a translation key.
  rpc CancelTranslationKeyWorkflow(CancelTranslationKeyWorkflowRequest) returns (CancelTranslationKeyWorkflowResponse);

  // Retrys a translation key.
  rpc RetryTranslationKeyWorkflow(RetryTranslationKeyWorkflowRequest) returns (RetryTranslationKeyWorkflowResponse);

  // Pauses a translation key.
  rpc PauseTranslationKeyWorkflow(PauseTranslationKeyWorkflowRequest) returns (PauseTranslationKeyWorkflowResponse);

  // Resumes a translation key.
  rpc ResumeTranslationKeyWorkflow(ResumeTranslationKeyWorkflowRequest) returns (ResumeTranslationKeyWorkflowResponse);

  // Returns a translation key.
  rpc InspectTranslationKeyWorkflow(InspectTranslationKeyWorkflowRequest) returns (InspectTranslationKeyWorkflowResponse);

  // Lists translation keys a page at a time.
  rpc ListTranslationKeyWorkflows(ListTranslationKeyWorkflowsRequest) returns (ListTranslationKeyWorkflowsResponse);

  // Signals a translation key.
  rpc SignalTranslationKeyWorkflow(SignalTranslationKeyWorkflowRequest) returns (SignalTranslationKeyWorkflowResponse);
}

// The request of `StartTranslationKeyWorkflow`.
message StartTranslationKeyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_key_id = 2;
  TranslationKey translation_key = 3;
  StartTranslationKeyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTranslationKeyWorkflow`.
message StartTranslationKeyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranslationKey translation_key = 1;
  StartTranslationKeyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

