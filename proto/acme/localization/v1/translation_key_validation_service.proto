syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationKeyValidationServiceProto";
option java_package = "com.acme.localization.v1";

// Checks translation keys against the rules before anything acts on them.
service TranslationKeyValidationService {
  // Validates a translation key.
  rpc ValidateTranslationKey(ValidateTranslationKeyRequest) returns (ValidateTranslationKeyResponse);

  // Previews a translation key.
  rpc PreviewTranslationKey(PreviewTranslationKeyRequest) returns (PreviewTranslationKeyResponse);

  // Checks a translation key.
  rpc CheckTranslationKeyEligibility(CheckTranslationKeyEligibilityRequest) returns (CheckTranslationKeyEligibilityResponse);

  // Normalizes a translation key.
  rpc NormalizeTranslationKey(NormalizeTranslationKeyRequest) returns (NormalizeTranslationKeyResponse);

  // Explains a translation key.
  rpc ExplainTranslationKeyDecision(ExplainTranslationKeyDecisionRequest) returns (ExplainTranslationKeyDecisionResponse);

  // Scores a translation key.
  rpc ScoreTranslationKey(ScoreTranslationKeyRequest) returns (ScoreTranslationKeyResponse);

  // Returns a translation key.
  rpc GetTranslationKeyRules(GetTranslationKeyRulesRequest) returns (GetTranslationKeyRulesResponse);
}

// The request of `ValidateTranslationKey`.
message ValidateTranslationKeyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_key_id = 2;
  TranslationKey translation_key = 3;
  ValidateTranslationKeyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTranslationKey`.
message ValidateTranslationKeyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranslationKey translation_key = 1;
  ValidateTranslationKeyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

