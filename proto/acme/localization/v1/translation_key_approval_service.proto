syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationKeyApprovalServiceProto";
option java_package = "com.acme.localization.v1";

// Routes translation keys through approval, with escalation and delegation.
service TranslationKeyApprovalService {
  // Submits a translation key.
  rpc SubmitTranslationKey(SubmitTranslationKeyRequest) returns (SubmitTranslationKeyResponse);

  // Approves a translation key.
  rpc ApproveTranslationKey(ApproveTranslationKeyRequest) returns (ApproveTranslationKeyResponse);

  // Rejects a translation key.
  rpc RejectTranslationKey(RejectTranslationKeyRequest) returns (RejectTranslationKeyResponse);

  // Escalates a translation key.
  rpc EscalateTranslationKey(EscalateTranslationKeyRequest) returns (EscalateTranslationKeyResponse);

  // Lists translation keys a page at a time.
  rpc ListPendingTranslationKeys(ListPendingTranslationKeysRequest) returns (ListPendingTranslationKeysResponse);

  // Delegates a translation key.
  rpc DelegateTranslationKeyApproval(DelegateTranslationKeyApprovalRequest) returns (DelegateTranslationKeyApprovalResponse);

  // Recalls a translation key.
  rpc RecallTranslationKey(RecallTranslationKeyRequest) returns (RecallTranslationKeyResponse);

  // Returns a translation key.
  rpc GetTranslationKeyApprovalStatus(GetTranslationKeyApprovalStatusRequest) returns (GetTranslationKeyApprovalStatusResponse);

  // Comments a translation key.
  rpc CommentTranslationKeyApproval(CommentTranslationKeyApprovalRequest) returns (CommentTranslationKeyApprovalResponse);
}

// The request of `SubmitTranslationKey`.
message SubmitTranslationKeyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_key_id = 2;
  TranslationKey translation_key = 3;
  SubmitTranslationKeyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTranslationKey`.
message SubmitTranslationKeyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranslationKey translation_key = 1;
  SubmitTranslationKeyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

