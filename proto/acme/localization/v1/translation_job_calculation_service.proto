syntax = "proto3";

package acme.localization.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/localization/v1/localization.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "TranslationJobCalculationServiceProto";
option java_package = "com.acme.localization.v1";

// Computes the figures of a translation job, such as totals, taxes, and estimates.
service TranslationJobCalculationService {
  // Calculates a translation job.
  rpc CalculateTranslationJob(CalculateTranslationJobRequest) returns (CalculateTranslationJobResponse);

  // Estimates a translation job.
  rpc EstimateTranslationJob(EstimateTranslationJobRequest) returns (EstimateTranslationJobResponse);

  // Quotes a translation job.
  rpc QuoteTranslationJob(QuoteTranslationJobRequest) returns (QuoteTranslationJobResponse);

  // Compares a translation job.
  rpc CompareTranslationJobOptions(CompareTranslationJobOptionsRequest) returns (CompareTranslationJobOptionsResponse);

  // Recalculates a translation job.
  rpc RecalculateTranslationJobs(RecalculateTranslationJobsRequest) returns (RecalculateTranslationJobsResponse);

  // Explains a translation job.
  rpc ExplainTranslationJobCalculation(ExplainTranslationJobCalculationRequest) returns (ExplainTranslationJobCalculationResponse);

  // Returns a translation job.
  rpc GetTranslationJobRates(GetTranslationJobRatesRequest) returns (GetTranslationJobRatesResponse);
}

// The request of `CalculateTranslationJob`.
message CalculateTranslationJobRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string translation_job_id = 2;
  TranslationJob translation_job = 3;
  CalculateTranslationJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTranslationJob`.
message CalculateTranslationJobResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTranslationJobResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TranslationJob translation_job = 1;
  CalculateTranslationJobResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

