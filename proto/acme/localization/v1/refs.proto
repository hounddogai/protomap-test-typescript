syntax = "proto3";

package acme.localization.v1;

option csharp_namespace = "Acme.Localization.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/localization/v1;localizationv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.localization.v1";

// A reference to a translation key of the localization domain.
message TranslationKeyRef {
  string translation_key_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a locale of the localization domain.
message LocaleRef {
  string locale_id = 1;
  string display_name = 2;
  int64 version = 3;
}

// A reference to a translation job of the localization domain.
message TranslationJobRef {
  string translation_job_id = 1;
  string display_name = 2;
  int32 priority = 3;
}
