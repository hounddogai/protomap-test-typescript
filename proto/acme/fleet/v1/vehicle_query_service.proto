syntax = "proto3";

package acme.fleet.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/fleet/v1/fleet.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Fleet.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/fleet/v1;fleetv1";
option java_multiple_files = true;
option java_outer_classname = "VehicleQueryServiceProto";
option java_package = "com.acme.fleet.v1";

// Answers read-only questions about vehicles, for screens and reports.
service VehicleQueryService {
  // Returns a vehicle.
  rpc LookupVehicle(LookupVehicleRequest) returns (LookupVehicleResponse);

  // Lists vehicles a page at a time.
  rpc BrowseVehicles(BrowseVehiclesRequest) returns (BrowseVehiclesResponse);

  // Lists vehicles a page at a time.
  rpc FindVehicles(FindVehiclesRequest) returns (FindVehiclesResponse);

  // Counts vehicles by status.
  rpc CountVehicles(CountVehiclesRequest) returns (CountVehiclesResponse);

  // Returns several vehicles at once.
  rpc ResolveVehicles(ResolveVehiclesRequest) returns (ResolveVehiclesResponse);

  // Streams every matching vehicle.
  rpc ExportVehicles(ExportVehiclesRequest) returns (stream ExportVehiclesResponse);

  // Summarizes a vehicle.
  rpc SummarizeVehicles(SummarizeVehiclesRequest) returns (SummarizeVehiclesResponse);

  // Returns a vehicle.
  rpc PeekVehicle(PeekVehicleRequest) returns (PeekVehicleResponse);
}

// The request of `LookupVehicle`.
message LookupVehicleRequest {
  acme.common.v1.RequestContext context = 1;
  string vehicle_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupVehicle`.
message LookupVehicleResponse {
  Vehicle vehicle = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseVehicles`.
message BrowseVehiclesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VehicleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseVehiclesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseVehicles`.
message BrowseVehiclesResponse {
  repeated Vehicle vehicles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindVehicles`.
message FindVehiclesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VehicleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindVehiclesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindVehicles`.
message FindVehiclesResponse {
  repeated Vehicle vehicles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountVehicles`.
message CountVehiclesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VehicleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountVehiclesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountVehicles`.
message CountVehiclesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveVehicles`.
message ResolveVehiclesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string vehicle_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveVehicles`.
message ResolveVehiclesResponse {
  repeated Vehicle vehicles = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportVehicles`.
message ExportVehiclesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VehicleStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportVehiclesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportVehicles`.
message ExportVehiclesResponse {
  Vehicle vehicle = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeVehicles`.
message SummarizeVehiclesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vehicle_id = 2;
  SummarizeVehiclesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeVehicles`.
message SummarizeVehiclesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekVehicle`.
message PeekVehicleRequest {
  acme.common.v1.RequestContext context = 1;
  string vehicle_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekVehicle`.
message PeekVehicleResponse {
  Vehicle vehicle = 1;
  acme.common.v1.OperationResult result = 2;
}
