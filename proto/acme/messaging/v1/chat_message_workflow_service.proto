syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChatMessageWorkflowServiceProto";
option java_package = "com.acme.messaging.v1";

// Runs the long-lived workflow that takes a chat message from start to finish.
service ChatMessageWorkflowService {
  // Starts a chat message.
  rpc StartChatMessageWorkflow(StartChatMessageWorkflowRequest) returns (StartChatMessageWorkflowResponse);

  // Advances a chat message.
  rpc AdvanceChatMessageWorkflow(AdvanceChatMessageWorkflowRequest) returns (AdvanceChatMessageWorkflowResponse);

  // Cancels a chat message.
  rpc CancelChatMessageWorkflow(CancelChatMessageWorkflowRequest) returns (CancelChatMessageWorkflowResponse);

  // Retrys a chat message.
  rpc RetryChatMessageWorkflow(RetryChatMessageWorkflowRequest) returns (RetryChatMessageWorkflowResponse);

  // Pauses a chat message.
  rpc PauseChatMessageWorkflow(PauseChatMessageWorkflowRequest) returns (PauseChatMessageWorkflowResponse);

  // Lists chat messages a page at a time.
  rpc ListChatMessageWorkflows(ListChatMessageWorkflowsRequest) returns (ListChatMessageWorkflowsResponse);

  // Signals a chat message.
  rpc SignalChatMessageWorkflow(SignalChatMessageWorkflowRequest) returns (SignalChatMessageWorkflowResponse);
}

// The request of `StartChatMessageWorkflow`.
message StartChatMessageWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  ChatMessage chat_message = 3;
  StartChatMessageWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartChatMessageWorkflow`.
message StartChatMessageWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatMessage chat_message = 1;
  StartChatMessageWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

