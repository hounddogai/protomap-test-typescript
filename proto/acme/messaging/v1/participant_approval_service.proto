syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ParticipantApprovalServiceProto";
option java_package = "com.acme.messaging.v1";

// Routes participants through approval, with escalation and delegation.
service ParticipantApprovalService {
  // Submits a participant.
  rpc SubmitParticipant(SubmitParticipantRequest) returns (SubmitParticipantResponse);

  // Approves a participant.
  rpc ApproveParticipant(ApproveParticipantRequest) returns (ApproveParticipantResponse);

  // Rejects a participant.
  rpc RejectParticipant(RejectParticipantRequest) returns (RejectParticipantResponse);

  // Escalates a participant.
  rpc EscalateParticipant(EscalateParticipantRequest) returns (EscalateParticipantResponse);

  // Lists participants a page at a time.
  rpc ListPendingParticipants(ListPendingParticipantsRequest) returns (ListPendingParticipantsResponse);

  // Delegates a participant.
  rpc DelegateParticipantApproval(DelegateParticipantApprovalRequest) returns (DelegateParticipantApprovalResponse);

  // Recalls a participant.
  rpc RecallParticipant(RecallParticipantRequest) returns (RecallParticipantResponse);

  // Returns a participant.
  rpc GetParticipantApprovalStatus(GetParticipantApprovalStatusRequest) returns (GetParticipantApprovalStatusResponse);

  // Comments a participant.
  rpc CommentParticipantApproval(CommentParticipantApprovalRequest) returns (CommentParticipantApprovalResponse);
}

// The request of `SubmitParticipant`.
message SubmitParticipantRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  SubmitParticipantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitParticipant`.
message SubmitParticipantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  SubmitParticipantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

