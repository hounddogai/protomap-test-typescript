syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChannelWorkflowServiceProto";
option java_package = "com.acme.messaging.v1";

// Runs the long-lived workflow that takes a channel from start to finish.
service ChannelWorkflowService {
  // Starts a channel.
  rpc StartChannelWorkflow(StartChannelWorkflowRequest) returns (StartChannelWorkflowResponse);

  // Advances a channel.
  rpc AdvanceChannelWorkflow(AdvanceChannelWorkflowRequest) returns (AdvanceChannelWorkflowResponse);

  // Cancels a channel.
  rpc CancelChannelWorkflow(CancelChannelWorkflowRequest) returns (CancelChannelWorkflowResponse);

  // Resumes a channel.
  rpc ResumeChannelWorkflow(ResumeChannelWorkflowRequest) returns (ResumeChannelWorkflowResponse);

  // Returns a channel.
  rpc InspectChannelWorkflow(InspectChannelWorkflowRequest) returns (InspectChannelWorkflowResponse);

  // Lists channels a page at a time.
  rpc ListChannelWorkflows(ListChannelWorkflowsRequest) returns (ListChannelWorkflowsResponse);

  // Signals a channel.
  rpc SignalChannelWorkflow(SignalChannelWorkflowRequest) returns (SignalChannelWorkflowResponse);
}

// The request of `StartChannelWorkflow`.
message StartChannelWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  Channel channel = 3;
  StartChannelWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartChannelWorkflow`.
message StartChannelWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Channel channel = 1;
  StartChannelWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

