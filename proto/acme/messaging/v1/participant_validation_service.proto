syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ParticipantValidationServiceProto";
option java_package = "com.acme.messaging.v1";

// Checks participants against the rules before anything acts on them.
service ParticipantValidationService {
  // Validates a participant.
  rpc ValidateParticipant(ValidateParticipantRequest) returns (ValidateParticipantResponse);

  // Previews a participant.
  rpc PreviewParticipant(PreviewParticipantRequest) returns (PreviewParticipantResponse);

  // Checks a participant.
  rpc CheckParticipantEligibility(CheckParticipantEligibilityRequest) returns (CheckParticipantEligibilityResponse);

  // Normalizes a participant.
  rpc NormalizeParticipant(NormalizeParticipantRequest) returns (NormalizeParticipantResponse);

  // Scores a participant.
  rpc ScoreParticipant(ScoreParticipantRequest) returns (ScoreParticipantResponse);

  // Lints a participant.
  rpc LintParticipants(LintParticipantsRequest) returns (LintParticipantsResponse);

  // Returns a participant.
  rpc GetParticipantRules(GetParticipantRulesRequest) returns (GetParticipantRulesResponse);
}

// The request of `ValidateParticipant`.
message ValidateParticipantRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  ValidateParticipantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateParticipant`.
message ValidateParticipantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  ValidateParticipantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

