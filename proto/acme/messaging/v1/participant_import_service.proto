syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ParticipantImportServiceProto";
option java_package = "com.acme.messaging.v1";

// Takes participants in bulk from partners and legacy systems.
service ParticipantImportService {
  // Takes a stream of participants and answers once at the end.
  rpc ImportParticipants(stream ImportParticipantsRequest) returns (ImportParticipantsResponse);

  // Returns a participant.
  rpc GetParticipantImportStatus(GetParticipantImportStatusRequest) returns (GetParticipantImportStatusResponse);

  // Cancels a participant.
  rpc CancelParticipantImport(CancelParticipantImportRequest) returns (CancelParticipantImportResponse);

  // Validates a participant.
  rpc ValidateParticipantImport(ValidateParticipantImportRequest) returns (ValidateParticipantImportResponse);

  // Lists participants a page at a time.
  rpc ListParticipantImports(ListParticipantImportsRequest) returns (ListParticipantImportsResponse);

  // Retrys a participant.
  rpc RetryParticipantImport(RetryParticipantImportRequest) returns (RetryParticipantImportResponse);

  // Maps a participant.
  rpc MapParticipantImportColumns(MapParticipantImportColumnsRequest) returns (MapParticipantImportColumnsResponse);
}

// The request of `ImportParticipants`.
message ImportParticipantsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportParticipantsRequest.StreamHeader header = 2;
    Participant record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportParticipants`.
message ImportParticipantsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string participant_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportParticipantsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetParticipantImportStatus`.
message GetParticipantImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetParticipantImportStatus`.
message GetParticipantImportStatusResponse {
  Participant participant = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelParticipantImport`.
message CancelParticipantImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  CancelParticipantImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelParticipantImport`.
message CancelParticipantImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  CancelParticipantImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateParticipantImport`.
message ValidateParticipantImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  ValidateParticipantImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateParticipantImport`.
message ValidateParticipantImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  ValidateParticipantImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListParticipantImports`.
message ListParticipantImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ParticipantStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListParticipantImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListParticipantImports`.
message ListParticipantImportsResponse {
  repeated Participant participants = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryParticipantImport`.
message RetryParticipantImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  RetryParticipantImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryParticipantImport`.
message RetryParticipantImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  RetryParticipantImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapParticipantImportColumns`.
message MapParticipantImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  MapParticipantImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapParticipantImportColumns`.
message MapParticipantImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  MapParticipantImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
