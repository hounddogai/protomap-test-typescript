syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ParticipantCalculationServiceProto";
option java_package = "com.acme.messaging.v1";

// Computes the figures of a participant, such as totals, taxes, and estimates.
service ParticipantCalculationService {
  // Calculates a participant.
  rpc CalculateParticipant(CalculateParticipantRequest) returns (CalculateParticipantResponse);

  // Estimates a participant.
  rpc EstimateParticipant(EstimateParticipantRequest) returns (EstimateParticipantResponse);

  // Quotes a participant.
  rpc QuoteParticipant(QuoteParticipantRequest) returns (QuoteParticipantResponse);

  // Compares a participant.
  rpc CompareParticipantOptions(CompareParticipantOptionsRequest) returns (CompareParticipantOptionsResponse);

  // Recalculates a participant.
  rpc RecalculateParticipants(RecalculateParticipantsRequest) returns (RecalculateParticipantsResponse);

  // Simulates a participant.
  rpc SimulateParticipant(SimulateParticipantRequest) returns (SimulateParticipantResponse);

  // Explains a participant.
  rpc ExplainParticipantCalculation(ExplainParticipantCalculationRequest) returns (ExplainParticipantCalculationResponse);

  // Returns a participant.
  rpc GetParticipantRates(GetParticipantRatesRequest) returns (GetParticipantRatesResponse);
}

// The request of `CalculateParticipant`.
message CalculateParticipantRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  CalculateParticipantRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateParticipant`.
message CalculateParticipantResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateParticipantResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Participant participant = 1;
  CalculateParticipantResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

