syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChatMessageSyncServiceProto";
option java_package = "com.acme.messaging.v1";

// Keeps chat messages in step with the systems of record in other regions.
service ChatMessageSyncService {
  // Syncs a chat message.
  rpc SyncChatMessages(SyncChatMessagesRequest) returns (SyncChatMessagesResponse);

  // Pushs a chat message.
  rpc PushChatMessage(PushChatMessageRequest) returns (PushChatMessageResponse);

  // Pulls a chat message.
  rpc PullChatMessages(PullChatMessagesRequest) returns (PullChatMessagesResponse);

  // Reconciles a chat message.
  rpc ReconcileChatMessages(ReconcileChatMessagesRequest) returns (ReconcileChatMessagesResponse);

  // Exchanges changes of chat messages with a peer.
  rpc StreamChatMessageChanges(stream StreamChatMessageChangesRequest) returns (stream StreamChatMessageChangesResponse);

  // Resolves a chat message.
  rpc ResolveChatMessageConflict(ResolveChatMessageConflictRequest) returns (ResolveChatMessageConflictResponse);

  // Lists chat messages a page at a time.
  rpc ListChatMessageConflicts(ListChatMessageConflictsRequest) returns (ListChatMessageConflictsResponse);
}

// The request of `SyncChatMessages`.
message SyncChatMessagesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  ChatMessage chat_message = 3;
  SyncChatMessagesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncChatMessages`.
message SyncChatMessagesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatMessage chat_message = 1;
  SyncChatMessagesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushChatMessage`.
message PushChatMessageRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
