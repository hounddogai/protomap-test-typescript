syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ConversationWorkflowServiceProto";
option java_package = "com.acme.messaging.v1";

// Runs the long-lived workflow that takes a conversation from start to finish.
service ConversationWorkflowService {
  // Starts a conversation.
  rpc StartConversationWorkflow(StartConversationWorkflowRequest) returns (StartConversationWorkflowResponse);

  // Advances a conversation.
  rpc AdvanceConversationWorkflow(AdvanceConversationWorkflowRequest) returns (AdvanceConversationWorkflowResponse);

  // Cancels a conversation.
  rpc CancelConversationWorkflow(CancelConversationWorkflowRequest) returns (CancelConversationWorkflowResponse);

  // Retrys a conversation.
  rpc RetryConversationWorkflow(RetryConversationWorkflowRequest) returns (RetryConversationWorkflowResponse);

  // Pauses a conversation.
  rpc PauseConversationWorkflow(PauseConversationWorkflowRequest) returns (PauseConversationWorkflowResponse);

  // Resumes a conversation.
  rpc ResumeConversationWorkflow(ResumeConversationWorkflowRequest) returns (ResumeConversationWorkflowResponse);

  // Returns a conversation.
  rpc InspectConversationWorkflow(InspectConversationWorkflowRequest) returns (InspectConversationWorkflowResponse);
}

// The request of `StartConversationWorkflow`.
message StartConversationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  Conversation conversation = 3;
  StartConversationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartConversationWorkflow`.
message StartConversationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Conversation conversation = 1;
  StartConversationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

