syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChatMessageLifecycleServiceProto";
option java_package = "com.acme.messaging.v1";

// Moves a chat message between the states of its lifecycle.
service ChatMessageLifecycleService {
  // Activates a chat message.
  rpc ActivateChatMessage(ActivateChatMessageRequest) returns (ActivateChatMessageResponse);

  // Suspends a chat message.
  rpc SuspendChatMessage(SuspendChatMessageRequest) returns (SuspendChatMessageResponse);

  // Reinstates a chat message.
  rpc ReinstateChatMessage(ReinstateChatMessageRequest) returns (ReinstateChatMessageResponse);

  // Renews a chat message.
  rpc RenewChatMessage(RenewChatMessageRequest) returns (RenewChatMessageResponse);

  // Expires a chat message.
  rpc ExpireChatMessage(ExpireChatMessageRequest) returns (ExpireChatMessageResponse);

  // Returns a chat message.
  rpc GetChatMessageLifecycle(GetChatMessageLifecycleRequest) returns (GetChatMessageLifecycleResponse);

  // Schedules a chat message.
  rpc ScheduleChatMessageExpiry(ScheduleChatMessageExpiryRequest) returns (ScheduleChatMessageExpiryResponse);
}

// The request of `ActivateChatMessage`.
message ActivateChatMessageRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  ActivateChatMessageRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateChatMessage`.
message ActivateChatMessageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatMessage chat_message = 1;
  ActivateChatMessageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

