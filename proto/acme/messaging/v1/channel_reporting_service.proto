syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChannelReportingServiceProto";
option java_package = "com.acme.messaging.v1";

// Builds and schedules reports about channels.
service ChannelReportingService {
  // Generates a channel.
  rpc GenerateChannelReport(GenerateChannelReportRequest) returns (GenerateChannelReportResponse);

  // Returns a channel.
  rpc FetchChannelReport(FetchChannelReportRequest) returns (FetchChannelReportResponse);

  // Schedules a channel.
  rpc ScheduleChannelReport(ScheduleChannelReportRequest) returns (ScheduleChannelReportResponse);

  // Lists channels a page at a time.
  rpc ListChannelReports(ListChannelReportsRequest) returns (ListChannelReportsResponse);

  // Shares a channel.
  rpc ShareChannelReport(ShareChannelReportRequest) returns (ShareChannelReportResponse);

  // Counts channels by status.
  rpc CountChannelTotals(CountChannelTotalsRequest) returns (CountChannelTotalsResponse);

  // Deletes a channel.
  rpc DeleteChannelReport(DeleteChannelReportRequest) returns (DeleteChannelReportResponse);
}

// The request of `GenerateChannelReport`.
message GenerateChannelReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  GenerateChannelReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateChannelReport`.
message GenerateChannelReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchChannelReport`.
message FetchChannelReportRequest {
  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchChannelReport`.
message FetchChannelReportResponse {
  Channel channel = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleChannelReport`.
message ScheduleChannelReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  ScheduleChannelReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleChannelReport`.
message ScheduleChannelReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListChannelReports`.
message ListChannelReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChannelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListChannelReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListChannelReports`.
message ListChannelReportsResponse {
  repeated Channel channels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareChannelReport`.
message ShareChannelReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  ShareChannelReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareChannelReport`.
message ShareChannelReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Channel channel = 1;
  ShareChannelReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountChannelTotals`.
message CountChannelTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChannelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountChannelTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountChannelTotals`.
message CountChannelTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteChannelReport`.
message DeleteChannelReportRequest {
  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteChannelReport`.
message DeleteChannelReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
