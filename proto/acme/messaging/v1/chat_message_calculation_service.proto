syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChatMessageCalculationServiceProto";
option java_package = "com.acme.messaging.v1";

// Computes the figures of a chat message, such as totals, taxes, and estimates.
service ChatMessageCalculationService {
  // Calculates a chat message.
  rpc CalculateChatMessage(CalculateChatMessageRequest) returns (CalculateChatMessageResponse);

  // Estimates a chat message.
  rpc EstimateChatMessage(EstimateChatMessageRequest) returns (EstimateChatMessageResponse);

  // Quotes a chat message.
  rpc QuoteChatMessage(QuoteChatMessageRequest) returns (QuoteChatMessageResponse);

  // Compares a chat message.
  rpc CompareChatMessageOptions(CompareChatMessageOptionsRequest) returns (CompareChatMessageOptionsResponse);

  // Recalculates a chat message.
  rpc RecalculateChatMessages(RecalculateChatMessagesRequest) returns (RecalculateChatMessagesResponse);

  // Simulates a chat message.
  rpc SimulateChatMessage(SimulateChatMessageRequest) returns (SimulateChatMessageResponse);

  // Explains a chat message.
  rpc ExplainChatMessageCalculation(ExplainChatMessageCalculationRequest) returns (ExplainChatMessageCalculationResponse);

  // Returns a chat message.
  rpc GetChatMessageRates(GetChatMessageRatesRequest) returns (GetChatMessageRatesResponse);
}

// The request of `CalculateChatMessage`.
message CalculateChatMessageRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  ChatMessage chat_message = 3;
  CalculateChatMessageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateChatMessage`.
message CalculateChatMessageResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateChatMessageResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ChatMessage chat_message = 1;
  CalculateChatMessageResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

