syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ConversationReportingServiceProto";
option java_package = "com.acme.messaging.v1";

// Builds and schedules reports about conversations.
service ConversationReportingService {
  // Generates a conversation.
  rpc GenerateConversationReport(GenerateConversationReportRequest) returns (GenerateConversationReportResponse);

  // Returns a conversation.
  rpc FetchConversationReport(FetchConversationReportRequest) returns (FetchConversationReportResponse);

  // Schedules a conversation.
  rpc ScheduleConversationReport(ScheduleConversationReportRequest) returns (ScheduleConversationReportResponse);

  // Streams the changes of conversations as they happen.
  rpc StreamConversationMetrics(StreamConversationMetricsRequest) returns (stream StreamConversationMetricsResponse);

  // Shares a conversation.
  rpc ShareConversationReport(ShareConversationReportRequest) returns (ShareConversationReportResponse);

  // Counts conversations by status.
  rpc CountConversationTotals(CountConversationTotalsRequest) returns (CountConversationTotalsResponse);

  // Deletes a conversation.
  rpc DeleteConversationReport(DeleteConversationReportRequest) returns (DeleteConversationReportResponse);
}

// The request of `GenerateConversationReport`.
message GenerateConversationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  GenerateConversationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateConversationReport`.
message GenerateConversationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchConversationReport`.
message FetchConversationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchConversationReport`.
message FetchConversationReportResponse {
  Conversation conversation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleConversationReport`.
message ScheduleConversationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  ScheduleConversationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleConversationReport`.
message ScheduleConversationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamConversationMetrics`.
message StreamConversationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConversationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamConversationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamConversationMetrics`.
message StreamConversationMetricsResponse {
  Conversation conversation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareConversationReport`.
message ShareConversationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  ShareConversationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareConversationReport`.
message ShareConversationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Conversation conversation = 1;
  ShareConversationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountConversationTotals`.
message CountConversationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ConversationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountConversationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountConversationTotals`.
message CountConversationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteConversationReport`.
message DeleteConversationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteConversationReport`.
message DeleteConversationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
