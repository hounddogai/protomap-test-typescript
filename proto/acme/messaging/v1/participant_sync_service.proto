syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ParticipantSyncServiceProto";
option java_package = "com.acme.messaging.v1";

// Keeps participants in step with the systems of record in other regions.
service ParticipantSyncService {
  // Syncs a participant.
  rpc SyncParticipants(SyncParticipantsRequest) returns (SyncParticipantsResponse);

  // Pushs a participant.
  rpc PushParticipant(PushParticipantRequest) returns (PushParticipantResponse);

  // Pulls a participant.
  rpc PullParticipants(PullParticipantsRequest) returns (PullParticipantsResponse);

  // Reconciles a participant.
  rpc ReconcileParticipants(ReconcileParticipantsRequest) returns (ReconcileParticipantsResponse);

  // Exchanges changes of participants with a peer.
  rpc StreamParticipantChanges(stream StreamParticipantChangesRequest) returns (stream StreamParticipantChangesResponse);

  // Resolves a participant.
  rpc ResolveParticipantConflict(ResolveParticipantConflictRequest) returns (ResolveParticipantConflictResponse);

  // Returns a participant.
  rpc GetParticipantSyncState(GetParticipantSyncStateRequest) returns (GetParticipantSyncStateResponse);

  // Lists participants a page at a time.
  rpc ListParticipantConflicts(ListParticipantConflictsRequest) returns (ListParticipantConflictsResponse);
}

// The request of `SyncParticipants`.
message SyncParticipantsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  Participant participant = 3;
  SyncParticipantsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncParticipants`.
message SyncParticipantsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  SyncParticipantsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushParticipant`.
message PushParticipantRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
