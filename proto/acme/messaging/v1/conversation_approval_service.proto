syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ConversationApprovalServiceProto";
option java_package = "com.acme.messaging.v1";

// Routes conversations through approval, with escalation and delegation.
service ConversationApprovalService {
  // Submits a conversation.
  rpc SubmitConversation(SubmitConversationRequest) returns (SubmitConversationResponse);

  // Approves a conversation.
  rpc ApproveConversation(ApproveConversationRequest) returns (ApproveConversationResponse);

  // Escalates a conversation.
  rpc EscalateConversation(EscalateConversationRequest) returns (EscalateConversationResponse);

  // Lists conversations a page at a time.
  rpc ListPendingConversations(ListPendingConversationsRequest) returns (ListPendingConversationsResponse);

  // Delegates a conversation.
  rpc DelegateConversationApproval(DelegateConversationApprovalRequest) returns (DelegateConversationApprovalResponse);

  // Recalls a conversation.
  rpc RecallConversation(RecallConversationRequest) returns (RecallConversationResponse);

  // Returns a conversation.
  rpc GetConversationApprovalStatus(GetConversationApprovalStatusRequest) returns (GetConversationApprovalStatusResponse);

  // Comments a conversation.
  rpc CommentConversationApproval(CommentConversationApprovalRequest) returns (CommentConversationApprovalResponse);
}

// The request of `SubmitConversation`.
message SubmitConversationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string conversation_id = 2;
  Conversation conversation = 3;
  SubmitConversationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitConversation`.
message SubmitConversationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Conversation conversation = 1;
  SubmitConversationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

