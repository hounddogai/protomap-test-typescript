syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChatMessageApprovalServiceProto";
option java_package = "com.acme.messaging.v1";

// Routes chat messages through approval, with escalation and delegation.
service ChatMessageApprovalService {
  // Submits a chat message.
  rpc SubmitChatMessage(SubmitChatMessageRequest) returns (SubmitChatMessageResponse);

  // Approves a chat message.
  rpc ApproveChatMessage(ApproveChatMessageRequest) returns (ApproveChatMessageResponse);

  // Rejects a chat message.
  rpc RejectChatMessage(RejectChatMessageRequest) returns (RejectChatMessageResponse);

  // Lists chat messages a page at a time.
  rpc ListPendingChatMessages(ListPendingChatMessagesRequest) returns (ListPendingChatMessagesResponse);

  // Delegates a chat message.
  rpc DelegateChatMessageApproval(DelegateChatMessageApprovalRequest) returns (DelegateChatMessageApprovalResponse);

  // Comments a chat message.
  rpc CommentChatMessageApproval(CommentChatMessageApprovalRequest) returns (CommentChatMessageApprovalResponse);
}

// The request of `SubmitChatMessage`.
message SubmitChatMessageRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  ChatMessage chat_message = 3;
  SubmitChatMessageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitChatMessage`.
message SubmitChatMessageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatMessage chat_message = 1;
  SubmitChatMessageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

