syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChatMessageReportingServiceProto";
option java_package = "com.acme.messaging.v1";

// Builds and schedules reports about chat messages.
service ChatMessageReportingService {
  // Generates a chat message.
  rpc GenerateChatMessageReport(GenerateChatMessageReportRequest) returns (GenerateChatMessageReportResponse);

  // Returns a chat message.
  rpc FetchChatMessageReport(FetchChatMessageReportRequest) returns (FetchChatMessageReportResponse);

  // Streams the changes of chat messages as they happen.
  rpc StreamChatMessageMetrics(StreamChatMessageMetricsRequest) returns (stream StreamChatMessageMetricsResponse);

  // Lists chat messages a page at a time.
  rpc ListChatMessageReports(ListChatMessageReportsRequest) returns (ListChatMessageReportsResponse);

  // Shares a chat message.
  rpc ShareChatMessageReport(ShareChatMessageReportRequest) returns (ShareChatMessageReportResponse);

  // Deletes a chat message.
  rpc DeleteChatMessageReport(DeleteChatMessageReportRequest) returns (DeleteChatMessageReportResponse);
}

// The request of `GenerateChatMessageReport`.
message GenerateChatMessageReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  GenerateChatMessageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateChatMessageReport`.
message GenerateChatMessageReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchChatMessageReport`.
message FetchChatMessageReportRequest {
  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchChatMessageReport`.
message FetchChatMessageReportResponse {
  ChatMessage chat_message = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamChatMessageMetrics`.
message StreamChatMessageMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChatMessageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamChatMessageMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamChatMessageMetrics`.
message StreamChatMessageMetricsResponse {
  ChatMessage chat_message = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListChatMessageReports`.
message ListChatMessageReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChatMessageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListChatMessageReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListChatMessageReports`.
message ListChatMessageReportsResponse {
  repeated ChatMessage chat_messages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareChatMessageReport`.
message ShareChatMessageReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  ShareChatMessageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareChatMessageReport`.
message ShareChatMessageReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatMessage chat_message = 1;
  ShareChatMessageReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteChatMessageReport`.
message DeleteChatMessageReportRequest {
  acme.common.v1.RequestContext context = 1;
  string chat_message_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteChatMessageReport`.
message DeleteChatMessageReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
