syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ParticipantLifecycleServiceProto";
option java_package = "com.acme.messaging.v1";

// Moves a participant between the states of its lifecycle.
service ParticipantLifecycleService {
  // Activates a participant.
  rpc ActivateParticipant(ActivateParticipantRequest) returns (ActivateParticipantResponse);

  // Suspends a participant.
  rpc SuspendParticipant(SuspendParticipantRequest) returns (SuspendParticipantResponse);

  // Reinstates a participant.
  rpc ReinstateParticipant(ReinstateParticipantRequest) returns (ReinstateParticipantResponse);

  // Terminates a participant.
  rpc TerminateParticipant(TerminateParticipantRequest) returns (TerminateParticipantResponse);

  // Renews a participant.
  rpc RenewParticipant(RenewParticipantRequest) returns (RenewParticipantResponse);

  // Returns a participant.
  rpc GetParticipantLifecycle(GetParticipantLifecycleRequest) returns (GetParticipantLifecycleResponse);

  // Schedules a participant.
  rpc ScheduleParticipantExpiry(ScheduleParticipantExpiryRequest) returns (ScheduleParticipantExpiryResponse);
}

// The request of `ActivateParticipant`.
message ActivateParticipantRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string participant_id = 2;
  ActivateParticipantRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateParticipant`.
message ActivateParticipantResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Participant participant = 1;
  ActivateParticipantResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

