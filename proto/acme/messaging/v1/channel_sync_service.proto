// The request of `GetChannelSyncState`.
message GetChannelSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetChannelSyncState`.
message GetChannelSyncStateResponse {
  Channel channel = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListChannelConflicts`.
message ListChannelConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ChannelStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListChannelConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListChannelConflicts`.
message ListChannelConflictsResponse {
  repeated Channel channels = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
