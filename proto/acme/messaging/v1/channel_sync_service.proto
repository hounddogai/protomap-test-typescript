syntax = "proto3";

package acme.messaging.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/messaging/v1/messaging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Messaging.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/messaging/v1;messagingv1";
option java_multiple_files = true;
option java_outer_classname = "ChannelSyncServiceProto";
option java_package = "com.acme.messaging.v1";

// Keeps channels in step with the systems of record in other regions.
service ChannelSyncService {
  // Syncs a channel.
  rpc SyncChannels(SyncChannelsRequest) returns (SyncChannelsResponse);

  // Pushs a channel.
  rpc PushChannel(PushChannelRequest) returns (PushChannelResponse);

  // Pulls a channel.
  rpc PullChannels(PullChannelsRequest) returns (PullChannelsResponse);

  // Reconciles a channel.
  rpc ReconcileChannels(ReconcileChannelsRequest) returns (ReconcileChannelsResponse);

  // Exchanges changes of channels with a peer.
  rpc StreamChannelChanges(stream StreamChannelChangesRequest) returns (stream StreamChannelChangesResponse);

  // Resolves a channel.
  rpc ResolveChannelConflict(ResolveChannelConflictRequest) returns (ResolveChannelConflictResponse);

  // Returns a channel.
  rpc GetChannelSyncState(GetChannelSyncStateRequest) returns (GetChannelSyncStateResponse);

  // Lists channels a page at a time.
  rpc ListChannelConflicts(ListChannelConflictsRequest) returns (ListChannelConflictsResponse);
}

// The request of `SyncChannels`.
message SyncChannelsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string channel_id = 2;
  Channel channel = 3;
  SyncChannelsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncChannels`.
message SyncChannelsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Channel channel = 1;
  SyncChannelsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushChannel`.
message PushChannelRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
