    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  ExplainPrescriptionCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPrescriptionRates`.
message GetPrescriptionRatesRequest {
