syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/content/v1/content.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "TaxonomyApprovalServiceProto";
option java_package = "com.acme.content.v1";

// Routes taxonomies through approval, with escalation and delegation.
service TaxonomyApprovalService {
  // Submits a taxonomy.
  rpc SubmitTaxonomy(SubmitTaxonomyRequest) returns (SubmitTaxonomyResponse);

  // Approves a taxonomy.
  rpc ApproveTaxonomy(ApproveTaxonomyRequest) returns (ApproveTaxonomyResponse);

  // Escalates a taxonomy.
  rpc EscalateTaxonomy(EscalateTaxonomyRequest) returns (EscalateTaxonomyResponse);

  // Lists taxonomies a page at a time.
  rpc ListPendingTaxonomies(ListPendingTaxonomiesRequest) returns (ListPendingTaxonomiesResponse);

  // Delegates a taxonomy.
  rpc DelegateTaxonomyApproval(DelegateTaxonomyApprovalRequest) returns (DelegateTaxonomyApprovalResponse);

  // Recalls a taxonomy.
  rpc RecallTaxonomy(RecallTaxonomyRequest) returns (RecallTaxonomyResponse);

  // Returns a taxonomy.
  rpc GetTaxonomyApprovalStatus(GetTaxonomyApprovalStatusRequest) returns (GetTaxonomyApprovalStatusResponse);

  // Comments a taxonomy.
  rpc CommentTaxonomyApproval(CommentTaxonomyApprovalRequest) returns (CommentTaxonomyApprovalResponse);
}

// The request of `SubmitTaxonomy`.
message SubmitTaxonomyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string taxonomy_id = 2;
  Taxonomy taxonomy = 3;
  SubmitTaxonomyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTaxonomy`.
message SubmitTaxonomyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Taxonomy taxonomy = 1;
  SubmitTaxonomyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveTaxonomy`.
message ApproveTaxonomyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
