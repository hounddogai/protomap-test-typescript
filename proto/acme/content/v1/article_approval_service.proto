}

// The request of `GetArticleApprovalStatus`.
message GetArticleApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string article_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetArticleApprovalStatus`.
message GetArticleApprovalStatusResponse {
  Article article = 1;
  acme.common.v1.OperationResult result = 2;
}
