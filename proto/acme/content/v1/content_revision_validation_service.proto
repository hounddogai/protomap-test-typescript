syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ContentRevisionValidationServiceProto";
option java_package = "com.acme.content.v1";

// Checks content revisions against the rules before anything acts on them.
service ContentRevisionValidationService {
  // Validates a content revision.
  rpc ValidateContentRevision(ValidateContentRevisionRequest) returns (ValidateContentRevisionResponse);

  // Previews a content revision.
  rpc PreviewContentRevision(PreviewContentRevisionRequest) returns (PreviewContentRevisionResponse);

  // Checks a content revision.
  rpc CheckContentRevisionEligibility(CheckContentRevisionEligibilityRequest) returns (CheckContentRevisionEligibilityResponse);

  // Normalizes a content revision.
  rpc NormalizeContentRevision(NormalizeContentRevisionRequest) returns (NormalizeContentRevisionResponse);

  // Explains a content revision.
  rpc ExplainContentRevisionDecision(ExplainContentRevisionDecisionRequest) returns (ExplainContentRevisionDecisionResponse);

  // Scores a content revision.
  rpc ScoreContentRevision(ScoreContentRevisionRequest) returns (ScoreContentRevisionResponse);

  // Lints a content revision.
  rpc LintContentRevisions(LintContentRevisionsRequest) returns (LintContentRevisionsResponse);

  // Returns a content revision.
  rpc GetContentRevisionRules(GetContentRevisionRulesRequest) returns (GetContentRevisionRulesResponse);
}

// The request of `ValidateContentRevision`.
message ValidateContentRevisionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string content_revision_id = 2;
  ContentRevision content_revision = 3;
  ValidateContentRevisionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateContentRevision`.
message ValidateContentRevisionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ContentRevision content_revision = 1;
  ValidateContentRevisionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

