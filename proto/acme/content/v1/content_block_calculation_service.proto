syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ContentBlockCalculationServiceProto";
option java_package = "com.acme.content.v1";

// Computes the figures of a content block, such as totals, taxes, and estimates.
service ContentBlockCalculationService {
  // Calculates a content block.
  rpc CalculateContentBlock(CalculateContentBlockRequest) returns (CalculateContentBlockResponse);

  // Estimates a content block.
  rpc EstimateContentBlock(EstimateContentBlockRequest) returns (EstimateContentBlockResponse);

  // Quotes a content block.
  rpc QuoteContentBlock(QuoteContentBlockRequest) returns (QuoteContentBlockResponse);

  // Compares a content block.
  rpc CompareContentBlockOptions(CompareContentBlockOptionsRequest) returns (CompareContentBlockOptionsResponse);

  // Recalculates a content block.
  rpc RecalculateContentBlocks(RecalculateContentBlocksRequest) returns (RecalculateContentBlocksResponse);

  // Simulates a content block.
  rpc SimulateContentBlock(SimulateContentBlockRequest) returns (SimulateContentBlockResponse);

  // Explains a content block.
  rpc ExplainContentBlockCalculation(ExplainContentBlockCalculationRequest) returns (ExplainContentBlockCalculationResponse);

  // Returns a content block.
  rpc GetContentBlockRates(GetContentBlockRatesRequest) returns (GetContentBlockRatesResponse);
}

// The request of `CalculateContentBlock`.
message CalculateContentBlockRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  ContentBlock content_block = 3;
  CalculateContentBlockRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateContentBlock`.
message CalculateContentBlockResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateContentBlockResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ContentBlock content_block = 1;
  CalculateContentBlockResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

