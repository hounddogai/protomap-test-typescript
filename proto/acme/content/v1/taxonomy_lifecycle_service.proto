syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/content/v1/content.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "TaxonomyLifecycleServiceProto";
option java_package = "com.acme.content.v1";

// Moves a taxonomy between the states of its lifecycle.
service TaxonomyLifecycleService {
  // Activates a taxonomy.
  rpc ActivateTaxonomy(ActivateTaxonomyRequest) returns (ActivateTaxonomyResponse);

  // Suspends a taxonomy.
  rpc SuspendTaxonomy(SuspendTaxonomyRequest) returns (SuspendTaxonomyResponse);

  // Reinstates a taxonomy.
  rpc ReinstateTaxonomy(ReinstateTaxonomyRequest) returns (ReinstateTaxonomyResponse);

  // Terminates a taxonomy.
  rpc TerminateTaxonomy(TerminateTaxonomyRequest) returns (TerminateTaxonomyResponse);

  // Renews a taxonomy.
  rpc RenewTaxonomy(RenewTaxonomyRequest) returns (RenewTaxonomyResponse);

  // Expires a taxonomy.
  rpc ExpireTaxonomy(ExpireTaxonomyRequest) returns (ExpireTaxonomyResponse);

  // Returns a taxonomy.
  rpc GetTaxonomyLifecycle(GetTaxonomyLifecycleRequest) returns (GetTaxonomyLifecycleResponse);

  // Schedules a taxonomy.
  rpc ScheduleTaxonomyExpiry(ScheduleTaxonomyExpiryRequest) returns (ScheduleTaxonomyExpiryResponse);
}

// The request of `ActivateTaxonomy`.
message ActivateTaxonomyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string taxonomy_id = 2;
  ActivateTaxonomyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTaxonomy`.
message ActivateTaxonomyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Taxonomy taxonomy = 1;
  ActivateTaxonomyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

