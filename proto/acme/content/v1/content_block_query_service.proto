syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ContentBlockQueryServiceProto";
option java_package = "com.acme.content.v1";

// Answers read-only questions about content blocks, for screens and reports.
service ContentBlockQueryService {
  // Returns a content block.
  rpc LookupContentBlock(LookupContentBlockRequest) returns (LookupContentBlockResponse);

  // Lists content blocks a page at a time.
  rpc BrowseContentBlocks(BrowseContentBlocksRequest) returns (BrowseContentBlocksResponse);

  // Counts content blocks by status.
  rpc CountContentBlocks(CountContentBlocksRequest) returns (CountContentBlocksResponse);

  // Returns several content blocks at once.
  rpc ResolveContentBlocks(ResolveContentBlocksRequest) returns (ResolveContentBlocksResponse);

  // Streams every matching content block.
  rpc ExportContentBlocks(ExportContentBlocksRequest) returns (stream ExportContentBlocksResponse);

  // Summarizes a content block.
  rpc SummarizeContentBlocks(SummarizeContentBlocksRequest) returns (SummarizeContentBlocksResponse);

  // Returns a content block.
  rpc PeekContentBlock(PeekContentBlockRequest) returns (PeekContentBlockResponse);
}

// The request of `LookupContentBlock`.
message LookupContentBlockRequest {
  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupContentBlock`.
message LookupContentBlockResponse {
  ContentBlock content_block = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseContentBlocks`.
message BrowseContentBlocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContentBlockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseContentBlocksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseContentBlocks`.
message BrowseContentBlocksResponse {
  repeated ContentBlock content_blocks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountContentBlocks`.
message CountContentBlocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContentBlockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountContentBlocksRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountContentBlocks`.
message CountContentBlocksResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveContentBlocks`.
message ResolveContentBlocksRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string content_block_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveContentBlocks`.
message ResolveContentBlocksResponse {
  repeated ContentBlock content_blocks = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportContentBlocks`.
message ExportContentBlocksRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ContentBlockStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportContentBlocksRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportContentBlocks`.
message ExportContentBlocksResponse {
  ContentBlock content_block = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeContentBlocks`.
message SummarizeContentBlocksRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  SummarizeContentBlocksRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeContentBlocks`.
message SummarizeContentBlocksResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekContentBlock`.
message PeekContentBlockRequest {
  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekContentBlock`.
message PeekContentBlockResponse {
  ContentBlock content_block = 1;
  acme.common.v1.OperationResult result = 2;
}
