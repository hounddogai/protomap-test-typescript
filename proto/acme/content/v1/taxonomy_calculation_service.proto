  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string taxonomy_id = 2;
  Taxonomy taxonomy = 3;
  ExplainTaxonomyCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainTaxonomyCalculation`.
message ExplainTaxonomyCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Taxonomy taxonomy = 1;
  ExplainTaxonomyCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTaxonomyRates`.
message GetTaxonomyRatesRequest {
  acme.common.v1.RequestContext context = 1;
