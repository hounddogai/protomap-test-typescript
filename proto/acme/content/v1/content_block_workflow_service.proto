syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ContentBlockWorkflowServiceProto";
option java_package = "com.acme.content.v1";

// Runs the long-lived workflow that takes a content block from start to finish.
service ContentBlockWorkflowService {
  // Starts a content block.
  rpc StartContentBlockWorkflow(StartContentBlockWorkflowRequest) returns (StartContentBlockWorkflowResponse);

  // Advances a content block.
  rpc AdvanceContentBlockWorkflow(AdvanceContentBlockWorkflowRequest) returns (AdvanceContentBlockWorkflowResponse);

  // Cancels a content block.
  rpc CancelContentBlockWorkflow(CancelContentBlockWorkflowRequest) returns (CancelContentBlockWorkflowResponse);

  // Retrys a content block.
  rpc RetryContentBlockWorkflow(RetryContentBlockWorkflowRequest) returns (RetryContentBlockWorkflowResponse);

  // Resumes a content block.
  rpc ResumeContentBlockWorkflow(ResumeContentBlockWorkflowRequest) returns (ResumeContentBlockWorkflowResponse);

  // Lists content blocks a page at a time.
  rpc ListContentBlockWorkflows(ListContentBlockWorkflowsRequest) returns (ListContentBlockWorkflowsResponse);
}

// The request of `StartContentBlockWorkflow`.
message StartContentBlockWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  ContentBlock content_block = 3;
  StartContentBlockWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartContentBlockWorkflow`.
message StartContentBlockWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ContentBlock content_block = 1;
  StartContentBlockWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

