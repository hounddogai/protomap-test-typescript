syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ContentRevisionCalculationServiceProto";
option java_package = "com.acme.content.v1";

// Computes the figures of a content revision, such as totals, taxes, and estimates.
service ContentRevisionCalculationService {
  // Calculates a content revision.
  rpc CalculateContentRevision(CalculateContentRevisionRequest) returns (CalculateContentRevisionResponse);

  // Estimates a content revision.
  rpc EstimateContentRevision(EstimateContentRevisionRequest) returns (EstimateContentRevisionResponse);

  // Compares a content revision.
  rpc CompareContentRevisionOptions(CompareContentRevisionOptionsRequest) returns (CompareContentRevisionOptionsResponse);

  // Recalculates a content revision.
  rpc RecalculateContentRevisions(RecalculateContentRevisionsRequest) returns (RecalculateContentRevisionsResponse);

  // Simulates a content revision.
  rpc SimulateContentRevision(SimulateContentRevisionRequest) returns (SimulateContentRevisionResponse);

  // Explains a content revision.
  rpc ExplainContentRevisionCalculation(ExplainContentRevisionCalculationRequest) returns (ExplainContentRevisionCalculationResponse);

  // Returns a content revision.
  rpc GetContentRevisionRates(GetContentRevisionRatesRequest) returns (GetContentRevisionRatesResponse);
}

// The request of `CalculateContentRevision`.
message CalculateContentRevisionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string content_revision_id = 2;
  ContentRevision content_revision = 3;
  CalculateContentRevisionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateContentRevision`.
message CalculateContentRevisionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateContentRevisionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ContentRevision content_revision = 1;
  CalculateContentRevisionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

