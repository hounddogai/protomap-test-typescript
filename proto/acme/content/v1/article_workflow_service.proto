    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListArticleWorkflowsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListArticleWorkflows`.
message ListArticleWorkflowsResponse {
  repeated Article articles = 1;
  acme.common.v1.PageInfo page_info = 2;
