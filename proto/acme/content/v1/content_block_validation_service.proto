syntax = "proto3";

package acme.content.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/content/v1/content.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Content.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/content/v1;contentv1";
option java_multiple_files = true;
option java_outer_classname = "ContentBlockValidationServiceProto";
option java_package = "com.acme.content.v1";

// Checks content blocks against the rules before anything acts on them.
service ContentBlockValidationService {
  // Validates a content block.
  rpc ValidateContentBlock(ValidateContentBlockRequest) returns (ValidateContentBlockResponse);

  // Previews a content block.
  rpc PreviewContentBlock(PreviewContentBlockRequest) returns (PreviewContentBlockResponse);

  // Normalizes a content block.
  rpc NormalizeContentBlock(NormalizeContentBlockRequest) returns (NormalizeContentBlockResponse);

  // Explains a content block.
  rpc ExplainContentBlockDecision(ExplainContentBlockDecisionRequest) returns (ExplainContentBlockDecisionResponse);

  // Scores a content block.
  rpc ScoreContentBlock(ScoreContentBlockRequest) returns (ScoreContentBlockResponse);

  // Lints a content block.
  rpc LintContentBlocks(LintContentBlocksRequest) returns (LintContentBlocksResponse);

  // Returns a content block.
  rpc GetContentBlockRules(GetContentBlockRulesRequest) returns (GetContentBlockRulesResponse);
}

// The request of `ValidateContentBlock`.
message ValidateContentBlockRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  ContentBlock content_block = 3;
  ValidateContentBlockRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateContentBlock`.
message ValidateContentBlockResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ContentBlock content_block = 1;
  ValidateContentBlockResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

