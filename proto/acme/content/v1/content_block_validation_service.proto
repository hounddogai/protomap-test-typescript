// The request of `ScoreContentBlock`.
message ScoreContentBlockRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string content_block_id = 2;
  ContentBlock content_block = 3;
  ScoreContentBlockRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreContentBlock`.
message ScoreContentBlockResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreContentBlockResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ContentBlock content_block = 1;
  ScoreContentBlockResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

