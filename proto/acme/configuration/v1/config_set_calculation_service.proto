syntax = "proto3";

package acme.configuration.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/configuration/v1/configuration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Configuration.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/configuration/v1;configurationv1";
option java_multiple_files = true;
option java_outer_classname = "ConfigSetCalculationServiceProto";
option java_package = "com.acme.configuration.v1";

// Computes the figures of a config set, such as totals, taxes, and estimates.
service ConfigSetCalculationService {
  // Calculates a config set.
  rpc CalculateConfigSet(CalculateConfigSetRequest) returns (CalculateConfigSetResponse);

  // Estimates a config set.
  rpc EstimateConfigSet(EstimateConfigSetRequest) returns (EstimateConfigSetResponse);

  // Quotes a config set.
  rpc QuoteConfigSet(QuoteConfigSetRequest) returns (QuoteConfigSetResponse);

  // Compares a config set.
  rpc CompareConfigSetOptions(CompareConfigSetOptionsRequest) returns (CompareConfigSetOptionsResponse);

  // Recalculates a config set.
  rpc RecalculateConfigSets(RecalculateConfigSetsRequest) returns (RecalculateConfigSetsResponse);

  // Simulates a config set.
  rpc SimulateConfigSet(SimulateConfigSetRequest) returns (SimulateConfigSetResponse);

  // Explains a config set.
  rpc ExplainConfigSetCalculation(ExplainConfigSetCalculationRequest) returns (ExplainConfigSetCalculationResponse);

  // Returns a config set.
  rpc GetConfigSetRates(GetConfigSetRatesRequest) returns (GetConfigSetRatesResponse);
}

// The request of `CalculateConfigSet`.
message CalculateConfigSetRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string config_set_id = 2;
  ConfigSet config_set = 3;
  CalculateConfigSetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateConfigSet`.
message CalculateConfigSetResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateConfigSetResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ConfigSet config_set = 1;
  CalculateConfigSetResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

