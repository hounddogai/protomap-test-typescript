syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookDeliveryQueryServiceProto";
option java_package = "com.acme.webhooks.v1";

// Answers read-only questions about webhook deliveries, for screens and reports.
service WebhookDeliveryQueryService {
  // Returns a webhook delivery.
  rpc LookupWebhookDelivery(LookupWebhookDeliveryRequest) returns (LookupWebhookDeliveryResponse);

  // Lists webhook deliveries a page at a time.
  rpc BrowseWebhookDeliveries(BrowseWebhookDeliveriesRequest) returns (BrowseWebhookDeliveriesResponse);

  // Lists webhook deliveries a page at a time.
  rpc FindWebhookDeliveries(FindWebhookDeliveriesRequest) returns (FindWebhookDeliveriesResponse);

  // Counts webhook deliveries by status.
  rpc CountWebhookDeliveries(CountWebhookDeliveriesRequest) returns (CountWebhookDeliveriesResponse);

  // Summarizes a webhook delivery.
  rpc SummarizeWebhookDeliveries(SummarizeWebhookDeliveriesRequest) returns (SummarizeWebhookDeliveriesResponse);

  // Lists webhook deliveries a page at a time.
  rpc SuggestWebhookDeliveries(SuggestWebhookDeliveriesRequest) returns (SuggestWebhookDeliveriesResponse);

  // Returns a webhook delivery.
  rpc PeekWebhookDelivery(PeekWebhookDeliveryRequest) returns (PeekWebhookDeliveryResponse);
}

// The request of `LookupWebhookDelivery`.
message LookupWebhookDeliveryRequest {
  acme.common.v1.RequestContext context = 1;
  string webhook_delivery_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupWebhookDelivery`.
message LookupWebhookDeliveryResponse {
  WebhookDelivery webhook_delivery = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseWebhookDeliveries`.
message BrowseWebhookDeliveriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WebhookDeliveryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseWebhookDeliveriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseWebhookDeliveries`.
message BrowseWebhookDeliveriesResponse {
  repeated WebhookDelivery webhook_deliveries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindWebhookDeliveries`.
message FindWebhookDeliveriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WebhookDeliveryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindWebhookDeliveriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindWebhookDeliveries`.
message FindWebhookDeliveriesResponse {
  repeated WebhookDelivery webhook_deliveries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountWebhookDeliveries`.
message CountWebhookDeliveriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WebhookDeliveryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountWebhookDeliveriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountWebhookDeliveries`.
message CountWebhookDeliveriesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeWebhookDeliveries`.
message SummarizeWebhookDeliveriesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_delivery_id = 2;
  SummarizeWebhookDeliveriesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeWebhookDeliveries`.
message SummarizeWebhookDeliveriesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestWebhookDeliveries`.
message SuggestWebhookDeliveriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WebhookDeliveryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestWebhookDeliveriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestWebhookDeliveries`.
message SuggestWebhookDeliveriesResponse {
  repeated WebhookDelivery webhook_deliveries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekWebhookDelivery`.
message PeekWebhookDeliveryRequest {
  acme.common.v1.RequestContext context = 1;
  string webhook_delivery_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekWebhookDelivery`.
message PeekWebhookDeliveryResponse {
  WebhookDelivery webhook_delivery = 1;
  acme.common.v1.OperationResult result = 2;
}
