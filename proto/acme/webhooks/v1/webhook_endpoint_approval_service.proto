syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookEndpointApprovalServiceProto";
option java_package = "com.acme.webhooks.v1";

// Routes webhook endpoints through approval, with escalation and delegation.
service WebhookEndpointApprovalService {
  // Submits a webhook endpoint.
  rpc SubmitWebhookEndpoint(SubmitWebhookEndpointRequest) returns (SubmitWebhookEndpointResponse);

  // Approves a webhook endpoint.
  rpc ApproveWebhookEndpoint(ApproveWebhookEndpointRequest) returns (ApproveWebhookEndpointResponse);

  // Rejects a webhook endpoint.
  rpc RejectWebhookEndpoint(RejectWebhookEndpointRequest) returns (RejectWebhookEndpointResponse);

  // Lists webhook endpoints a page at a time.
  rpc ListPendingWebhookEndpoints(ListPendingWebhookEndpointsRequest) returns (ListPendingWebhookEndpointsResponse);

  // Delegates a webhook endpoint.
  rpc DelegateWebhookEndpointApproval(DelegateWebhookEndpointApprovalRequest) returns (DelegateWebhookEndpointApprovalResponse);

  // Recalls a webhook endpoint.
  rpc RecallWebhookEndpoint(RecallWebhookEndpointRequest) returns (RecallWebhookEndpointResponse);

  // Returns a webhook endpoint.
  rpc GetWebhookEndpointApprovalStatus(GetWebhookEndpointApprovalStatusRequest) returns (GetWebhookEndpointApprovalStatusResponse);

  // Comments a webhook endpoint.
  rpc CommentWebhookEndpointApproval(CommentWebhookEndpointApprovalRequest) returns (CommentWebhookEndpointApprovalResponse);
}

// The request of `SubmitWebhookEndpoint`.
message SubmitWebhookEndpointRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_endpoint_id = 2;
  WebhookEndpoint webhook_endpoint = 3;
  SubmitWebhookEndpointRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWebhookEndpoint`.
message SubmitWebhookEndpointResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookEndpoint webhook_endpoint = 1;
  SubmitWebhookEndpointResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

