syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookSecretApprovalServiceProto";
option java_package = "com.acme.webhooks.v1";

// Routes webhook secrets through approval, with escalation and delegation.
service WebhookSecretApprovalService {
  // Submits a webhook secret.
  rpc SubmitWebhookSecret(SubmitWebhookSecretRequest) returns (SubmitWebhookSecretResponse);

  // Approves a webhook secret.
  rpc ApproveWebhookSecret(ApproveWebhookSecretRequest) returns (ApproveWebhookSecretResponse);

  // Rejects a webhook secret.
  rpc RejectWebhookSecret(RejectWebhookSecretRequest) returns (RejectWebhookSecretResponse);

  // Escalates a webhook secret.
  rpc EscalateWebhookSecret(EscalateWebhookSecretRequest) returns (EscalateWebhookSecretResponse);

  // Delegates a webhook secret.
  rpc DelegateWebhookSecretApproval(DelegateWebhookSecretApprovalRequest) returns (DelegateWebhookSecretApprovalResponse);

  // Recalls a webhook secret.
  rpc RecallWebhookSecret(RecallWebhookSecretRequest) returns (RecallWebhookSecretResponse);

  // Returns a webhook secret.
  rpc GetWebhookSecretApprovalStatus(GetWebhookSecretApprovalStatusRequest) returns (GetWebhookSecretApprovalStatusResponse);
}

// The request of `SubmitWebhookSecret`.
message SubmitWebhookSecretRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_secret_id = 2;
  WebhookSecret webhook_secret = 3;
  SubmitWebhookSecretRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWebhookSecret`.
message SubmitWebhookSecretResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookSecret webhook_secret = 1;
  SubmitWebhookSecretResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

