syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookSecretValidationServiceProto";
option java_package = "com.acme.webhooks.v1";

// Checks webhook secrets against the rules before anything acts on them.
service WebhookSecretValidationService {
  // Validates a webhook secret.
  rpc ValidateWebhookSecret(ValidateWebhookSecretRequest) returns (ValidateWebhookSecretResponse);

  // Previews a webhook secret.
  rpc PreviewWebhookSecret(PreviewWebhookSecretRequest) returns (PreviewWebhookSecretResponse);

  // Checks a webhook secret.
  rpc CheckWebhookSecretEligibility(CheckWebhookSecretEligibilityRequest) returns (CheckWebhookSecretEligibilityResponse);

  // Normalizes a webhook secret.
  rpc NormalizeWebhookSecret(NormalizeWebhookSecretRequest) returns (NormalizeWebhookSecretResponse);

  // Explains a webhook secret.
  rpc ExplainWebhookSecretDecision(ExplainWebhookSecretDecisionRequest) returns (ExplainWebhookSecretDecisionResponse);

  // Scores a webhook secret.
  rpc ScoreWebhookSecret(ScoreWebhookSecretRequest) returns (ScoreWebhookSecretResponse);

  // Lints a webhook secret.
  rpc LintWebhookSecrets(LintWebhookSecretsRequest) returns (LintWebhookSecretsResponse);

  // Returns a webhook secret.
  rpc GetWebhookSecretRules(GetWebhookSecretRulesRequest) returns (GetWebhookSecretRulesResponse);
}

// The request of `ValidateWebhookSecret`.
message ValidateWebhookSecretRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_secret_id = 2;
  WebhookSecret webhook_secret = 3;
  ValidateWebhookSecretRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateWebhookSecret`.
message ValidateWebhookSecretResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookSecret webhook_secret = 1;
  ValidateWebhookSecretResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

