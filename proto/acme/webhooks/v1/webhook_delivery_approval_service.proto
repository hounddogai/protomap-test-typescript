// The request of `ListPendingWebhookDeliveries`.
message ListPendingWebhookDeliveriesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WebhookDeliveryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingWebhookDeliveriesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingWebhookDeliveries`.
message ListPendingWebhookDeliveriesResponse {
  repeated WebhookDelivery webhook_deliveries = 1;
  acme.common.v1.PageInfo page_info = 2;
