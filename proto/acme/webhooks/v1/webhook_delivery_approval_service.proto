syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookDeliveryApprovalServiceProto";
option java_package = "com.acme.webhooks.v1";

// Routes webhook deliveries through approval, with escalation and delegation.
service WebhookDeliveryApprovalService {
  // Submits a webhook delivery.
  rpc SubmitWebhookDelivery(SubmitWebhookDeliveryRequest) returns (SubmitWebhookDeliveryResponse);

  // Approves a webhook delivery.
  rpc ApproveWebhookDelivery(ApproveWebhookDeliveryRequest) returns (ApproveWebhookDeliveryResponse);

  // Rejects a webhook delivery.
  rpc RejectWebhookDelivery(RejectWebhookDeliveryRequest) returns (RejectWebhookDeliveryResponse);

  // Escalates a webhook delivery.
  rpc EscalateWebhookDelivery(EscalateWebhookDeliveryRequest) returns (EscalateWebhookDeliveryResponse);

  // Lists webhook deliveries a page at a time.
  rpc ListPendingWebhookDeliveries(ListPendingWebhookDeliveriesRequest) returns (ListPendingWebhookDeliveriesResponse);

  // Recalls a webhook delivery.
  rpc RecallWebhookDelivery(RecallWebhookDeliveryRequest) returns (RecallWebhookDeliveryResponse);

  // Comments a webhook delivery.
  rpc CommentWebhookDeliveryApproval(CommentWebhookDeliveryApprovalRequest) returns (CommentWebhookDeliveryApprovalResponse);
}

// The request of `SubmitWebhookDelivery`.
message SubmitWebhookDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_delivery_id = 2;
  WebhookDelivery webhook_delivery = 3;
  SubmitWebhookDeliveryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWebhookDelivery`.
message SubmitWebhookDeliveryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookDelivery webhook_delivery = 1;
  SubmitWebhookDeliveryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

