option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookDeliveryWorkflowServiceProto";
option java_package = "com.acme.webhooks.v1";

// Runs the long-lived workflow that takes a webhook delivery from start to finish.
service WebhookDeliveryWorkflowService {
  // Starts a webhook delivery.
  rpc StartWebhookDeliveryWorkflow(StartWebhookDeliveryWorkflowRequest) returns (StartWebhookDeliveryWorkflowResponse);

  // Advances a webhook delivery.
  rpc AdvanceWebhookDeliveryWorkflow(AdvanceWebhookDeliveryWorkflowRequest) returns (AdvanceWebhookDeliveryWorkflowResponse);

  // Retrys a webhook delivery.
  rpc RetryWebhookDeliveryWorkflow(RetryWebhookDeliveryWorkflowRequest) returns (RetryWebhookDeliveryWorkflowResponse);

  // Pauses a webhook delivery.
  rpc PauseWebhookDeliveryWorkflow(PauseWebhookDeliveryWorkflowRequest) returns (PauseWebhookDeliveryWorkflowResponse);

  // Resumes a webhook delivery.
  rpc ResumeWebhookDeliveryWorkflow(ResumeWebhookDeliveryWorkflowRequest) returns (ResumeWebhookDeliveryWorkflowResponse);

  // Returns a webhook delivery.
  rpc InspectWebhookDeliveryWorkflow(InspectWebhookDeliveryWorkflowRequest) returns (InspectWebhookDeliveryWorkflowResponse);

  // Lists webhook deliveries a page at a time.
  rpc ListWebhookDeliveryWorkflows(ListWebhookDeliveryWorkflowsRequest) returns (ListWebhookDeliveryWorkflowsResponse);

  // Signals a webhook delivery.
  rpc SignalWebhookDeliveryWorkflow(SignalWebhookDeliveryWorkflowRequest) returns (SignalWebhookDeliveryWorkflowResponse);
}

// The request of `StartWebhookDeliveryWorkflow`.
message StartWebhookDeliveryWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_delivery_id = 2;
  WebhookDelivery webhook_delivery = 3;
  StartWebhookDeliveryWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWebhookDeliveryWorkflow`.
message StartWebhookDeliveryWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookDelivery webhook_delivery = 1;
  StartWebhookDeliveryWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

