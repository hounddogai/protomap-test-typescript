syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookEndpointValidationServiceProto";
option java_package = "com.acme.webhooks.v1";

// Checks webhook endpoints against the rules before anything acts on them.
service WebhookEndpointValidationService {
  // Validates a webhook endpoint.
  rpc ValidateWebhookEndpoint(ValidateWebhookEndpointRequest) returns (ValidateWebhookEndpointResponse);

  // Previews a webhook endpoint.
  rpc PreviewWebhookEndpoint(PreviewWebhookEndpointRequest) returns (PreviewWebhookEndpointResponse);

  // Checks a webhook endpoint.
  rpc CheckWebhookEndpointEligibility(CheckWebhookEndpointEligibilityRequest) returns (CheckWebhookEndpointEligibilityResponse);

  // Normalizes a webhook endpoint.
  rpc NormalizeWebhookEndpoint(NormalizeWebhookEndpointRequest) returns (NormalizeWebhookEndpointResponse);

  // Explains a webhook endpoint.
  rpc ExplainWebhookEndpointDecision(ExplainWebhookEndpointDecisionRequest) returns (ExplainWebhookEndpointDecisionResponse);

  // Scores a webhook endpoint.
  rpc ScoreWebhookEndpoint(ScoreWebhookEndpointRequest) returns (ScoreWebhookEndpointResponse);

  // Lints a webhook endpoint.
  rpc LintWebhookEndpoints(LintWebhookEndpointsRequest) returns (LintWebhookEndpointsResponse);

  // Returns a webhook endpoint.
  rpc GetWebhookEndpointRules(GetWebhookEndpointRulesRequest) returns (GetWebhookEndpointRulesResponse);
}

// The request of `ValidateWebhookEndpoint`.
message ValidateWebhookEndpointRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_endpoint_id = 2;
  WebhookEndpoint webhook_endpoint = 3;
  ValidateWebhookEndpointRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateWebhookEndpoint`.
message ValidateWebhookEndpointResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookEndpoint webhook_endpoint = 1;
  ValidateWebhookEndpointResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

