// The request of `ScoreWebhookEndpoint`.
message ScoreWebhookEndpointRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_endpoint_id = 2;
  WebhookEndpoint webhook_endpoint = 3;
  ScoreWebhookEndpointRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreWebhookEndpoint`.
message ScoreWebhookEndpointResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreWebhookEndpointResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  WebhookEndpoint webhook_endpoint = 1;
  ScoreWebhookEndpointResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

