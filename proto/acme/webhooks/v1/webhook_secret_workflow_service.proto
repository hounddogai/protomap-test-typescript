syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookSecretWorkflowServiceProto";
option java_package = "com.acme.webhooks.v1";

// Runs the long-lived workflow that takes a webhook secret from start to finish.
service WebhookSecretWorkflowService {
  // Starts a webhook secret.
  rpc StartWebhookSecretWorkflow(StartWebhookSecretWorkflowRequest) returns (StartWebhookSecretWorkflowResponse);

  // Advances a webhook secret.
  rpc AdvanceWebhookSecretWorkflow(AdvanceWebhookSecretWorkflowRequest) returns (AdvanceWebhookSecretWorkflowResponse);

  // Cancels a webhook secret.
  rpc CancelWebhookSecretWorkflow(CancelWebhookSecretWorkflowRequest) returns (CancelWebhookSecretWorkflowResponse);

  // Retrys a webhook secret.
  rpc RetryWebhookSecretWorkflow(RetryWebhookSecretWorkflowRequest) returns (RetryWebhookSecretWorkflowResponse);

  // Pauses a webhook secret.
  rpc PauseWebhookSecretWorkflow(PauseWebhookSecretWorkflowRequest) returns (PauseWebhookSecretWorkflowResponse);

  // Resumes a webhook secret.
  rpc ResumeWebhookSecretWorkflow(ResumeWebhookSecretWorkflowRequest) returns (ResumeWebhookSecretWorkflowResponse);

  // Returns a webhook secret.
  rpc InspectWebhookSecretWorkflow(InspectWebhookSecretWorkflowRequest) returns (InspectWebhookSecretWorkflowResponse);

  // Lists webhook secrets a page at a time.
  rpc ListWebhookSecretWorkflows(ListWebhookSecretWorkflowsRequest) returns (ListWebhookSecretWorkflowsResponse);
}

// The request of `StartWebhookSecretWorkflow`.
message StartWebhookSecretWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_secret_id = 2;
  WebhookSecret webhook_secret = 3;
  StartWebhookSecretWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWebhookSecretWorkflow`.
message StartWebhookSecretWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookSecret webhook_secret = 1;
  StartWebhookSecretWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

