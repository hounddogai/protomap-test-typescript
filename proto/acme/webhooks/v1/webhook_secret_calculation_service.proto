    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookSecret webhook_secret = 1;
  ExplainWebhookSecretCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetWebhookSecretRates`.
