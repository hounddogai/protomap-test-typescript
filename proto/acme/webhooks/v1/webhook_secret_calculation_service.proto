syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookSecretCalculationServiceProto";
option java_package = "com.acme.webhooks.v1";

// Computes the figures of a webhook secret, such as totals, taxes, and estimates.
service WebhookSecretCalculationService {
  // Calculates a webhook secret.
  rpc CalculateWebhookSecret(CalculateWebhookSecretRequest) returns (CalculateWebhookSecretResponse);

  // Estimates a webhook secret.
  rpc EstimateWebhookSecret(EstimateWebhookSecretRequest) returns (EstimateWebhookSecretResponse);

  // Quotes a webhook secret.
  rpc QuoteWebhookSecret(QuoteWebhookSecretRequest) returns (QuoteWebhookSecretResponse);

  // Recalculates a webhook secret.
  rpc RecalculateWebhookSecrets(RecalculateWebhookSecretsRequest) returns (RecalculateWebhookSecretsResponse);

  // Simulates a webhook secret.
  rpc SimulateWebhookSecret(SimulateWebhookSecretRequest) returns (SimulateWebhookSecretResponse);

  // Explains a webhook secret.
  rpc ExplainWebhookSecretCalculation(ExplainWebhookSecretCalculationRequest) returns (ExplainWebhookSecretCalculationResponse);

  // Returns a webhook secret.
  rpc GetWebhookSecretRates(GetWebhookSecretRatesRequest) returns (GetWebhookSecretRatesResponse);
}

// The request of `CalculateWebhookSecret`.
message CalculateWebhookSecretRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_secret_id = 2;
  WebhookSecret webhook_secret = 3;
  CalculateWebhookSecretRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateWebhookSecret`.
message CalculateWebhookSecretResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateWebhookSecretResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  WebhookSecret webhook_secret = 1;
  CalculateWebhookSecretResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

