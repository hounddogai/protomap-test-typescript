syntax = "proto3";

package acme.webhooks.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/webhooks/v1/webhooks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webhooks.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webhooks/v1;webhooksv1";
option java_multiple_files = true;
option java_outer_classname = "WebhookDeliveryValidationServiceProto";
option java_package = "com.acme.webhooks.v1";

// Checks webhook deliveries against the rules before anything acts on them.
service WebhookDeliveryValidationService {
  // Validates a webhook delivery.
  rpc ValidateWebhookDelivery(ValidateWebhookDeliveryRequest) returns (ValidateWebhookDeliveryResponse);

  // Previews a webhook delivery.
  rpc PreviewWebhookDelivery(PreviewWebhookDeliveryRequest) returns (PreviewWebhookDeliveryResponse);

  // Checks a webhook delivery.
  rpc CheckWebhookDeliveryEligibility(CheckWebhookDeliveryEligibilityRequest) returns (CheckWebhookDeliveryEligibilityResponse);

  // Explains a webhook delivery.
  rpc ExplainWebhookDeliveryDecision(ExplainWebhookDeliveryDecisionRequest) returns (ExplainWebhookDeliveryDecisionResponse);

  // Scores a webhook delivery.
  rpc ScoreWebhookDelivery(ScoreWebhookDeliveryRequest) returns (ScoreWebhookDeliveryResponse);

  // Lints a webhook delivery.
  rpc LintWebhookDeliveries(LintWebhookDeliveriesRequest) returns (LintWebhookDeliveriesResponse);

  // Returns a webhook delivery.
  rpc GetWebhookDeliveryRules(GetWebhookDeliveryRulesRequest) returns (GetWebhookDeliveryRulesResponse);
}

// The request of `ValidateWebhookDelivery`.
message ValidateWebhookDeliveryRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string webhook_delivery_id = 2;
  WebhookDelivery webhook_delivery = 3;
  ValidateWebhookDeliveryRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateWebhookDelivery`.
message ValidateWebhookDeliveryResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WebhookDelivery webhook_delivery = 1;
  ValidateWebhookDeliveryResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

