syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "HandoffWorkflowServiceProto";
option java_package = "com.acme.chat.v1";

// Runs the long-lived workflow that takes a handoff from start to finish.
service HandoffWorkflowService {
  // Starts a handoff.
  rpc StartHandoffWorkflow(StartHandoffWorkflowRequest) returns (StartHandoffWorkflowResponse);

  // Advances a handoff.
  rpc AdvanceHandoffWorkflow(AdvanceHandoffWorkflowRequest) returns (AdvanceHandoffWorkflowResponse);

  // Cancels a handoff.
  rpc CancelHandoffWorkflow(CancelHandoffWorkflowRequest) returns (CancelHandoffWorkflowResponse);

  // Retrys a handoff.
  rpc RetryHandoffWorkflow(RetryHandoffWorkflowRequest) returns (RetryHandoffWorkflowResponse);

  // Pauses a handoff.
  rpc PauseHandoffWorkflow(PauseHandoffWorkflowRequest) returns (PauseHandoffWorkflowResponse);

  // Resumes a handoff.
  rpc ResumeHandoffWorkflow(ResumeHandoffWorkflowRequest) returns (ResumeHandoffWorkflowResponse);

  // Returns a handoff.
  rpc InspectHandoffWorkflow(InspectHandoffWorkflowRequest) returns (InspectHandoffWorkflowResponse);

  // Lists handoffs a page at a time.
  rpc ListHandoffWorkflows(ListHandoffWorkflowsRequest) returns (ListHandoffWorkflowsResponse);

  // Signals a handoff.
  rpc SignalHandoffWorkflow(SignalHandoffWorkflowRequest) returns (SignalHandoffWorkflowResponse);
}

// The request of `StartHandoffWorkflow`.
message StartHandoffWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  Handoff handoff = 3;
  StartHandoffWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartHandoffWorkflow`.
message StartHandoffWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Handoff handoff = 1;
  StartHandoffWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

