  map<string, string> annotations = 6;
}

// The response of `PushHandoff`.
message PushHandoffResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Handoff handoff = 1;
  PushHandoffResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullHandoffs`.
message PullHandoffsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  Handoff handoff = 3;
  PullHandoffsRequest.Details details = 4;
