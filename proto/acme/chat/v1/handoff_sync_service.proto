syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "HandoffSyncServiceProto";
option java_package = "com.acme.chat.v1";

// Keeps handoffs in step with the systems of record in other regions.
service HandoffSyncService {
  // Syncs a handoff.
  rpc SyncHandoffs(SyncHandoffsRequest) returns (SyncHandoffsResponse);

  // Pushs a handoff.
  rpc PushHandoff(PushHandoffRequest) returns (PushHandoffResponse);

  // Pulls a handoff.
  rpc PullHandoffs(PullHandoffsRequest) returns (PullHandoffsResponse);

  // Reconciles a handoff.
  rpc ReconcileHandoffs(ReconcileHandoffsRequest) returns (ReconcileHandoffsResponse);

  // Exchanges changes of handoffs with a peer.
  rpc StreamHandoffChanges(stream StreamHandoffChangesRequest) returns (stream StreamHandoffChangesResponse);

  // Resolves a handoff.
  rpc ResolveHandoffConflict(ResolveHandoffConflictRequest) returns (ResolveHandoffConflictResponse);

  // Returns a handoff.
  rpc GetHandoffSyncState(GetHandoffSyncStateRequest) returns (GetHandoffSyncStateResponse);

  // Lists handoffs a page at a time.
  rpc ListHandoffConflicts(ListHandoffConflictsRequest) returns (ListHandoffConflictsResponse);
}

// The request of `SyncHandoffs`.
message SyncHandoffsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  Handoff handoff = 3;
  SyncHandoffsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncHandoffs`.
message SyncHandoffsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Handoff handoff = 1;
  SyncHandoffsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushHandoff`.
message PushHandoffRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  Handoff handoff = 3;
  PushHandoffRequest.Details details = 4;
