  acme.common.v1.OperationResult result = 3;
}

// The request of `GetHandoffSyncState`.
message GetHandoffSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetHandoffSyncState`.
message GetHandoffSyncStateResponse {
  Handoff handoff = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListHandoffConflicts`.
message ListHandoffConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HandoffStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListHandoffConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListHandoffConflicts`.
message ListHandoffConflictsResponse {
  repeated Handoff handoffs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
