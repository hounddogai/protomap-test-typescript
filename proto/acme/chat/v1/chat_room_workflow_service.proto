option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "ChatRoomWorkflowServiceProto";
option java_package = "com.acme.chat.v1";

// Runs the long-lived workflow that takes a chat room from start to finish.
service ChatRoomWorkflowService {
  // Starts a chat room.
  rpc StartChatRoomWorkflow(StartChatRoomWorkflowRequest) returns (StartChatRoomWorkflowResponse);

  // Advances a chat room.
  rpc AdvanceChatRoomWorkflow(AdvanceChatRoomWorkflowRequest) returns (AdvanceChatRoomWorkflowResponse);

  // Cancels a chat room.
  rpc CancelChatRoomWorkflow(CancelChatRoomWorkflowRequest) returns (CancelChatRoomWorkflowResponse);

  // Retrys a chat room.
  rpc RetryChatRoomWorkflow(RetryChatRoomWorkflowRequest) returns (RetryChatRoomWorkflowResponse);

  // Pauses a chat room.
  rpc PauseChatRoomWorkflow(PauseChatRoomWorkflowRequest) returns (PauseChatRoomWorkflowResponse);

  // Resumes a chat room.
  rpc ResumeChatRoomWorkflow(ResumeChatRoomWorkflowRequest) returns (ResumeChatRoomWorkflowResponse);

  // Returns a chat room.
  rpc InspectChatRoomWorkflow(InspectChatRoomWorkflowRequest) returns (InspectChatRoomWorkflowResponse);

  // Lists chat rooms a page at a time.
  rpc ListChatRoomWorkflows(ListChatRoomWorkflowsRequest) returns (ListChatRoomWorkflowsResponse);

  // Signals a chat room.
  rpc SignalChatRoomWorkflow(SignalChatRoomWorkflowRequest) returns (SignalChatRoomWorkflowResponse);
}

// The request of `StartChatRoomWorkflow`.
message StartChatRoomWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_room_id = 2;
  ChatRoom chat_room = 3;
  StartChatRoomWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartChatRoomWorkflow`.
message StartChatRoomWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatRoom chat_room = 1;
  StartChatRoomWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

