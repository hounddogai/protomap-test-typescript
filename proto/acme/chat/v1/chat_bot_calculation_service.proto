syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "ChatBotCalculationServiceProto";
option java_package = "com.acme.chat.v1";

// Computes the figures of a chat bot, such as totals, taxes, and estimates.
service ChatBotCalculationService {
  // Calculates a chat bot.
  rpc CalculateChatBot(CalculateChatBotRequest) returns (CalculateChatBotResponse);

  // Estimates a chat bot.
  rpc EstimateChatBot(EstimateChatBotRequest) returns (EstimateChatBotResponse);

  // Quotes a chat bot.
  rpc QuoteChatBot(QuoteChatBotRequest) returns (QuoteChatBotResponse);

  // Compares a chat bot.
  rpc CompareChatBotOptions(CompareChatBotOptionsRequest) returns (CompareChatBotOptionsResponse);

  // Recalculates a chat bot.
  rpc RecalculateChatBots(RecalculateChatBotsRequest) returns (RecalculateChatBotsResponse);

  // Simulates a chat bot.
  rpc SimulateChatBot(SimulateChatBotRequest) returns (SimulateChatBotResponse);

  // Explains a chat bot.
  rpc ExplainChatBotCalculation(ExplainChatBotCalculationRequest) returns (ExplainChatBotCalculationResponse);

  // Returns a chat bot.
  rpc GetChatBotRates(GetChatBotRatesRequest) returns (GetChatBotRatesResponse);
}

// The request of `CalculateChatBot`.
message CalculateChatBotRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_bot_id = 2;
  ChatBot chat_bot = 3;
  CalculateChatBotRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateChatBot`.
message CalculateChatBotResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateChatBotResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ChatBot chat_bot = 1;
  CalculateChatBotResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

