syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "ChatRoomLifecycleServiceProto";
option java_package = "com.acme.chat.v1";

// Moves a chat room between the states of its lifecycle.
service ChatRoomLifecycleService {
  // Activates a chat room.
  rpc ActivateChatRoom(ActivateChatRoomRequest) returns (ActivateChatRoomResponse);

  // Suspends a chat room.
  rpc SuspendChatRoom(SuspendChatRoomRequest) returns (SuspendChatRoomResponse);

  // Reinstates a chat room.
  rpc ReinstateChatRoom(ReinstateChatRoomRequest) returns (ReinstateChatRoomResponse);

  // Terminates a chat room.
  rpc TerminateChatRoom(TerminateChatRoomRequest) returns (TerminateChatRoomResponse);

  // Renews a chat room.
  rpc RenewChatRoom(RenewChatRoomRequest) returns (RenewChatRoomResponse);

  // Expires a chat room.
  rpc ExpireChatRoom(ExpireChatRoomRequest) returns (ExpireChatRoomResponse);

  // Returns a chat room.
  rpc GetChatRoomLifecycle(GetChatRoomLifecycleRequest) returns (GetChatRoomLifecycleResponse);
}

// The request of `ActivateChatRoom`.
message ActivateChatRoomRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_room_id = 2;
  ActivateChatRoomRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateChatRoom`.
message ActivateChatRoomResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatRoom chat_room = 1;
  ActivateChatRoomResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

