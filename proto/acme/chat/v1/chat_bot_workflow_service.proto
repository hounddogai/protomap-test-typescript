syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "ChatBotWorkflowServiceProto";
option java_package = "com.acme.chat.v1";

// Runs the long-lived workflow that takes a chat bot from start to finish.
service ChatBotWorkflowService {
  // Starts a chat bot.
  rpc StartChatBotWorkflow(StartChatBotWorkflowRequest) returns (StartChatBotWorkflowResponse);

  // Advances a chat bot.
  rpc AdvanceChatBotWorkflow(AdvanceChatBotWorkflowRequest) returns (AdvanceChatBotWorkflowResponse);

  // Retrys a chat bot.
  rpc RetryChatBotWorkflow(RetryChatBotWorkflowRequest) returns (RetryChatBotWorkflowResponse);

  // Pauses a chat bot.
  rpc PauseChatBotWorkflow(PauseChatBotWorkflowRequest) returns (PauseChatBotWorkflowResponse);

  // Resumes a chat bot.
  rpc ResumeChatBotWorkflow(ResumeChatBotWorkflowRequest) returns (ResumeChatBotWorkflowResponse);

  // Returns a chat bot.
  rpc InspectChatBotWorkflow(InspectChatBotWorkflowRequest) returns (InspectChatBotWorkflowResponse);

  // Lists chat bots a page at a time.
  rpc ListChatBotWorkflows(ListChatBotWorkflowsRequest) returns (ListChatBotWorkflowsResponse);

  // Signals a chat bot.
  rpc SignalChatBotWorkflow(SignalChatBotWorkflowRequest) returns (SignalChatBotWorkflowResponse);
}

// The request of `StartChatBotWorkflow`.
message StartChatBotWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chat_bot_id = 2;
  ChatBot chat_bot = 3;
  StartChatBotWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartChatBotWorkflow`.
message StartChatBotWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChatBot chat_bot = 1;
  StartChatBotWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

