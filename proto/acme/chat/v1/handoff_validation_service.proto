syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "HandoffValidationServiceProto";
option java_package = "com.acme.chat.v1";

// Checks handoffs against the rules before anything acts on them.
service HandoffValidationService {
  // Validates a handoff.
  rpc ValidateHandoff(ValidateHandoffRequest) returns (ValidateHandoffResponse);

  // Previews a handoff.
  rpc PreviewHandoff(PreviewHandoffRequest) returns (PreviewHandoffResponse);

  // Checks a handoff.
  rpc CheckHandoffEligibility(CheckHandoffEligibilityRequest) returns (CheckHandoffEligibilityResponse);

  // Normalizes a handoff.
  rpc NormalizeHandoff(NormalizeHandoffRequest) returns (NormalizeHandoffResponse);

  // Explains a handoff.
  rpc ExplainHandoffDecision(ExplainHandoffDecisionRequest) returns (ExplainHandoffDecisionResponse);

  // Scores a handoff.
  rpc ScoreHandoff(ScoreHandoffRequest) returns (ScoreHandoffResponse);

  // Lints a handoff.
  rpc LintHandoffs(LintHandoffsRequest) returns (LintHandoffsResponse);

  // Returns a handoff.
  rpc GetHandoffRules(GetHandoffRulesRequest) returns (GetHandoffRulesResponse);
}

// The request of `ValidateHandoff`.
message ValidateHandoffRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  Handoff handoff = 3;
  ValidateHandoffRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateHandoff`.
message ValidateHandoffResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Handoff handoff = 1;
  ValidateHandoffResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

