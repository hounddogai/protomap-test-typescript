syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "HandoffApprovalServiceProto";
option java_package = "com.acme.chat.v1";

// Routes handoffs through approval, with escalation and delegation.
service HandoffApprovalService {
  // Submits a handoff.
  rpc SubmitHandoff(SubmitHandoffRequest) returns (SubmitHandoffResponse);

  // Approves a handoff.
  rpc ApproveHandoff(ApproveHandoffRequest) returns (ApproveHandoffResponse);

  // Rejects a handoff.
  rpc RejectHandoff(RejectHandoffRequest) returns (RejectHandoffResponse);

  // Escalates a handoff.
  rpc EscalateHandoff(EscalateHandoffRequest) returns (EscalateHandoffResponse);

  // Lists handoffs a page at a time.
  rpc ListPendingHandoffs(ListPendingHandoffsRequest) returns (ListPendingHandoffsResponse);

  // Recalls a handoff.
  rpc RecallHandoff(RecallHandoffRequest) returns (RecallHandoffResponse);

  // Comments a handoff.
  rpc CommentHandoffApproval(CommentHandoffApprovalRequest) returns (CommentHandoffApprovalResponse);
}

// The request of `SubmitHandoff`.
message SubmitHandoffRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  Handoff handoff = 3;
  SubmitHandoffRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitHandoff`.
message SubmitHandoffResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Handoff handoff = 1;
  SubmitHandoffResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

