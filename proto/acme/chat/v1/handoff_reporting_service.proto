syntax = "proto3";

package acme.chat.v1;

import "acme/chat/v1/chat.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Chat.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/chat/v1;chatv1";
option java_multiple_files = true;
option java_outer_classname = "HandoffReportingServiceProto";
option java_package = "com.acme.chat.v1";

// Builds and schedules reports about handoffs.
service HandoffReportingService {
  // Generates a handoff.
  rpc GenerateHandoffReport(GenerateHandoffReportRequest) returns (GenerateHandoffReportResponse);

  // Returns a handoff.
  rpc FetchHandoffReport(FetchHandoffReportRequest) returns (FetchHandoffReportResponse);

  // Schedules a handoff.
  rpc ScheduleHandoffReport(ScheduleHandoffReportRequest) returns (ScheduleHandoffReportResponse);

  // Streams the changes of handoffs as they happen.
  rpc StreamHandoffMetrics(StreamHandoffMetricsRequest) returns (stream StreamHandoffMetricsResponse);

  // Lists handoffs a page at a time.
  rpc ListHandoffReports(ListHandoffReportsRequest) returns (ListHandoffReportsResponse);

  // Shares a handoff.
  rpc ShareHandoffReport(ShareHandoffReportRequest) returns (ShareHandoffReportResponse);

  // Counts handoffs by status.
  rpc CountHandoffTotals(CountHandoffTotalsRequest) returns (CountHandoffTotalsResponse);
}

// The request of `GenerateHandoffReport`.
message GenerateHandoffReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  GenerateHandoffReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateHandoffReport`.
message GenerateHandoffReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchHandoffReport`.
message FetchHandoffReportRequest {
  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchHandoffReport`.
message FetchHandoffReportResponse {
  Handoff handoff = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleHandoffReport`.
message ScheduleHandoffReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  ScheduleHandoffReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleHandoffReport`.
message ScheduleHandoffReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamHandoffMetrics`.
message StreamHandoffMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HandoffStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamHandoffMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamHandoffMetrics`.
message StreamHandoffMetricsResponse {
  Handoff handoff = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListHandoffReports`.
message ListHandoffReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HandoffStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListHandoffReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListHandoffReports`.
message ListHandoffReportsResponse {
  repeated Handoff handoffs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareHandoffReport`.
message ShareHandoffReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string handoff_id = 2;
  ShareHandoffReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareHandoffReport`.
message ShareHandoffReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Handoff handoff = 1;
  ShareHandoffReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountHandoffTotals`.
message CountHandoffTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated HandoffStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountHandoffTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountHandoffTotals`.
message CountHandoffTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
