syntax = "proto3";

package acme.webbff.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/webbff/v1/webbff.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webbff.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webbff/v1;webbffv1";
option java_multiple_files = true;
option java_outer_classname = "ClientSessionQueryServiceProto";
option java_package = "com.acme.webbff.v1";

// Answers read-only questions about client sessions, for screens and reports.
service ClientSessionQueryService {
  // Returns a client session.
  rpc LookupClientSession(LookupClientSessionRequest) returns (LookupClientSessionResponse);

  // Lists client sessions a page at a time.
  rpc BrowseClientSessions(BrowseClientSessionsRequest) returns (BrowseClientSessionsResponse);

  // Lists client sessions a page at a time.
  rpc FindClientSessions(FindClientSessionsRequest) returns (FindClientSessionsResponse);

  // Counts client sessions by status.
  rpc CountClientSessions(CountClientSessionsRequest) returns (CountClientSessionsResponse);

  // Streams every matching client session.
  rpc ExportClientSessions(ExportClientSessionsRequest) returns (stream ExportClientSessionsResponse);

  // Summarizes a client session.
  rpc SummarizeClientSessions(SummarizeClientSessionsRequest) returns (SummarizeClientSessionsResponse);

  // Lists client sessions a page at a time.
  rpc SuggestClientSessions(SuggestClientSessionsRequest) returns (SuggestClientSessionsResponse);
}

// The request of `LookupClientSession`.
message LookupClientSessionRequest {
  acme.common.v1.RequestContext context = 1;
  string client_session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupClientSession`.
message LookupClientSessionResponse {
  ClientSession client_session = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseClientSessions`.
message BrowseClientSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClientSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseClientSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseClientSessions`.
message BrowseClientSessionsResponse {
  repeated ClientSession client_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindClientSessions`.
message FindClientSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClientSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindClientSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindClientSessions`.
message FindClientSessionsResponse {
  repeated ClientSession client_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountClientSessions`.
message CountClientSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClientSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountClientSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountClientSessions`.
message CountClientSessionsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportClientSessions`.
message ExportClientSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClientSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportClientSessionsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportClientSessions`.
message ExportClientSessionsResponse {
  ClientSession client_session = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeClientSessions`.
message SummarizeClientSessionsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string client_session_id = 2;
  SummarizeClientSessionsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeClientSessions`.
message SummarizeClientSessionsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestClientSessions`.
message SuggestClientSessionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClientSessionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestClientSessionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestClientSessions`.
message SuggestClientSessionsResponse {
  repeated ClientSession client_sessions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
