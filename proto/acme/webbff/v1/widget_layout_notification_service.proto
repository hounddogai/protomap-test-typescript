  acme.common.v1.RequestContext context = 1;
  string widget_layout_id = 2;
  NotifyWidgetLayoutWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyWidgetLayoutWatchers`.
message NotifyWidgetLayoutWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WidgetLayout widget_layout = 1;
  NotifyWidgetLayoutWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListWidgetLayoutSubscriptions`.
message ListWidgetLayoutSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated WidgetLayoutStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListWidgetLayoutSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListWidgetLayoutSubscriptions`.
message ListWidgetLayoutSubscriptionsResponse {
  repeated WidgetLayout widget_layouts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendWidgetLayoutTestNotice`.
message SendWidgetLayoutTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
