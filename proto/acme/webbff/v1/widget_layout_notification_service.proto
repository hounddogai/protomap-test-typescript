  }

  WidgetLayout widget_layout = 1;
  SendWidgetLayoutTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetWidgetLayoutPreferences`.
message GetWidgetLayoutPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string widget_layout_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetWidgetLayoutPreferences`.
message GetWidgetLayoutPreferencesResponse {
  WidgetLayout widget_layout = 1;
  acme.common.v1.OperationResult result = 2;
}
