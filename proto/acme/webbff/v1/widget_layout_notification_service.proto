syntax = "proto3";

package acme.webbff.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/webbff/v1/webbff.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webbff.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webbff/v1;webbffv1";
option java_multiple_files = true;
option java_outer_classname = "WidgetLayoutNotificationServiceProto";
option java_package = "com.acme.webbff.v1";

// Tells the people who follow a widget layout what changed.
service WidgetLayoutNotificationService {
  // Subscribes a widget layout.
  rpc SubscribeWidgetLayoutUpdates(SubscribeWidgetLayoutUpdatesRequest) returns (SubscribeWidgetLayoutUpdatesResponse);

  // Unsubscribes a widget layout.
  rpc UnsubscribeWidgetLayoutUpdates(UnsubscribeWidgetLayoutUpdatesRequest) returns (UnsubscribeWidgetLayoutUpdatesResponse);

  // Notifys a widget layout.
  rpc NotifyWidgetLayoutWatchers(NotifyWidgetLayoutWatchersRequest) returns (NotifyWidgetLayoutWatchersResponse);

  // Lists widget layouts a page at a time.
  rpc ListWidgetLayoutSubscriptions(ListWidgetLayoutSubscriptionsRequest) returns (ListWidgetLayoutSubscriptionsResponse);

  // Sends a widget layout.
  rpc SendWidgetLayoutTestNotice(SendWidgetLayoutTestNoticeRequest) returns (SendWidgetLayoutTestNoticeResponse);

  // Returns a widget layout.
  rpc GetWidgetLayoutPreferences(GetWidgetLayoutPreferencesRequest) returns (GetWidgetLayoutPreferencesResponse);
}

// The request of `SubscribeWidgetLayoutUpdates`.
message SubscribeWidgetLayoutUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string widget_layout_id = 2;
  SubscribeWidgetLayoutUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeWidgetLayoutUpdates`.
message SubscribeWidgetLayoutUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WidgetLayout widget_layout = 1;
  SubscribeWidgetLayoutUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeWidgetLayoutUpdates`.
message UnsubscribeWidgetLayoutUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string widget_layout_id = 2;
  UnsubscribeWidgetLayoutUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeWidgetLayoutUpdates`.
message UnsubscribeWidgetLayoutUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WidgetLayout widget_layout = 1;
  UnsubscribeWidgetLayoutUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyWidgetLayoutWatchers`.
message NotifyWidgetLayoutWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
