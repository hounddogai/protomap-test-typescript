// The request of `GetClientSessionPreferences`.
message GetClientSessionPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string client_session_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetClientSessionPreferences`.
message GetClientSessionPreferencesResponse {
