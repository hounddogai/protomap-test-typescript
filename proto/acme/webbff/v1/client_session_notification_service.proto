syntax = "proto3";

package acme.webbff.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/webbff/v1/webbff.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Webbff.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/webbff/v1;webbffv1";
option java_multiple_files = true;
option java_outer_classname = "ClientSessionNotificationServiceProto";
option java_package = "com.acme.webbff.v1";

// Tells the people who follow a client session what changed.
service ClientSessionNotificationService {
  // Subscribes a client session.
  rpc SubscribeClientSessionUpdates(SubscribeClientSessionUpdatesRequest) returns (SubscribeClientSessionUpdatesResponse);

  // Unsubscribes a client session.
  rpc UnsubscribeClientSessionUpdates(UnsubscribeClientSessionUpdatesRequest) returns (UnsubscribeClientSessionUpdatesResponse);

  // Notifys a client session.
  rpc NotifyClientSessionWatchers(NotifyClientSessionWatchersRequest) returns (NotifyClientSessionWatchersResponse);

  // Lists client sessions a page at a time.
  rpc ListClientSessionSubscriptions(ListClientSessionSubscriptionsRequest) returns (ListClientSessionSubscriptionsResponse);

  // Sends a client session.
  rpc SendClientSessionTestNotice(SendClientSessionTestNoticeRequest) returns (SendClientSessionTestNoticeResponse);

  // Returns a client session.
  rpc GetClientSessionPreferences(GetClientSessionPreferencesRequest) returns (GetClientSessionPreferencesResponse);

  // Streams the changes of client sessions as they happen.
  rpc StreamClientSessionNotices(StreamClientSessionNoticesRequest) returns (stream StreamClientSessionNoticesResponse);
}

// The request of `SubscribeClientSessionUpdates`.
message SubscribeClientSessionUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string client_session_id = 2;
  SubscribeClientSessionUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeClientSessionUpdates`.
message SubscribeClientSessionUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClientSession client_session = 1;
  SubscribeClientSessionUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeClientSessionUpdates`.
message UnsubscribeClientSessionUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string client_session_id = 2;
  UnsubscribeClientSessionUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeClientSessionUpdates`.
message UnsubscribeClientSessionUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClientSession client_session = 1;
  UnsubscribeClientSessionUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

