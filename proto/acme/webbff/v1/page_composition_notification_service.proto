  NotifyPageCompositionWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyPageCompositionWatchers`.
message NotifyPageCompositionWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PageComposition page_composition = 1;
  NotifyPageCompositionWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPageCompositionSubscriptions`.
message ListPageCompositionSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PageCompositionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPageCompositionSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPageCompositionSubscriptions`.
message ListPageCompositionSubscriptionsResponse {
  repeated PageComposition page_compositions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendPageCompositionTestNotice`.
message SendPageCompositionTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
