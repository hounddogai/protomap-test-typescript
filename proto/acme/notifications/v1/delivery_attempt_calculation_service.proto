  }

  DeliveryAttempt delivery_attempt = 1;
  ExplainDeliveryAttemptCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDeliveryAttemptRates`.
message GetDeliveryAttemptRatesRequest {
