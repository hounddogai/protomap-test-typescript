// The request of `InspectSubscription`.
message InspectSubscriptionRequest {
  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectSubscription`.
message InspectSubscriptionResponse {
  Subscription subscription = 1;
  acme.common.v1.OperationResult result = 2;
}
