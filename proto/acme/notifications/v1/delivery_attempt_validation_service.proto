syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryAttemptValidationServiceProto";
option java_package = "com.acme.notifications.v1";

// Checks delivery attempts against the rules before anything acts on them.
service DeliveryAttemptValidationService {
  // Validates a delivery attempt.
  rpc ValidateDeliveryAttempt(ValidateDeliveryAttemptRequest) returns (ValidateDeliveryAttemptResponse);

  // Previews a delivery attempt.
  rpc PreviewDeliveryAttempt(PreviewDeliveryAttemptRequest) returns (PreviewDeliveryAttemptResponse);

  // Checks a delivery attempt.
  rpc CheckDeliveryAttemptEligibility(CheckDeliveryAttemptEligibilityRequest) returns (CheckDeliveryAttemptEligibilityResponse);

  // Normalizes a delivery attempt.
  rpc NormalizeDeliveryAttempt(NormalizeDeliveryAttemptRequest) returns (NormalizeDeliveryAttemptResponse);

  // Explains a delivery attempt.
  rpc ExplainDeliveryAttemptDecision(ExplainDeliveryAttemptDecisionRequest) returns (ExplainDeliveryAttemptDecisionResponse);

  // Scores a delivery attempt.
  rpc ScoreDeliveryAttempt(ScoreDeliveryAttemptRequest) returns (ScoreDeliveryAttemptResponse);

  // Lints a delivery attempt.
  rpc LintDeliveryAttempts(LintDeliveryAttemptsRequest) returns (LintDeliveryAttemptsResponse);

  // Returns a delivery attempt.
  rpc GetDeliveryAttemptRules(GetDeliveryAttemptRulesRequest) returns (GetDeliveryAttemptRulesResponse);
}

// The request of `ValidateDeliveryAttempt`.
message ValidateDeliveryAttemptRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  DeliveryAttempt delivery_attempt = 3;
  ValidateDeliveryAttemptRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDeliveryAttempt`.
message ValidateDeliveryAttemptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  ValidateDeliveryAttemptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

