syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionCalculationServiceProto";
option java_package = "com.acme.notifications.v1";

// Computes the figures of a subscription, such as totals, taxes, and estimates.
service SubscriptionCalculationService {
  // Calculates a subscription.
  rpc CalculateSubscription(CalculateSubscriptionRequest) returns (CalculateSubscriptionResponse);

  // Estimates a subscription.
  rpc EstimateSubscription(EstimateSubscriptionRequest) returns (EstimateSubscriptionResponse);

  // Quotes a subscription.
  rpc QuoteSubscription(QuoteSubscriptionRequest) returns (QuoteSubscriptionResponse);

  // Compares a subscription.
  rpc CompareSubscriptionOptions(CompareSubscriptionOptionsRequest) returns (CompareSubscriptionOptionsResponse);

  // Simulates a subscription.
  rpc SimulateSubscription(SimulateSubscriptionRequest) returns (SimulateSubscriptionResponse);

  // Explains a subscription.
  rpc ExplainSubscriptionCalculation(ExplainSubscriptionCalculationRequest) returns (ExplainSubscriptionCalculationResponse);

  // Returns a subscription.
  rpc GetSubscriptionRates(GetSubscriptionRatesRequest) returns (GetSubscriptionRatesResponse);
}

// The request of `CalculateSubscription`.
message CalculateSubscriptionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  Subscription subscription = 3;
  CalculateSubscriptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSubscription`.
message CalculateSubscriptionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSubscriptionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Subscription subscription = 1;
  CalculateSubscriptionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

