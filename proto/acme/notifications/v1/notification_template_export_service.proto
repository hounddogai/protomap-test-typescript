syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationTemplateExportServiceProto";
option java_package = "com.acme.notifications.v1";

// Exports notification templates to files and other systems.
service NotificationTemplateExportService {
  // Streams every matching notification template.
  rpc StreamNotificationTemplateExport(StreamNotificationTemplateExportRequest) returns (stream StreamNotificationTemplateExportResponse);

  // Returns a notification template.
  rpc GetNotificationTemplateExport(GetNotificationTemplateExportRequest) returns (GetNotificationTemplateExportResponse);

  // Cancels a notification template.
  rpc CancelNotificationTemplateExport(CancelNotificationTemplateExportRequest) returns (CancelNotificationTemplateExportResponse);

  // Lists notification templates a page at a time.
  rpc ListNotificationTemplateExports(ListNotificationTemplateExportsRequest) returns (ListNotificationTemplateExportsResponse);

  // Schedules a notification template.
  rpc ScheduleNotificationTemplateExport(ScheduleNotificationTemplateExportRequest) returns (ScheduleNotificationTemplateExportResponse);

  // Retrys a notification template.
  rpc RetryNotificationTemplateExport(RetryNotificationTemplateExportRequest) returns (RetryNotificationTemplateExportResponse);

  // Shares a notification template.
  rpc ShareNotificationTemplateExport(ShareNotificationTemplateExportRequest) returns (ShareNotificationTemplateExportResponse);
}

// The request of `StreamNotificationTemplateExport`.
message StreamNotificationTemplateExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamNotificationTemplateExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamNotificationTemplateExport`.
message StreamNotificationTemplateExportResponse {
  NotificationTemplate notification_template = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetNotificationTemplateExport`.
message GetNotificationTemplateExportRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetNotificationTemplateExport`.
message GetNotificationTemplateExportResponse {
  NotificationTemplate notification_template = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelNotificationTemplateExport`.
message CancelNotificationTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  CancelNotificationTemplateExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelNotificationTemplateExport`.
message CancelNotificationTemplateExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  CancelNotificationTemplateExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListNotificationTemplateExports`.
message ListNotificationTemplateExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListNotificationTemplateExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListNotificationTemplateExports`.
message ListNotificationTemplateExportsResponse {
  repeated NotificationTemplate notification_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleNotificationTemplateExport`.
message ScheduleNotificationTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  ScheduleNotificationTemplateExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleNotificationTemplateExport`.
message ScheduleNotificationTemplateExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryNotificationTemplateExport`.
message RetryNotificationTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  NotificationTemplate notification_template = 3;
  RetryNotificationTemplateExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryNotificationTemplateExport`.
message RetryNotificationTemplateExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  RetryNotificationTemplateExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareNotificationTemplateExport`.
message ShareNotificationTemplateExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  ShareNotificationTemplateExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareNotificationTemplateExport`.
message ShareNotificationTemplateExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  ShareNotificationTemplateExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
