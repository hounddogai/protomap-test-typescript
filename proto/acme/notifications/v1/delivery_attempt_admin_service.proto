syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryAttemptAdminServiceProto";
option java_package = "com.acme.notifications.v1";

// Operator actions on delivery attempts that support staff run by hand.
service DeliveryAttemptAdminService {
  // Archives a delivery attempt.
  rpc ArchiveDeliveryAttempt(ArchiveDeliveryAttemptRequest) returns (ArchiveDeliveryAttemptResponse);

  // Restores a delivery attempt.
  rpc RestoreDeliveryAttempt(RestoreDeliveryAttemptRequest) returns (RestoreDeliveryAttemptResponse);

  // Reassigns a delivery attempt.
  rpc ReassignDeliveryAttempt(ReassignDeliveryAttemptRequest) returns (ReassignDeliveryAttemptResponse);

  // Locks a delivery attempt.
  rpc LockDeliveryAttempt(LockDeliveryAttemptRequest) returns (LockDeliveryAttemptResponse);

  // Unlocks a delivery attempt.
  rpc UnlockDeliveryAttempt(UnlockDeliveryAttemptRequest) returns (UnlockDeliveryAttemptResponse);

  // Transfers a delivery attempt.
  rpc TransferDeliveryAttempt(TransferDeliveryAttemptRequest) returns (TransferDeliveryAttemptResponse);

  // Repairs a delivery attempt.
  rpc RepairDeliveryAttempt(RepairDeliveryAttemptRequest) returns (RepairDeliveryAttemptResponse);

  // Returns a delivery attempt.
  rpc InspectDeliveryAttempt(InspectDeliveryAttemptRequest) returns (InspectDeliveryAttemptResponse);
}

// The request of `ArchiveDeliveryAttempt`.
message ArchiveDeliveryAttemptRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  ArchiveDeliveryAttemptRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveDeliveryAttempt`.
message ArchiveDeliveryAttemptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  ArchiveDeliveryAttemptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

