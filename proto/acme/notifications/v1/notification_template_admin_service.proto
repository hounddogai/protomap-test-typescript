syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationTemplateAdminServiceProto";
option java_package = "com.acme.notifications.v1";

// Operator actions on notification templates that support staff run by hand.
service NotificationTemplateAdminService {
  // Archives a notification template.
  rpc ArchiveNotificationTemplate(ArchiveNotificationTemplateRequest) returns (ArchiveNotificationTemplateResponse);

  // Restores a notification template.
  rpc RestoreNotificationTemplate(RestoreNotificationTemplateRequest) returns (RestoreNotificationTemplateResponse);

  // Deletes a notification template.
  rpc PurgeNotificationTemplate(PurgeNotificationTemplateRequest) returns (PurgeNotificationTemplateResponse);

  // Reassigns a notification template.
  rpc ReassignNotificationTemplate(ReassignNotificationTemplateRequest) returns (ReassignNotificationTemplateResponse);

  // Locks a notification template.
  rpc LockNotificationTemplate(LockNotificationTemplateRequest) returns (LockNotificationTemplateResponse);

  // Unlocks a notification template.
  rpc UnlockNotificationTemplate(UnlockNotificationTemplateRequest) returns (UnlockNotificationTemplateResponse);

  // Transfers a notification template.
  rpc TransferNotificationTemplate(TransferNotificationTemplateRequest) returns (TransferNotificationTemplateResponse);

  // Repairs a notification template.
  rpc RepairNotificationTemplate(RepairNotificationTemplateRequest) returns (RepairNotificationTemplateResponse);
}

// The request of `ArchiveNotificationTemplate`.
message ArchiveNotificationTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  ArchiveNotificationTemplateRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveNotificationTemplate`.
message ArchiveNotificationTemplateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  ArchiveNotificationTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

