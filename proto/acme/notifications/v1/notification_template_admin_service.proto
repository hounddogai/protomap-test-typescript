// The request of `PurgeNotificationTemplate`.
message PurgeNotificationTemplateRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeNotificationTemplate`.
message PurgeNotificationTemplateResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

