syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryAttemptExportServiceProto";
option java_package = "com.acme.notifications.v1";

// Exports delivery attempts to files and other systems.
service DeliveryAttemptExportService {
  // Streams every matching delivery attempt.
  rpc StreamDeliveryAttemptExport(StreamDeliveryAttemptExportRequest) returns (stream StreamDeliveryAttemptExportResponse);

  // Returns a delivery attempt.
  rpc GetDeliveryAttemptExport(GetDeliveryAttemptExportRequest) returns (GetDeliveryAttemptExportResponse);

  // Cancels a delivery attempt.
  rpc CancelDeliveryAttemptExport(CancelDeliveryAttemptExportRequest) returns (CancelDeliveryAttemptExportResponse);

  // Lists delivery attempts a page at a time.
  rpc ListDeliveryAttemptExports(ListDeliveryAttemptExportsRequest) returns (ListDeliveryAttemptExportsResponse);

  // Retrys a delivery attempt.
  rpc RetryDeliveryAttemptExport(RetryDeliveryAttemptExportRequest) returns (RetryDeliveryAttemptExportResponse);

  // Shares a delivery attempt.
  rpc ShareDeliveryAttemptExport(ShareDeliveryAttemptExportRequest) returns (ShareDeliveryAttemptExportResponse);
}

// The request of `StreamDeliveryAttemptExport`.
message StreamDeliveryAttemptExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeliveryAttemptStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDeliveryAttemptExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamDeliveryAttemptExport`.
message StreamDeliveryAttemptExportResponse {
  DeliveryAttempt delivery_attempt = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetDeliveryAttemptExport`.
message GetDeliveryAttemptExportRequest {
  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDeliveryAttemptExport`.
message GetDeliveryAttemptExportResponse {
  DeliveryAttempt delivery_attempt = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelDeliveryAttemptExport`.
message CancelDeliveryAttemptExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  CancelDeliveryAttemptExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelDeliveryAttemptExport`.
message CancelDeliveryAttemptExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  CancelDeliveryAttemptExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListDeliveryAttemptExports`.
message ListDeliveryAttemptExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DeliveryAttemptStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDeliveryAttemptExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDeliveryAttemptExports`.
message ListDeliveryAttemptExportsResponse {
  repeated DeliveryAttempt delivery_attempts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryDeliveryAttemptExport`.
message RetryDeliveryAttemptExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  DeliveryAttempt delivery_attempt = 3;
  RetryDeliveryAttemptExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryDeliveryAttemptExport`.
message RetryDeliveryAttemptExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  RetryDeliveryAttemptExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDeliveryAttemptExport`.
message ShareDeliveryAttemptExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  ShareDeliveryAttemptExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDeliveryAttemptExport`.
message ShareDeliveryAttemptExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  ShareDeliveryAttemptExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
