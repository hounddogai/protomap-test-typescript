syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationTemplateValidationServiceProto";
option java_package = "com.acme.notifications.v1";

// Checks notification templates against the rules before anything acts on them.
service NotificationTemplateValidationService {
  // Validates a notification template.
  rpc ValidateNotificationTemplate(ValidateNotificationTemplateRequest) returns (ValidateNotificationTemplateResponse);

  // Previews a notification template.
  rpc PreviewNotificationTemplate(PreviewNotificationTemplateRequest) returns (PreviewNotificationTemplateResponse);

  // Checks a notification template.
  rpc CheckNotificationTemplateEligibility(CheckNotificationTemplateEligibilityRequest) returns (CheckNotificationTemplateEligibilityResponse);

  // Explains a notification template.
  rpc ExplainNotificationTemplateDecision(ExplainNotificationTemplateDecisionRequest) returns (ExplainNotificationTemplateDecisionResponse);

  // Scores a notification template.
  rpc ScoreNotificationTemplate(ScoreNotificationTemplateRequest) returns (ScoreNotificationTemplateResponse);

  // Lints a notification template.
  rpc LintNotificationTemplates(LintNotificationTemplatesRequest) returns (LintNotificationTemplatesResponse);

  // Returns a notification template.
  rpc GetNotificationTemplateRules(GetNotificationTemplateRulesRequest) returns (GetNotificationTemplateRulesResponse);
}

// The request of `ValidateNotificationTemplate`.
message ValidateNotificationTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  NotificationTemplate notification_template = 3;
  ValidateNotificationTemplateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateNotificationTemplate`.
message ValidateNotificationTemplateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  ValidateNotificationTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

