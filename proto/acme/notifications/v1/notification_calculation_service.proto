syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationCalculationServiceProto";
option java_package = "com.acme.notifications.v1";

// Computes the figures of a notification, such as totals, taxes, and estimates.
service NotificationCalculationService {
  // Calculates a notification.
  rpc CalculateNotification(CalculateNotificationRequest) returns (CalculateNotificationResponse);

  // Estimates a notification.
  rpc EstimateNotification(EstimateNotificationRequest) returns (EstimateNotificationResponse);

  // Quotes a notification.
  rpc QuoteNotification(QuoteNotificationRequest) returns (QuoteNotificationResponse);

  // Compares a notification.
  rpc CompareNotificationOptions(CompareNotificationOptionsRequest) returns (CompareNotificationOptionsResponse);

  // Recalculates a notification.
  rpc RecalculateNotifications(RecalculateNotificationsRequest) returns (RecalculateNotificationsResponse);

  // Simulates a notification.
  rpc SimulateNotification(SimulateNotificationRequest) returns (SimulateNotificationResponse);

  // Explains a notification.
  rpc ExplainNotificationCalculation(ExplainNotificationCalculationRequest) returns (ExplainNotificationCalculationResponse);

  // Returns a notification.
  rpc GetNotificationRates(GetNotificationRatesRequest) returns (GetNotificationRatesResponse);
}

// The request of `CalculateNotification`.
message CalculateNotificationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  CalculateNotificationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateNotification`.
message CalculateNotificationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateNotificationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Notification notification = 1;
  CalculateNotificationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

