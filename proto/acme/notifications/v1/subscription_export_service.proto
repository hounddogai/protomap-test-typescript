syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionExportServiceProto";
option java_package = "com.acme.notifications.v1";

// Exports subscriptions to files and other systems.
service SubscriptionExportService {
  // Streams every matching subscription.
  rpc StreamSubscriptionExport(StreamSubscriptionExportRequest) returns (stream StreamSubscriptionExportResponse);

  // Returns a subscription.
  rpc GetSubscriptionExport(GetSubscriptionExportRequest) returns (GetSubscriptionExportResponse);

  // Cancels a subscription.
  rpc CancelSubscriptionExport(CancelSubscriptionExportRequest) returns (CancelSubscriptionExportResponse);

  // Lists subscriptions a page at a time.
  rpc ListSubscriptionExports(ListSubscriptionExportsRequest) returns (ListSubscriptionExportsResponse);

  // Schedules a subscription.
  rpc ScheduleSubscriptionExport(ScheduleSubscriptionExportRequest) returns (ScheduleSubscriptionExportResponse);

  // Shares a subscription.
  rpc ShareSubscriptionExport(ShareSubscriptionExportRequest) returns (ShareSubscriptionExportResponse);
}

// The request of `StreamSubscriptionExport`.
message StreamSubscriptionExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSubscriptionExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamSubscriptionExport`.
message StreamSubscriptionExportResponse {
  Subscription subscription = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetSubscriptionExport`.
message GetSubscriptionExportRequest {
  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetSubscriptionExport`.
message GetSubscriptionExportResponse {
  Subscription subscription = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelSubscriptionExport`.
message CancelSubscriptionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  CancelSubscriptionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelSubscriptionExport`.
message CancelSubscriptionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Subscription subscription = 1;
  CancelSubscriptionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListSubscriptionExports`.
message ListSubscriptionExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SubscriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSubscriptionExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSubscriptionExports`.
message ListSubscriptionExportsResponse {
  repeated Subscription subscriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleSubscriptionExport`.
message ScheduleSubscriptionExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  ScheduleSubscriptionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSubscriptionExport`.
message ScheduleSubscriptionExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareSubscriptionExport`.
message ShareSubscriptionExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  ShareSubscriptionExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareSubscriptionExport`.
message ShareSubscriptionExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Subscription subscription = 1;
  ShareSubscriptionExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
