syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "DeliveryAttemptNotificationServiceProto";
option java_package = "com.acme.notifications.v1";

// Tells the people who follow a delivery attempt what changed.
service DeliveryAttemptNotificationService {
  // Subscribes a delivery attempt.
  rpc SubscribeDeliveryAttemptUpdates(SubscribeDeliveryAttemptUpdatesRequest) returns (SubscribeDeliveryAttemptUpdatesResponse);

  // Unsubscribes a delivery attempt.
  rpc UnsubscribeDeliveryAttemptUpdates(UnsubscribeDeliveryAttemptUpdatesRequest) returns (UnsubscribeDeliveryAttemptUpdatesResponse);

  // Notifys a delivery attempt.
  rpc NotifyDeliveryAttemptWatchers(NotifyDeliveryAttemptWatchersRequest) returns (NotifyDeliveryAttemptWatchersResponse);

  // Lists delivery attempts a page at a time.
  rpc ListDeliveryAttemptSubscriptions(ListDeliveryAttemptSubscriptionsRequest) returns (ListDeliveryAttemptSubscriptionsResponse);

  // Sends a delivery attempt.
  rpc SendDeliveryAttemptTestNotice(SendDeliveryAttemptTestNoticeRequest) returns (SendDeliveryAttemptTestNoticeResponse);

  // Returns a delivery attempt.
  rpc GetDeliveryAttemptPreferences(GetDeliveryAttemptPreferencesRequest) returns (GetDeliveryAttemptPreferencesResponse);

  // Streams the changes of delivery attempts as they happen.
  rpc StreamDeliveryAttemptNotices(StreamDeliveryAttemptNoticesRequest) returns (stream StreamDeliveryAttemptNoticesResponse);
}

// The request of `SubscribeDeliveryAttemptUpdates`.
message SubscribeDeliveryAttemptUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  SubscribeDeliveryAttemptUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeDeliveryAttemptUpdates`.
message SubscribeDeliveryAttemptUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  SubscribeDeliveryAttemptUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeDeliveryAttemptUpdates`.
message UnsubscribeDeliveryAttemptUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string delivery_attempt_id = 2;
  UnsubscribeDeliveryAttemptUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeDeliveryAttemptUpdates`.
message UnsubscribeDeliveryAttemptUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  DeliveryAttempt delivery_attempt = 1;
  UnsubscribeDeliveryAttemptUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyDeliveryAttemptWatchers`.
message NotifyDeliveryAttemptWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
