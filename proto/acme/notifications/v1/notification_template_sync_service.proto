syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationTemplateSyncServiceProto";
option java_package = "com.acme.notifications.v1";

// Keeps notification templates in step with the systems of record in other regions.
service NotificationTemplateSyncService {
  // Syncs a notification template.
  rpc SyncNotificationTemplates(SyncNotificationTemplatesRequest) returns (SyncNotificationTemplatesResponse);

  // Pushs a notification template.
  rpc PushNotificationTemplate(PushNotificationTemplateRequest) returns (PushNotificationTemplateResponse);

  // Pulls a notification template.
  rpc PullNotificationTemplates(PullNotificationTemplatesRequest) returns (PullNotificationTemplatesResponse);

  // Reconciles a notification template.
  rpc ReconcileNotificationTemplates(ReconcileNotificationTemplatesRequest) returns (ReconcileNotificationTemplatesResponse);

  // Resolves a notification template.
  rpc ResolveNotificationTemplateConflict(ResolveNotificationTemplateConflictRequest) returns (ResolveNotificationTemplateConflictResponse);

  // Lists notification templates a page at a time.
  rpc ListNotificationTemplateConflicts(ListNotificationTemplateConflictsRequest) returns (ListNotificationTemplateConflictsResponse);
}

// The request of `SyncNotificationTemplates`.
message SyncNotificationTemplatesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  NotificationTemplate notification_template = 3;
  SyncNotificationTemplatesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncNotificationTemplates`.
message SyncNotificationTemplatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  SyncNotificationTemplatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

