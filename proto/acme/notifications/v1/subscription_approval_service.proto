syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionApprovalServiceProto";
option java_package = "com.acme.notifications.v1";

// Routes subscriptions through approval, with escalation and delegation.
service SubscriptionApprovalService {
  // Submits a subscription.
  rpc SubmitSubscription(SubmitSubscriptionRequest) returns (SubmitSubscriptionResponse);

  // Approves a subscription.
  rpc ApproveSubscription(ApproveSubscriptionRequest) returns (ApproveSubscriptionResponse);

  // Rejects a subscription.
  rpc RejectSubscription(RejectSubscriptionRequest) returns (RejectSubscriptionResponse);

  // Escalates a subscription.
  rpc EscalateSubscription(EscalateSubscriptionRequest) returns (EscalateSubscriptionResponse);

  // Lists subscriptions a page at a time.
  rpc ListPendingSubscriptions(ListPendingSubscriptionsRequest) returns (ListPendingSubscriptionsResponse);

  // Delegates a subscription.
  rpc DelegateSubscriptionApproval(DelegateSubscriptionApprovalRequest) returns (DelegateSubscriptionApprovalResponse);

  // Recalls a subscription.
  rpc RecallSubscription(RecallSubscriptionRequest) returns (RecallSubscriptionResponse);

  // Returns a subscription.
  rpc GetSubscriptionApprovalStatus(GetSubscriptionApprovalStatusRequest) returns (GetSubscriptionApprovalStatusResponse);

  // Comments a subscription.
  rpc CommentSubscriptionApproval(CommentSubscriptionApprovalRequest) returns (CommentSubscriptionApprovalResponse);
}

// The request of `SubmitSubscription`.
message SubmitSubscriptionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  Subscription subscription = 3;
  SubmitSubscriptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSubscription`.
message SubmitSubscriptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Subscription subscription = 1;
  SubmitSubscriptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

