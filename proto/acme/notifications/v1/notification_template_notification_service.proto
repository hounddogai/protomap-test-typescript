syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationTemplateNotificationServiceProto";
option java_package = "com.acme.notifications.v1";

// Tells the people who follow a notification template what changed.
service NotificationTemplateNotificationService {
  // Subscribes a notification template.
  rpc SubscribeNotificationTemplateUpdates(SubscribeNotificationTemplateUpdatesRequest) returns (SubscribeNotificationTemplateUpdatesResponse);

  // Unsubscribes a notification template.
  rpc UnsubscribeNotificationTemplateUpdates(UnsubscribeNotificationTemplateUpdatesRequest) returns (UnsubscribeNotificationTemplateUpdatesResponse);

  // Notifys a notification template.
  rpc NotifyNotificationTemplateWatchers(NotifyNotificationTemplateWatchersRequest) returns (NotifyNotificationTemplateWatchersResponse);

  // Lists notification templates a page at a time.
  rpc ListNotificationTemplateSubscriptions(ListNotificationTemplateSubscriptionsRequest) returns (ListNotificationTemplateSubscriptionsResponse);

  // Returns a notification template.
  rpc GetNotificationTemplatePreferences(GetNotificationTemplatePreferencesRequest) returns (GetNotificationTemplatePreferencesResponse);

  // Streams the changes of notification templates as they happen.
  rpc StreamNotificationTemplateNotices(StreamNotificationTemplateNoticesRequest) returns (stream StreamNotificationTemplateNoticesResponse);
}

// The request of `SubscribeNotificationTemplateUpdates`.
message SubscribeNotificationTemplateUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  SubscribeNotificationTemplateUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeNotificationTemplateUpdates`.
message SubscribeNotificationTemplateUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  SubscribeNotificationTemplateUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeNotificationTemplateUpdates`.
message UnsubscribeNotificationTemplateUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  UnsubscribeNotificationTemplateUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeNotificationTemplateUpdates`.
message UnsubscribeNotificationTemplateUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  UnsubscribeNotificationTemplateUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyNotificationTemplateWatchers`.
message NotifyNotificationTemplateWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  NotifyNotificationTemplateWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyNotificationTemplateWatchers`.
message NotifyNotificationTemplateWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  NotificationTemplate notification_template = 1;
  NotifyNotificationTemplateWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListNotificationTemplateSubscriptions`.
message ListNotificationTemplateSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListNotificationTemplateSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListNotificationTemplateSubscriptions`.
message ListNotificationTemplateSubscriptionsResponse {
  repeated NotificationTemplate notification_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetNotificationTemplatePreferences`.
message GetNotificationTemplatePreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetNotificationTemplatePreferences`.
message GetNotificationTemplatePreferencesResponse {
  NotificationTemplate notification_template = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamNotificationTemplateNotices`.
message StreamNotificationTemplateNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamNotificationTemplateNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamNotificationTemplateNotices`.
message StreamNotificationTemplateNoticesResponse {
  NotificationTemplate notification_template = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
