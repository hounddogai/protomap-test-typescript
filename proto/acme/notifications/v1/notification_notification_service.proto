syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationNotificationServiceProto";
option java_package = "com.acme.notifications.v1";

// Tells the people who follow a notification what changed.
service NotificationNotificationService {
  // Subscribes a notification.
  rpc SubscribeNotificationUpdates(SubscribeNotificationUpdatesRequest) returns (SubscribeNotificationUpdatesResponse);

  // Unsubscribes a notification.
  rpc UnsubscribeNotificationUpdates(UnsubscribeNotificationUpdatesRequest) returns (UnsubscribeNotificationUpdatesResponse);

  // Notifys a notification.
  rpc NotifyNotificationWatchers(NotifyNotificationWatchersRequest) returns (NotifyNotificationWatchersResponse);

  // Lists notifications a page at a time.
  rpc ListNotificationSubscriptions(ListNotificationSubscriptionsRequest) returns (ListNotificationSubscriptionsResponse);

  // Returns a notification.
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse);

  // Streams the changes of notifications as they happen.
  rpc StreamNotificationNotices(StreamNotificationNoticesRequest) returns (stream StreamNotificationNoticesResponse);
}

// The request of `SubscribeNotificationUpdates`.
message SubscribeNotificationUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  SubscribeNotificationUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeNotificationUpdates`.
message SubscribeNotificationUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  SubscribeNotificationUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeNotificationUpdates`.
message UnsubscribeNotificationUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  UnsubscribeNotificationUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeNotificationUpdates`.
message UnsubscribeNotificationUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  UnsubscribeNotificationUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyNotificationWatchers`.
message NotifyNotificationWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  NotifyNotificationWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyNotificationWatchers`.
message NotifyNotificationWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  NotifyNotificationWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListNotificationSubscriptions`.
message ListNotificationSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListNotificationSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListNotificationSubscriptions`.
message ListNotificationSubscriptionsResponse {
  repeated Notification notifications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetNotificationPreferences`.
message GetNotificationPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetNotificationPreferences`.
message GetNotificationPreferencesResponse {
  Notification notification = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamNotificationNotices`.
message StreamNotificationNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamNotificationNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamNotificationNotices`.
message StreamNotificationNoticesResponse {
  Notification notification = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
