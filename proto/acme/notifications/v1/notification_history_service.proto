syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationHistoryServiceProto";
option java_package = "com.acme.notifications.v1";

// Keeps every version of a notification and restores earlier ones.
service NotificationHistoryService {
  // Records a notification.
  rpc RecordNotificationVersion(RecordNotificationVersionRequest) returns (RecordNotificationVersionResponse);

  // Lists notifications a page at a time.
  rpc ListNotificationVersions(ListNotificationVersionsRequest) returns (ListNotificationVersionsResponse);

  // Returns a notification.
  rpc GetNotificationVersion(GetNotificationVersionRequest) returns (GetNotificationVersionResponse);

  // Compares a notification.
  rpc CompareNotificationVersions(CompareNotificationVersionsRequest) returns (CompareNotificationVersionsResponse);

  // Reverts a notification.
  rpc RevertNotification(RevertNotificationRequest) returns (RevertNotificationResponse);

  // Annotates a notification.
  rpc AnnotateNotificationVersion(AnnotateNotificationVersionRequest) returns (AnnotateNotificationVersionResponse);

  // Deletes a notification.
  rpc PruneNotificationVersions(PruneNotificationVersionsRequest) returns (PruneNotificationVersionsResponse);
}

// The request of `RecordNotificationVersion`.
message RecordNotificationVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  RecordNotificationVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RecordNotificationVersion`.
message RecordNotificationVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  RecordNotificationVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListNotificationVersions`.
message ListNotificationVersionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListNotificationVersionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListNotificationVersions`.
message ListNotificationVersionsResponse {
  repeated Notification notifications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetNotificationVersion`.
message GetNotificationVersionRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetNotificationVersion`.
message GetNotificationVersionResponse {
  Notification notification = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CompareNotificationVersions`.
message CompareNotificationVersionsRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  CompareNotificationVersionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CompareNotificationVersions`.
message CompareNotificationVersionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  CompareNotificationVersionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RevertNotification`.
message RevertNotificationRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  RevertNotificationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RevertNotification`.
message RevertNotificationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  RevertNotificationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AnnotateNotificationVersion`.
message AnnotateNotificationVersionRequest {
  // What the operation needs besides the record.
  message Details {
    int64 version = 1;
    int64 other_version = 2;
    bytes snapshot = 3;
    string author_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  AnnotateNotificationVersionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `AnnotateNotificationVersion`.
message AnnotateNotificationVersionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  AnnotateNotificationVersionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneNotificationVersions`.
message PruneNotificationVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneNotificationVersions`.
message PruneNotificationVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
