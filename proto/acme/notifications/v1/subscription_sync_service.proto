syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionSyncServiceProto";
option java_package = "com.acme.notifications.v1";

// Keeps subscriptions in step with the systems of record in other regions.
service SubscriptionSyncService {
  // Syncs a subscription.
  rpc SyncSubscriptions(SyncSubscriptionsRequest) returns (SyncSubscriptionsResponse);

  // Pushs a subscription.
  rpc PushSubscription(PushSubscriptionRequest) returns (PushSubscriptionResponse);

  // Pulls a subscription.
  rpc PullSubscriptions(PullSubscriptionsRequest) returns (PullSubscriptionsResponse);

  // Reconciles a subscription.
  rpc ReconcileSubscriptions(ReconcileSubscriptionsRequest) returns (ReconcileSubscriptionsResponse);

  // Exchanges changes of subscriptions with a peer.
  rpc StreamSubscriptionChanges(stream StreamSubscriptionChangesRequest) returns (stream StreamSubscriptionChangesResponse);

  // Resolves a subscription.
  rpc ResolveSubscriptionConflict(ResolveSubscriptionConflictRequest) returns (ResolveSubscriptionConflictResponse);

  // Returns a subscription.
  rpc GetSubscriptionSyncState(GetSubscriptionSyncStateRequest) returns (GetSubscriptionSyncStateResponse);

  // Lists subscriptions a page at a time.
  rpc ListSubscriptionConflicts(ListSubscriptionConflictsRequest) returns (ListSubscriptionConflictsResponse);
}

// The request of `SyncSubscriptions`.
message SyncSubscriptionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string subscription_id = 2;
  Subscription subscription = 3;
  SyncSubscriptionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncSubscriptions`.
message SyncSubscriptionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Subscription subscription = 1;
  SyncSubscriptionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

