  Notification notification = 1;
  RestoreNotificationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeNotification`.
message PurgeNotificationRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeNotification`.
message PurgeNotificationResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignNotification`.
message ReassignNotificationRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  ReassignNotificationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReassignNotification`.
message ReassignNotificationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  ReassignNotificationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

