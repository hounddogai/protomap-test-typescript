// The request of `RepairNotification`.
message RepairNotificationRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  RepairNotificationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RepairNotification`.
message RepairNotificationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
