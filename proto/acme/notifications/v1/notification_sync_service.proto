syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationSyncServiceProto";
option java_package = "com.acme.notifications.v1";

// Keeps notifications in step with the systems of record in other regions.
service NotificationSyncService {
  // Syncs a notification.
  rpc SyncNotifications(SyncNotificationsRequest) returns (SyncNotificationsResponse);

  // Pushs a notification.
  rpc PushNotification(PushNotificationRequest) returns (PushNotificationResponse);

  // Pulls a notification.
  rpc PullNotifications(PullNotificationsRequest) returns (PullNotificationsResponse);

  // Reconciles a notification.
  rpc ReconcileNotifications(ReconcileNotificationsRequest) returns (ReconcileNotificationsResponse);

  // Exchanges changes of notifications with a peer.
  rpc StreamNotificationChanges(stream StreamNotificationChangesRequest) returns (stream StreamNotificationChangesResponse);

  // Resolves a notification.
  rpc ResolveNotificationConflict(ResolveNotificationConflictRequest) returns (ResolveNotificationConflictResponse);

  // Returns a notification.
  rpc GetNotificationSyncState(GetNotificationSyncStateRequest) returns (GetNotificationSyncStateResponse);

  // Lists notifications a page at a time.
  rpc ListNotificationConflicts(ListNotificationConflictsRequest) returns (ListNotificationConflictsResponse);
}

// The request of `SyncNotifications`.
message SyncNotificationsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  SyncNotificationsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncNotifications`.
message SyncNotificationsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  SyncNotificationsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushNotification`.
message PushNotificationRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
