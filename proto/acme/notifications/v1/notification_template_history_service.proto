  acme.common.v1.OperationResult result = 3;
}

// The request of `PruneNotificationTemplateVersions`.
message PruneNotificationTemplateVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_template_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneNotificationTemplateVersions`.
message PruneNotificationTemplateVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
