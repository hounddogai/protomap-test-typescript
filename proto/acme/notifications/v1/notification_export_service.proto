syntax = "proto3";

package acme.notifications.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/notifications/v1/notifications.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Notifications.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/notifications/v1;notificationsv1";
option java_multiple_files = true;
option java_outer_classname = "NotificationExportServiceProto";
option java_package = "com.acme.notifications.v1";

// Exports notifications to files and other systems.
service NotificationExportService {
  // Streams every matching notification.
  rpc StreamNotificationExport(StreamNotificationExportRequest) returns (stream StreamNotificationExportResponse);

  // Returns a notification.
  rpc GetNotificationExport(GetNotificationExportRequest) returns (GetNotificationExportResponse);

  // Cancels a notification.
  rpc CancelNotificationExport(CancelNotificationExportRequest) returns (CancelNotificationExportResponse);

  // Lists notifications a page at a time.
  rpc ListNotificationExports(ListNotificationExportsRequest) returns (ListNotificationExportsResponse);

  // Schedules a notification.
  rpc ScheduleNotificationExport(ScheduleNotificationExportRequest) returns (ScheduleNotificationExportResponse);

  // Retrys a notification.
  rpc RetryNotificationExport(RetryNotificationExportRequest) returns (RetryNotificationExportResponse);

  // Shares a notification.
  rpc ShareNotificationExport(ShareNotificationExportRequest) returns (ShareNotificationExportResponse);
}

// The request of `StreamNotificationExport`.
message StreamNotificationExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamNotificationExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamNotificationExport`.
message StreamNotificationExportResponse {
  Notification notification = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetNotificationExport`.
message GetNotificationExportRequest {
  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetNotificationExport`.
message GetNotificationExportResponse {
  Notification notification = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelNotificationExport`.
message CancelNotificationExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  CancelNotificationExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelNotificationExport`.
message CancelNotificationExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  CancelNotificationExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListNotificationExports`.
message ListNotificationExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated NotificationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListNotificationExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListNotificationExports`.
message ListNotificationExportsResponse {
  repeated Notification notifications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleNotificationExport`.
message ScheduleNotificationExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  ScheduleNotificationExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleNotificationExport`.
message ScheduleNotificationExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryNotificationExport`.
message RetryNotificationExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  Notification notification = 3;
  RetryNotificationExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryNotificationExport`.
message RetryNotificationExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  RetryNotificationExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareNotificationExport`.
message ShareNotificationExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string notification_id = 2;
  ShareNotificationExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareNotificationExport`.
message ShareNotificationExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Notification notification = 1;
  ShareNotificationExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
