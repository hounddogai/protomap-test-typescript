syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "RenditionWorkflowServiceProto";
option java_package = "com.acme.media.v1";

// Runs the long-lived workflow that takes a rendition from start to finish.
service RenditionWorkflowService {
  // Starts a rendition.
  rpc StartRenditionWorkflow(StartRenditionWorkflowRequest) returns (StartRenditionWorkflowResponse);

  // Advances a rendition.
  rpc AdvanceRenditionWorkflow(AdvanceRenditionWorkflowRequest) returns (AdvanceRenditionWorkflowResponse);

  // Cancels a rendition.
  rpc CancelRenditionWorkflow(CancelRenditionWorkflowRequest) returns (CancelRenditionWorkflowResponse);

  // Retrys a rendition.
  rpc RetryRenditionWorkflow(RetryRenditionWorkflowRequest) returns (RetryRenditionWorkflowResponse);

  // Pauses a rendition.
  rpc PauseRenditionWorkflow(PauseRenditionWorkflowRequest) returns (PauseRenditionWorkflowResponse);

  // Returns a rendition.
  rpc InspectRenditionWorkflow(InspectRenditionWorkflowRequest) returns (InspectRenditionWorkflowResponse);

  // Lists renditions a page at a time.
  rpc ListRenditionWorkflows(ListRenditionWorkflowsRequest) returns (ListRenditionWorkflowsResponse);

  // Signals a rendition.
  rpc SignalRenditionWorkflow(SignalRenditionWorkflowRequest) returns (SignalRenditionWorkflowResponse);
}

// The request of `StartRenditionWorkflow`.
message StartRenditionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
  StartRenditionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRenditionWorkflow`.
message StartRenditionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rendition rendition = 1;
  StartRenditionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

