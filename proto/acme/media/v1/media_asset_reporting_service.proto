syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "MediaAssetReportingServiceProto";
option java_package = "com.acme.media.v1";

// Builds and schedules reports about media assets.
service MediaAssetReportingService {
  // Generates a media asset.
  rpc GenerateMediaAssetReport(GenerateMediaAssetReportRequest) returns (GenerateMediaAssetReportResponse);

  // Returns a media asset.
  rpc FetchMediaAssetReport(FetchMediaAssetReportRequest) returns (FetchMediaAssetReportResponse);

  // Schedules a media asset.
  rpc ScheduleMediaAssetReport(ScheduleMediaAssetReportRequest) returns (ScheduleMediaAssetReportResponse);

  // Lists media assets a page at a time.
  rpc ListMediaAssetReports(ListMediaAssetReportsRequest) returns (ListMediaAssetReportsResponse);

  // Shares a media asset.
  rpc ShareMediaAssetReport(ShareMediaAssetReportRequest) returns (ShareMediaAssetReportResponse);

  // Deletes a media asset.
  rpc DeleteMediaAssetReport(DeleteMediaAssetReportRequest) returns (DeleteMediaAssetReportResponse);
}

// The request of `GenerateMediaAssetReport`.
message GenerateMediaAssetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  GenerateMediaAssetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateMediaAssetReport`.
message GenerateMediaAssetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchMediaAssetReport`.
message FetchMediaAssetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchMediaAssetReport`.
message FetchMediaAssetReportResponse {
  MediaAsset media_asset = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleMediaAssetReport`.
message ScheduleMediaAssetReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  ScheduleMediaAssetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleMediaAssetReport`.
message ScheduleMediaAssetReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListMediaAssetReports`.
message ListMediaAssetReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MediaAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListMediaAssetReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListMediaAssetReports`.
message ListMediaAssetReportsResponse {
  repeated MediaAsset media_assets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareMediaAssetReport`.
message ShareMediaAssetReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  ShareMediaAssetReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareMediaAssetReport`.
message ShareMediaAssetReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MediaAsset media_asset = 1;
  ShareMediaAssetReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteMediaAssetReport`.
message DeleteMediaAssetReportRequest {
  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteMediaAssetReport`.
message DeleteMediaAssetReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
