syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "RenditionSyncServiceProto";
option java_package = "com.acme.media.v1";

// Keeps renditions in step with the systems of record in other regions.
service RenditionSyncService {
  // Syncs a rendition.
  rpc SyncRenditions(SyncRenditionsRequest) returns (SyncRenditionsResponse);

  // Pushs a rendition.
  rpc PushRendition(PushRenditionRequest) returns (PushRenditionResponse);

  // Pulls a rendition.
  rpc PullRenditions(PullRenditionsRequest) returns (PullRenditionsResponse);

  // Reconciles a rendition.
  rpc ReconcileRenditions(ReconcileRenditionsRequest) returns (ReconcileRenditionsResponse);

  // Exchanges changes of renditions with a peer.
  rpc StreamRenditionChanges(stream StreamRenditionChangesRequest) returns (stream StreamRenditionChangesResponse);

  // Resolves a rendition.
  rpc ResolveRenditionConflict(ResolveRenditionConflictRequest) returns (ResolveRenditionConflictResponse);

  // Returns a rendition.
  rpc GetRenditionSyncState(GetRenditionSyncStateRequest) returns (GetRenditionSyncStateResponse);

  // Lists renditions a page at a time.
  rpc ListRenditionConflicts(ListRenditionConflictsRequest) returns (ListRenditionConflictsResponse);
}

// The request of `SyncRenditions`.
message SyncRenditionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
  SyncRenditionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncRenditions`.
message SyncRenditionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rendition rendition = 1;
  SyncRenditionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushRendition`.
message PushRenditionRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
