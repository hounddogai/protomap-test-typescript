// The request of `ReconcileRenditions`.
message ReconcileRenditionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
  ReconcileRenditionsRequest.Details details = 4;
