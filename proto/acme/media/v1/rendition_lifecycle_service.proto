syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "RenditionLifecycleServiceProto";
option java_package = "com.acme.media.v1";

// Moves a rendition between the states of its lifecycle.
service RenditionLifecycleService {
  // Activates a rendition.
  rpc ActivateRendition(ActivateRenditionRequest) returns (ActivateRenditionResponse);

  // Suspends a rendition.
  rpc SuspendRendition(SuspendRenditionRequest) returns (SuspendRenditionResponse);

  // Reinstates a rendition.
  rpc ReinstateRendition(ReinstateRenditionRequest) returns (ReinstateRenditionResponse);

  // Terminates a rendition.
  rpc TerminateRendition(TerminateRenditionRequest) returns (TerminateRenditionResponse);

  // Renews a rendition.
  rpc RenewRendition(RenewRenditionRequest) returns (RenewRenditionResponse);

  // Expires a rendition.
  rpc ExpireRendition(ExpireRenditionRequest) returns (ExpireRenditionResponse);

  // Returns a rendition.
  rpc GetRenditionLifecycle(GetRenditionLifecycleRequest) returns (GetRenditionLifecycleResponse);

  // Schedules a rendition.
  rpc ScheduleRenditionExpiry(ScheduleRenditionExpiryRequest) returns (ScheduleRenditionExpiryResponse);
}

// The request of `ActivateRendition`.
message ActivateRenditionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  ActivateRenditionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRendition`.
message ActivateRenditionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rendition rendition = 1;
  ActivateRenditionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

