syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "RenditionValidationServiceProto";
option java_package = "com.acme.media.v1";

// Checks renditions against the rules before anything acts on them.
service RenditionValidationService {
  // Validates a rendition.
  rpc ValidateRendition(ValidateRenditionRequest) returns (ValidateRenditionResponse);

  // Previews a rendition.
  rpc PreviewRendition(PreviewRenditionRequest) returns (PreviewRenditionResponse);

  // Checks a rendition.
  rpc CheckRenditionEligibility(CheckRenditionEligibilityRequest) returns (CheckRenditionEligibilityResponse);

  // Normalizes a rendition.
  rpc NormalizeRendition(NormalizeRenditionRequest) returns (NormalizeRenditionResponse);

  // Explains a rendition.
  rpc ExplainRenditionDecision(ExplainRenditionDecisionRequest) returns (ExplainRenditionDecisionResponse);

  // Scores a rendition.
  rpc ScoreRendition(ScoreRenditionRequest) returns (ScoreRenditionResponse);

  // Lints a rendition.
  rpc LintRenditions(LintRenditionsRequest) returns (LintRenditionsResponse);

  // Returns a rendition.
  rpc GetRenditionRules(GetRenditionRulesRequest) returns (GetRenditionRulesResponse);
}

// The request of `ValidateRendition`.
message ValidateRenditionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
  ValidateRenditionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRendition`.
message ValidateRenditionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rendition rendition = 1;
  ValidateRenditionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

