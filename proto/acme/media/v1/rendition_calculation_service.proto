syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "RenditionCalculationServiceProto";
option java_package = "com.acme.media.v1";

// Computes the figures of a rendition, such as totals, taxes, and estimates.
service RenditionCalculationService {
  // Calculates a rendition.
  rpc CalculateRendition(CalculateRenditionRequest) returns (CalculateRenditionResponse);

  // Estimates a rendition.
  rpc EstimateRendition(EstimateRenditionRequest) returns (EstimateRenditionResponse);

  // Quotes a rendition.
  rpc QuoteRendition(QuoteRenditionRequest) returns (QuoteRenditionResponse);

  // Compares a rendition.
  rpc CompareRenditionOptions(CompareRenditionOptionsRequest) returns (CompareRenditionOptionsResponse);

  // Recalculates a rendition.
  rpc RecalculateRenditions(RecalculateRenditionsRequest) returns (RecalculateRenditionsResponse);

  // Simulates a rendition.
  rpc SimulateRendition(SimulateRenditionRequest) returns (SimulateRenditionResponse);

  // Explains a rendition.
  rpc ExplainRenditionCalculation(ExplainRenditionCalculationRequest) returns (ExplainRenditionCalculationResponse);

  // Returns a rendition.
  rpc GetRenditionRates(GetRenditionRatesRequest) returns (GetRenditionRatesResponse);
}

// The request of `CalculateRendition`.
message CalculateRenditionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
  CalculateRenditionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRendition`.
message CalculateRenditionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRenditionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Rendition rendition = 1;
  CalculateRenditionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

