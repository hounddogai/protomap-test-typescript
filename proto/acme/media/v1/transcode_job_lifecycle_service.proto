import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobLifecycleServiceProto";
option java_package = "com.acme.media.v1";

// Moves a transcode job between the states of its lifecycle.
service TranscodeJobLifecycleService {
  // Activates a transcode job.
  rpc ActivateTranscodeJob(ActivateTranscodeJobRequest) returns (ActivateTranscodeJobResponse);

  // Suspends a transcode job.
  rpc SuspendTranscodeJob(SuspendTranscodeJobRequest) returns (SuspendTranscodeJobResponse);

  // Reinstates a transcode job.
  rpc ReinstateTranscodeJob(ReinstateTranscodeJobRequest) returns (ReinstateTranscodeJobResponse);

  // Terminates a transcode job.
  rpc TerminateTranscodeJob(TerminateTranscodeJobRequest) returns (TerminateTranscodeJobResponse);

  // Renews a transcode job.
  rpc RenewTranscodeJob(RenewTranscodeJobRequest) returns (RenewTranscodeJobResponse);

  // Expires a transcode job.
  rpc ExpireTranscodeJob(ExpireTranscodeJobRequest) returns (ExpireTranscodeJobResponse);

  // Returns a transcode job.
  rpc GetTranscodeJobLifecycle(GetTranscodeJobLifecycleRequest) returns (GetTranscodeJobLifecycleResponse);

  // Schedules a transcode job.
  rpc ScheduleTranscodeJobExpiry(ScheduleTranscodeJobExpiryRequest) returns (ScheduleTranscodeJobExpiryResponse);
}

// The request of `ActivateTranscodeJob`.
message ActivateTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  ActivateTranscodeJobRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTranscodeJob`.
message ActivateTranscodeJobResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  ActivateTranscodeJobResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

