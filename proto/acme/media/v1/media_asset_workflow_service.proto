option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "MediaAssetWorkflowServiceProto";
option java_package = "com.acme.media.v1";

// Runs the long-lived workflow that takes a media asset from start to finish.
service MediaAssetWorkflowService {
  // Starts a media asset.
  rpc StartMediaAssetWorkflow(StartMediaAssetWorkflowRequest) returns (StartMediaAssetWorkflowResponse);

  // Advances a media asset.
  rpc AdvanceMediaAssetWorkflow(AdvanceMediaAssetWorkflowRequest) returns (AdvanceMediaAssetWorkflowResponse);

  // Cancels a media asset.
  rpc CancelMediaAssetWorkflow(CancelMediaAssetWorkflowRequest) returns (CancelMediaAssetWorkflowResponse);

  // Retrys a media asset.
  rpc RetryMediaAssetWorkflow(RetryMediaAssetWorkflowRequest) returns (RetryMediaAssetWorkflowResponse);

  // Pauses a media asset.
  rpc PauseMediaAssetWorkflow(PauseMediaAssetWorkflowRequest) returns (PauseMediaAssetWorkflowResponse);

  // Resumes a media asset.
  rpc ResumeMediaAssetWorkflow(ResumeMediaAssetWorkflowRequest) returns (ResumeMediaAssetWorkflowResponse);

  // Returns a media asset.
  rpc InspectMediaAssetWorkflow(InspectMediaAssetWorkflowRequest) returns (InspectMediaAssetWorkflowResponse);

  // Lists media assets a page at a time.
  rpc ListMediaAssetWorkflows(ListMediaAssetWorkflowsRequest) returns (ListMediaAssetWorkflowsResponse);

  // Signals a media asset.
  rpc SignalMediaAssetWorkflow(SignalMediaAssetWorkflowRequest) returns (SignalMediaAssetWorkflowResponse);
}

// The request of `StartMediaAssetWorkflow`.
message StartMediaAssetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  MediaAsset media_asset = 3;
  StartMediaAssetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartMediaAssetWorkflow`.
message StartMediaAssetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MediaAsset media_asset = 1;
  StartMediaAssetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

