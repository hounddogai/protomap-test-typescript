option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobWorkflowServiceProto";
option java_package = "com.acme.media.v1";

// Runs the long-lived workflow that takes a transcode job from start to finish.
service TranscodeJobWorkflowService {
  // Starts a transcode job.
  rpc StartTranscodeJobWorkflow(StartTranscodeJobWorkflowRequest) returns (StartTranscodeJobWorkflowResponse);

  // Advances a transcode job.
  rpc AdvanceTranscodeJobWorkflow(AdvanceTranscodeJobWorkflowRequest) returns (AdvanceTranscodeJobWorkflowResponse);

  // Cancels a transcode job.
  rpc CancelTranscodeJobWorkflow(CancelTranscodeJobWorkflowRequest) returns (CancelTranscodeJobWorkflowResponse);

  // Retrys a transcode job.
  rpc RetryTranscodeJobWorkflow(RetryTranscodeJobWorkflowRequest) returns (RetryTranscodeJobWorkflowResponse);

  // Pauses a transcode job.
  rpc PauseTranscodeJobWorkflow(PauseTranscodeJobWorkflowRequest) returns (PauseTranscodeJobWorkflowResponse);

  // Resumes a transcode job.
  rpc ResumeTranscodeJobWorkflow(ResumeTranscodeJobWorkflowRequest) returns (ResumeTranscodeJobWorkflowResponse);

  // Returns a transcode job.
  rpc InspectTranscodeJobWorkflow(InspectTranscodeJobWorkflowRequest) returns (InspectTranscodeJobWorkflowResponse);

  // Signals a transcode job.
  rpc SignalTranscodeJobWorkflow(SignalTranscodeJobWorkflowRequest) returns (SignalTranscodeJobWorkflowResponse);
}

// The request of `StartTranscodeJobWorkflow`.
message StartTranscodeJobWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  StartTranscodeJobWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTranscodeJobWorkflow`.
message StartTranscodeJobWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  StartTranscodeJobWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

