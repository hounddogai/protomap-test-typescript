syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "MediaAssetApprovalServiceProto";
option java_package = "com.acme.media.v1";

// Routes media assets through approval, with escalation and delegation.
service MediaAssetApprovalService {
  // Submits a media asset.
  rpc SubmitMediaAsset(SubmitMediaAssetRequest) returns (SubmitMediaAssetResponse);

  // Approves a media asset.
  rpc ApproveMediaAsset(ApproveMediaAssetRequest) returns (ApproveMediaAssetResponse);

  // Rejects a media asset.
  rpc RejectMediaAsset(RejectMediaAssetRequest) returns (RejectMediaAssetResponse);

  // Escalates a media asset.
  rpc EscalateMediaAsset(EscalateMediaAssetRequest) returns (EscalateMediaAssetResponse);

  // Lists media assets a page at a time.
  rpc ListPendingMediaAssets(ListPendingMediaAssetsRequest) returns (ListPendingMediaAssetsResponse);

  // Delegates a media asset.
  rpc DelegateMediaAssetApproval(DelegateMediaAssetApprovalRequest) returns (DelegateMediaAssetApprovalResponse);

  // Comments a media asset.
  rpc CommentMediaAssetApproval(CommentMediaAssetApprovalRequest) returns (CommentMediaAssetApprovalResponse);
}

// The request of `SubmitMediaAsset`.
message SubmitMediaAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  MediaAsset media_asset = 3;
  SubmitMediaAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitMediaAsset`.
message SubmitMediaAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MediaAsset media_asset = 1;
  SubmitMediaAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

