// The request of `ScoreTranscodeJob`.
message ScoreTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  ScoreTranscodeJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreTranscodeJob`.
message ScoreTranscodeJobResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreTranscodeJobResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TranscodeJob transcode_job = 1;
  ScoreTranscodeJobResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

