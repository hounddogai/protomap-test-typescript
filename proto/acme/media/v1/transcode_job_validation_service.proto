// The request of `GetTranscodeJobRules`.
message GetTranscodeJobRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTranscodeJobRules`.
message GetTranscodeJobRulesResponse {
  TranscodeJob transcode_job = 1;
  acme.common.v1.OperationResult result = 2;
}
