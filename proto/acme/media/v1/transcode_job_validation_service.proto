syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobValidationServiceProto";
option java_package = "com.acme.media.v1";

// Checks transcode jobs against the rules before anything acts on them.
service TranscodeJobValidationService {
  // Validates a transcode job.
  rpc ValidateTranscodeJob(ValidateTranscodeJobRequest) returns (ValidateTranscodeJobResponse);

  // Previews a transcode job.
  rpc PreviewTranscodeJob(PreviewTranscodeJobRequest) returns (PreviewTranscodeJobResponse);

  // Checks a transcode job.
  rpc CheckTranscodeJobEligibility(CheckTranscodeJobEligibilityRequest) returns (CheckTranscodeJobEligibilityResponse);

  // Normalizes a transcode job.
  rpc NormalizeTranscodeJob(NormalizeTranscodeJobRequest) returns (NormalizeTranscodeJobResponse);

  // Scores a transcode job.
  rpc ScoreTranscodeJob(ScoreTranscodeJobRequest) returns (ScoreTranscodeJobResponse);

  // Lints a transcode job.
  rpc LintTranscodeJobs(LintTranscodeJobsRequest) returns (LintTranscodeJobsResponse);

  // Returns a transcode job.
  rpc GetTranscodeJobRules(GetTranscodeJobRulesRequest) returns (GetTranscodeJobRulesResponse);
}

// The request of `ValidateTranscodeJob`.
message ValidateTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  ValidateTranscodeJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTranscodeJob`.
message ValidateTranscodeJobResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  ValidateTranscodeJobResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewTranscodeJob`.
message PreviewTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
