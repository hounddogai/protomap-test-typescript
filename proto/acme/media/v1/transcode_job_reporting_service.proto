syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobReportingServiceProto";
option java_package = "com.acme.media.v1";

// Builds and schedules reports about transcode jobs.
service TranscodeJobReportingService {
  // Generates a transcode job.
  rpc GenerateTranscodeJobReport(GenerateTranscodeJobReportRequest) returns (GenerateTranscodeJobReportResponse);

  // Returns a transcode job.
  rpc FetchTranscodeJobReport(FetchTranscodeJobReportRequest) returns (FetchTranscodeJobReportResponse);

  // Schedules a transcode job.
  rpc ScheduleTranscodeJobReport(ScheduleTranscodeJobReportRequest) returns (ScheduleTranscodeJobReportResponse);

  // Streams the changes of transcode jobs as they happen.
  rpc StreamTranscodeJobMetrics(StreamTranscodeJobMetricsRequest) returns (stream StreamTranscodeJobMetricsResponse);

  // Lists transcode jobs a page at a time.
  rpc ListTranscodeJobReports(ListTranscodeJobReportsRequest) returns (ListTranscodeJobReportsResponse);

  // Counts transcode jobs by status.
  rpc CountTranscodeJobTotals(CountTranscodeJobTotalsRequest) returns (CountTranscodeJobTotalsResponse);
}

// The request of `GenerateTranscodeJobReport`.
message GenerateTranscodeJobReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  GenerateTranscodeJobReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTranscodeJobReport`.
message GenerateTranscodeJobReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTranscodeJobReport`.
message FetchTranscodeJobReportRequest {
  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTranscodeJobReport`.
message FetchTranscodeJobReportResponse {
  TranscodeJob transcode_job = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTranscodeJobReport`.
message ScheduleTranscodeJobReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  ScheduleTranscodeJobReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTranscodeJobReport`.
message ScheduleTranscodeJobReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamTranscodeJobMetrics`.
message StreamTranscodeJobMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranscodeJobStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamTranscodeJobMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamTranscodeJobMetrics`.
message StreamTranscodeJobMetricsResponse {
  TranscodeJob transcode_job = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListTranscodeJobReports`.
message ListTranscodeJobReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranscodeJobStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTranscodeJobReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTranscodeJobReports`.
message ListTranscodeJobReportsResponse {
  repeated TranscodeJob transcode_jobs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountTranscodeJobTotals`.
message CountTranscodeJobTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TranscodeJobStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountTranscodeJobTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountTranscodeJobTotals`.
message CountTranscodeJobTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
