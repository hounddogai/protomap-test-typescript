syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobSyncServiceProto";
option java_package = "com.acme.media.v1";

// Keeps transcode jobs in step with the systems of record in other regions.
service TranscodeJobSyncService {
  // Syncs a transcode job.
  rpc SyncTranscodeJobs(SyncTranscodeJobsRequest) returns (SyncTranscodeJobsResponse);

  // Pushs a transcode job.
  rpc PushTranscodeJob(PushTranscodeJobRequest) returns (PushTranscodeJobResponse);

  // Pulls a transcode job.
  rpc PullTranscodeJobs(PullTranscodeJobsRequest) returns (PullTranscodeJobsResponse);

  // Reconciles a transcode job.
  rpc ReconcileTranscodeJobs(ReconcileTranscodeJobsRequest) returns (ReconcileTranscodeJobsResponse);

  // Exchanges changes of transcode jobs with a peer.
  rpc StreamTranscodeJobChanges(stream StreamTranscodeJobChangesRequest) returns (stream StreamTranscodeJobChangesResponse);

  // Resolves a transcode job.
  rpc ResolveTranscodeJobConflict(ResolveTranscodeJobConflictRequest) returns (ResolveTranscodeJobConflictResponse);

  // Returns a transcode job.
  rpc GetTranscodeJobSyncState(GetTranscodeJobSyncStateRequest) returns (GetTranscodeJobSyncStateResponse);

  // Lists transcode jobs a page at a time.
  rpc ListTranscodeJobConflicts(ListTranscodeJobConflictsRequest) returns (ListTranscodeJobConflictsResponse);
}

// The request of `SyncTranscodeJobs`.
message SyncTranscodeJobsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  SyncTranscodeJobsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncTranscodeJobs`.
message SyncTranscodeJobsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  SyncTranscodeJobsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushTranscodeJob`.
message PushTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  PushTranscodeJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushTranscodeJob`.
message PushTranscodeJobResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  PushTranscodeJobResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullTranscodeJobs`.
message PullTranscodeJobsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  PullTranscodeJobsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullTranscodeJobs`.
message PullTranscodeJobsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  PullTranscodeJobsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileTranscodeJobs`.
message ReconcileTranscodeJobsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  ReconcileTranscodeJobsRequest.Details details = 4;
  string reason = 5;
