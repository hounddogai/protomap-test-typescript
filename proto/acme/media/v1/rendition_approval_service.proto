syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "RenditionApprovalServiceProto";
option java_package = "com.acme.media.v1";

// Routes renditions through approval, with escalation and delegation.
service RenditionApprovalService {
  // Submits a rendition.
  rpc SubmitRendition(SubmitRenditionRequest) returns (SubmitRenditionResponse);

  // Approves a rendition.
  rpc ApproveRendition(ApproveRenditionRequest) returns (ApproveRenditionResponse);

  // Rejects a rendition.
  rpc RejectRendition(RejectRenditionRequest) returns (RejectRenditionResponse);

  // Escalates a rendition.
  rpc EscalateRendition(EscalateRenditionRequest) returns (EscalateRenditionResponse);

  // Lists renditions a page at a time.
  rpc ListPendingRenditions(ListPendingRenditionsRequest) returns (ListPendingRenditionsResponse);

  // Delegates a rendition.
  rpc DelegateRenditionApproval(DelegateRenditionApprovalRequest) returns (DelegateRenditionApprovalResponse);

  // Recalls a rendition.
  rpc RecallRendition(RecallRenditionRequest) returns (RecallRenditionResponse);

  // Returns a rendition.
  rpc GetRenditionApprovalStatus(GetRenditionApprovalStatusRequest) returns (GetRenditionApprovalStatusResponse);

  // Comments a rendition.
  rpc CommentRenditionApproval(CommentRenditionApprovalRequest) returns (CommentRenditionApprovalResponse);
}

// The request of `SubmitRendition`.
message SubmitRenditionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rendition_id = 2;
  Rendition rendition = 3;
  SubmitRenditionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRendition`.
message SubmitRenditionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rendition rendition = 1;
  SubmitRenditionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

