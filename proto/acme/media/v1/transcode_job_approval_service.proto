syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobApprovalServiceProto";
option java_package = "com.acme.media.v1";

// Routes transcode jobs through approval, with escalation and delegation.
service TranscodeJobApprovalService {
  // Submits a transcode job.
  rpc SubmitTranscodeJob(SubmitTranscodeJobRequest) returns (SubmitTranscodeJobResponse);

  // Approves a transcode job.
  rpc ApproveTranscodeJob(ApproveTranscodeJobRequest) returns (ApproveTranscodeJobResponse);

  // Rejects a transcode job.
  rpc RejectTranscodeJob(RejectTranscodeJobRequest) returns (RejectTranscodeJobResponse);

  // Escalates a transcode job.
  rpc EscalateTranscodeJob(EscalateTranscodeJobRequest) returns (EscalateTranscodeJobResponse);

  // Lists transcode jobs a page at a time.
  rpc ListPendingTranscodeJobs(ListPendingTranscodeJobsRequest) returns (ListPendingTranscodeJobsResponse);

  // Delegates a transcode job.
  rpc DelegateTranscodeJobApproval(DelegateTranscodeJobApprovalRequest) returns (DelegateTranscodeJobApprovalResponse);

  // Recalls a transcode job.
  rpc RecallTranscodeJob(RecallTranscodeJobRequest) returns (RecallTranscodeJobResponse);

  // Returns a transcode job.
  rpc GetTranscodeJobApprovalStatus(GetTranscodeJobApprovalStatusRequest) returns (GetTranscodeJobApprovalStatusResponse);

  // Comments a transcode job.
  rpc CommentTranscodeJobApproval(CommentTranscodeJobApprovalRequest) returns (CommentTranscodeJobApprovalResponse);
}

// The request of `SubmitTranscodeJob`.
message SubmitTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  SubmitTranscodeJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTranscodeJob`.
message SubmitTranscodeJobResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  SubmitTranscodeJobResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

