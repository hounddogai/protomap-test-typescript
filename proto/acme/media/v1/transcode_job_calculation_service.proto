    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TranscodeJob transcode_job = 1;
  ExplainTranscodeJobCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTranscodeJobRates`.
message GetTranscodeJobRatesRequest {
