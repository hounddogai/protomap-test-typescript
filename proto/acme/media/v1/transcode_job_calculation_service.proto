syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "TranscodeJobCalculationServiceProto";
option java_package = "com.acme.media.v1";

// Computes the figures of a transcode job, such as totals, taxes, and estimates.
service TranscodeJobCalculationService {
  // Calculates a transcode job.
  rpc CalculateTranscodeJob(CalculateTranscodeJobRequest) returns (CalculateTranscodeJobResponse);

  // Estimates a transcode job.
  rpc EstimateTranscodeJob(EstimateTranscodeJobRequest) returns (EstimateTranscodeJobResponse);

  // Quotes a transcode job.
  rpc QuoteTranscodeJob(QuoteTranscodeJobRequest) returns (QuoteTranscodeJobResponse);

  // Compares a transcode job.
  rpc CompareTranscodeJobOptions(CompareTranscodeJobOptionsRequest) returns (CompareTranscodeJobOptionsResponse);

  // Recalculates a transcode job.
  rpc RecalculateTranscodeJobs(RecalculateTranscodeJobsRequest) returns (RecalculateTranscodeJobsResponse);

  // Simulates a transcode job.
  rpc SimulateTranscodeJob(SimulateTranscodeJobRequest) returns (SimulateTranscodeJobResponse);

  // Explains a transcode job.
  rpc ExplainTranscodeJobCalculation(ExplainTranscodeJobCalculationRequest) returns (ExplainTranscodeJobCalculationResponse);

  // Returns a transcode job.
  rpc GetTranscodeJobRates(GetTranscodeJobRatesRequest) returns (GetTranscodeJobRatesResponse);
}

// The request of `CalculateTranscodeJob`.
message CalculateTranscodeJobRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string transcode_job_id = 2;
  TranscodeJob transcode_job = 3;
  CalculateTranscodeJobRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTranscodeJob`.
message CalculateTranscodeJobResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTranscodeJobResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  TranscodeJob transcode_job = 1;
  CalculateTranscodeJobResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

