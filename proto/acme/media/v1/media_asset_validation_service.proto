syntax = "proto3";

package acme.media.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/media/v1/media.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Media.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/media/v1;mediav1";
option java_multiple_files = true;
option java_outer_classname = "MediaAssetValidationServiceProto";
option java_package = "com.acme.media.v1";

// Checks media assets against the rules before anything acts on them.
service MediaAssetValidationService {
  // Validates a media asset.
  rpc ValidateMediaAsset(ValidateMediaAssetRequest) returns (ValidateMediaAssetResponse);

  // Previews a media asset.
  rpc PreviewMediaAsset(PreviewMediaAssetRequest) returns (PreviewMediaAssetResponse);

  // Checks a media asset.
  rpc CheckMediaAssetEligibility(CheckMediaAssetEligibilityRequest) returns (CheckMediaAssetEligibilityResponse);

  // Normalizes a media asset.
  rpc NormalizeMediaAsset(NormalizeMediaAssetRequest) returns (NormalizeMediaAssetResponse);

  // Explains a media asset.
  rpc ExplainMediaAssetDecision(ExplainMediaAssetDecisionRequest) returns (ExplainMediaAssetDecisionResponse);

  // Scores a media asset.
  rpc ScoreMediaAsset(ScoreMediaAssetRequest) returns (ScoreMediaAssetResponse);

  // Lints a media asset.
  rpc LintMediaAssets(LintMediaAssetsRequest) returns (LintMediaAssetsResponse);

  // Returns a media asset.
  rpc GetMediaAssetRules(GetMediaAssetRulesRequest) returns (GetMediaAssetRulesResponse);
}

// The request of `ValidateMediaAsset`.
message ValidateMediaAssetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string media_asset_id = 2;
  MediaAsset media_asset = 3;
  ValidateMediaAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMediaAsset`.
message ValidateMediaAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MediaAsset media_asset = 1;
  ValidateMediaAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

