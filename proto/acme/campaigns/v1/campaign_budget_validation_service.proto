syntax = "proto3";

package acme.campaigns.v1;

import "acme/campaigns/v1/campaigns.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignBudgetValidationServiceProto";
option java_package = "com.acme.campaigns.v1";

// Checks campaign budgets against the rules before anything acts on them.
service CampaignBudgetValidationService {
  // Validates a campaign budget.
  rpc ValidateCampaignBudget(ValidateCampaignBudgetRequest) returns (ValidateCampaignBudgetResponse);

  // Previews a campaign budget.
  rpc PreviewCampaignBudget(PreviewCampaignBudgetRequest) returns (PreviewCampaignBudgetResponse);

  // Checks a campaign budget.
  rpc CheckCampaignBudgetEligibility(CheckCampaignBudgetEligibilityRequest) returns (CheckCampaignBudgetEligibilityResponse);

  // Normalizes a campaign budget.
  rpc NormalizeCampaignBudget(NormalizeCampaignBudgetRequest) returns (NormalizeCampaignBudgetResponse);

  // Explains a campaign budget.
  rpc ExplainCampaignBudgetDecision(ExplainCampaignBudgetDecisionRequest) returns (ExplainCampaignBudgetDecisionResponse);

  // Scores a campaign budget.
  rpc ScoreCampaignBudget(ScoreCampaignBudgetRequest) returns (ScoreCampaignBudgetResponse);

  // Lints a campaign budget.
  rpc LintCampaignBudgets(LintCampaignBudgetsRequest) returns (LintCampaignBudgetsResponse);

  // Returns a campaign budget.
  rpc GetCampaignBudgetRules(GetCampaignBudgetRulesRequest) returns (GetCampaignBudgetRulesResponse);
}

// The request of `ValidateCampaignBudget`.
message ValidateCampaignBudgetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_budget_id = 2;
  CampaignBudget campaign_budget = 3;
  ValidateCampaignBudgetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCampaignBudget`.
message ValidateCampaignBudgetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CampaignBudget campaign_budget = 1;
  ValidateCampaignBudgetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

