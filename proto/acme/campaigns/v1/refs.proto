syntax = "proto3";

package acme.campaigns.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.campaigns.v1";

// A reference to a marketing campaign of the campaigns domain.
message MarketingCampaignRef {
  string marketing_campaign_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp starts_at = 3;
}

// A reference to a campaign asset of the campaigns domain.
message CampaignAssetRef {
  string campaign_asset_id = 1;
  string display_name = 2;
  string code = 3;
}

// A reference to a campaign budget of the campaigns domain.
message CampaignBudgetRef {
  string campaign_budget_id = 1;
  string display_name = 2;
  string currency_code = 3;
}
