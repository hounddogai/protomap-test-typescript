syntax = "proto3";

package acme.campaigns.v1;

import "acme/campaigns/v1/campaigns.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignAssetQueryServiceProto";
option java_package = "com.acme.campaigns.v1";

// Answers read-only questions about campaign assets, for screens and reports.
service CampaignAssetQueryService {
  // Returns a campaign asset.
  rpc LookupCampaignAsset(LookupCampaignAssetRequest) returns (LookupCampaignAssetResponse);

  // Lists campaign assets a page at a time.
  rpc BrowseCampaignAssets(BrowseCampaignAssetsRequest) returns (BrowseCampaignAssetsResponse);

  // Counts campaign assets by status.
  rpc CountCampaignAssets(CountCampaignAssetsRequest) returns (CountCampaignAssetsResponse);

  // Returns several campaign assets at once.
  rpc ResolveCampaignAssets(ResolveCampaignAssetsRequest) returns (ResolveCampaignAssetsResponse);

  // Summarizes a campaign asset.
  rpc SummarizeCampaignAssets(SummarizeCampaignAssetsRequest) returns (SummarizeCampaignAssetsResponse);

  // Lists campaign assets a page at a time.
  rpc SuggestCampaignAssets(SuggestCampaignAssetsRequest) returns (SuggestCampaignAssetsResponse);

  // Returns a campaign asset.
  rpc PeekCampaignAsset(PeekCampaignAssetRequest) returns (PeekCampaignAssetResponse);
}

// The request of `LookupCampaignAsset`.
message LookupCampaignAssetRequest {
  acme.common.v1.RequestContext context = 1;
  string campaign_asset_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupCampaignAsset`.
message LookupCampaignAssetResponse {
  CampaignAsset campaign_asset = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseCampaignAssets`.
message BrowseCampaignAssetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CampaignAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseCampaignAssetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseCampaignAssets`.
message BrowseCampaignAssetsResponse {
  repeated CampaignAsset campaign_assets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCampaignAssets`.
message CountCampaignAssetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CampaignAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCampaignAssetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCampaignAssets`.
message CountCampaignAssetsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveCampaignAssets`.
message ResolveCampaignAssetsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string campaign_asset_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveCampaignAssets`.
message ResolveCampaignAssetsResponse {
  repeated CampaignAsset campaign_assets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeCampaignAssets`.
message SummarizeCampaignAssetsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_asset_id = 2;
  SummarizeCampaignAssetsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeCampaignAssets`.
message SummarizeCampaignAssetsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestCampaignAssets`.
message SuggestCampaignAssetsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CampaignAssetStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestCampaignAssetsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestCampaignAssets`.
message SuggestCampaignAssetsResponse {
  repeated CampaignAsset campaign_assets = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekCampaignAsset`.
message PeekCampaignAssetRequest {
  acme.common.v1.RequestContext context = 1;
  string campaign_asset_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekCampaignAsset`.
message PeekCampaignAssetResponse {
  CampaignAsset campaign_asset = 1;
  acme.common.v1.OperationResult result = 2;
}
