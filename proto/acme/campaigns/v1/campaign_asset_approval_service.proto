syntax = "proto3";

package acme.campaigns.v1;

import "acme/campaigns/v1/campaigns.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignAssetApprovalServiceProto";
option java_package = "com.acme.campaigns.v1";

// Routes campaign assets through approval, with escalation and delegation.
service CampaignAssetApprovalService {
  // Submits a campaign asset.
  rpc SubmitCampaignAsset(SubmitCampaignAssetRequest) returns (SubmitCampaignAssetResponse);

  // Approves a campaign asset.
  rpc ApproveCampaignAsset(ApproveCampaignAssetRequest) returns (ApproveCampaignAssetResponse);

  // Rejects a campaign asset.
  rpc RejectCampaignAsset(RejectCampaignAssetRequest) returns (RejectCampaignAssetResponse);

  // Escalates a campaign asset.
  rpc EscalateCampaignAsset(EscalateCampaignAssetRequest) returns (EscalateCampaignAssetResponse);

  // Lists campaign assets a page at a time.
  rpc ListPendingCampaignAssets(ListPendingCampaignAssetsRequest) returns (ListPendingCampaignAssetsResponse);

  // Delegates a campaign asset.
  rpc DelegateCampaignAssetApproval(DelegateCampaignAssetApprovalRequest) returns (DelegateCampaignAssetApprovalResponse);

  // Recalls a campaign asset.
  rpc RecallCampaignAsset(RecallCampaignAssetRequest) returns (RecallCampaignAssetResponse);

  // Comments a campaign asset.
  rpc CommentCampaignAssetApproval(CommentCampaignAssetApprovalRequest) returns (CommentCampaignAssetApprovalResponse);
}

// The request of `SubmitCampaignAsset`.
message SubmitCampaignAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_asset_id = 2;
  CampaignAsset campaign_asset = 3;
  SubmitCampaignAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCampaignAsset`.
message SubmitCampaignAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CampaignAsset campaign_asset = 1;
  SubmitCampaignAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

