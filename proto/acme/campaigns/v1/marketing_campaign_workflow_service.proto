syntax = "proto3";

package acme.campaigns.v1;

import "acme/campaigns/v1/campaigns.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "MarketingCampaignWorkflowServiceProto";
option java_package = "com.acme.campaigns.v1";

// Runs the long-lived workflow that takes a marketing campaign from start to finish.
service MarketingCampaignWorkflowService {
  // Starts a marketing campaign.
  rpc StartMarketingCampaignWorkflow(StartMarketingCampaignWorkflowRequest) returns (StartMarketingCampaignWorkflowResponse);

  // Advances a marketing campaign.
  rpc AdvanceMarketingCampaignWorkflow(AdvanceMarketingCampaignWorkflowRequest) returns (AdvanceMarketingCampaignWorkflowResponse);

  // Cancels a marketing campaign.
  rpc CancelMarketingCampaignWorkflow(CancelMarketingCampaignWorkflowRequest) returns (CancelMarketingCampaignWorkflowResponse);

  // Pauses a marketing campaign.
  rpc PauseMarketingCampaignWorkflow(PauseMarketingCampaignWorkflowRequest) returns (PauseMarketingCampaignWorkflowResponse);

  // Resumes a marketing campaign.
  rpc ResumeMarketingCampaignWorkflow(ResumeMarketingCampaignWorkflowRequest) returns (ResumeMarketingCampaignWorkflowResponse);

  // Lists marketing campaigns a page at a time.
  rpc ListMarketingCampaignWorkflows(ListMarketingCampaignWorkflowsRequest) returns (ListMarketingCampaignWorkflowsResponse);

  // Signals a marketing campaign.
  rpc SignalMarketingCampaignWorkflow(SignalMarketingCampaignWorkflowRequest) returns (SignalMarketingCampaignWorkflowResponse);
}

// The request of `StartMarketingCampaignWorkflow`.
message StartMarketingCampaignWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string marketing_campaign_id = 2;
  MarketingCampaign marketing_campaign = 3;
  StartMarketingCampaignWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartMarketingCampaignWorkflow`.
message StartMarketingCampaignWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MarketingCampaign marketing_campaign = 1;
  StartMarketingCampaignWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

