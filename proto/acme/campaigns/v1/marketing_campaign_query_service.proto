syntax = "proto3";

package acme.campaigns.v1;

import "acme/campaigns/v1/campaigns.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "MarketingCampaignQueryServiceProto";
option java_package = "com.acme.campaigns.v1";

// Answers read-only questions about marketing campaigns, for screens and reports.
service MarketingCampaignQueryService {
  // Returns a marketing campaign.
  rpc LookupMarketingCampaign(LookupMarketingCampaignRequest) returns (LookupMarketingCampaignResponse);

  // Lists marketing campaigns a page at a time.
  rpc BrowseMarketingCampaigns(BrowseMarketingCampaignsRequest) returns (BrowseMarketingCampaignsResponse);

  // Lists marketing campaigns a page at a time.
  rpc FindMarketingCampaigns(FindMarketingCampaignsRequest) returns (FindMarketingCampaignsResponse);

  // Counts marketing campaigns by status.
  rpc CountMarketingCampaigns(CountMarketingCampaignsRequest) returns (CountMarketingCampaignsResponse);

  // Returns several marketing campaigns at once.
  rpc ResolveMarketingCampaigns(ResolveMarketingCampaignsRequest) returns (ResolveMarketingCampaignsResponse);

  // Streams every matching marketing campaign.
  rpc ExportMarketingCampaigns(ExportMarketingCampaignsRequest) returns (stream ExportMarketingCampaignsResponse);

  // Summarizes a marketing campaign.
  rpc SummarizeMarketingCampaigns(SummarizeMarketingCampaignsRequest) returns (SummarizeMarketingCampaignsResponse);

  // Lists marketing campaigns a page at a time.
  rpc SuggestMarketingCampaigns(SuggestMarketingCampaignsRequest) returns (SuggestMarketingCampaignsResponse);

  // Returns a marketing campaign.
  rpc PeekMarketingCampaign(PeekMarketingCampaignRequest) returns (PeekMarketingCampaignResponse);
}

// The request of `LookupMarketingCampaign`.
message LookupMarketingCampaignRequest {
  acme.common.v1.RequestContext context = 1;
  string marketing_campaign_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupMarketingCampaign`.
message LookupMarketingCampaignResponse {
  MarketingCampaign marketing_campaign = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseMarketingCampaigns`.
message BrowseMarketingCampaignsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MarketingCampaignStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseMarketingCampaignsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseMarketingCampaigns`.
message BrowseMarketingCampaignsResponse {
  repeated MarketingCampaign marketing_campaigns = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindMarketingCampaigns`.
message FindMarketingCampaignsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MarketingCampaignStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindMarketingCampaignsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindMarketingCampaigns`.
message FindMarketingCampaignsResponse {
  repeated MarketingCampaign marketing_campaigns = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountMarketingCampaigns`.
message CountMarketingCampaignsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MarketingCampaignStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountMarketingCampaignsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountMarketingCampaigns`.
message CountMarketingCampaignsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveMarketingCampaigns`.
message ResolveMarketingCampaignsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string marketing_campaign_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveMarketingCampaigns`.
message ResolveMarketingCampaignsResponse {
  repeated MarketingCampaign marketing_campaigns = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportMarketingCampaigns`.
message ExportMarketingCampaignsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MarketingCampaignStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportMarketingCampaignsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportMarketingCampaigns`.
message ExportMarketingCampaignsResponse {
  MarketingCampaign marketing_campaign = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeMarketingCampaigns`.
message SummarizeMarketingCampaignsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string marketing_campaign_id = 2;
  SummarizeMarketingCampaignsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeMarketingCampaigns`.
message SummarizeMarketingCampaignsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestMarketingCampaigns`.
message SuggestMarketingCampaignsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MarketingCampaignStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestMarketingCampaignsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestMarketingCampaigns`.
message SuggestMarketingCampaignsResponse {
  repeated MarketingCampaign marketing_campaigns = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekMarketingCampaign`.
message PeekMarketingCampaignRequest {
  acme.common.v1.RequestContext context = 1;
  string marketing_campaign_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekMarketingCampaign`.
message PeekMarketingCampaignResponse {
  MarketingCampaign marketing_campaign = 1;
  acme.common.v1.OperationResult result = 2;
}
