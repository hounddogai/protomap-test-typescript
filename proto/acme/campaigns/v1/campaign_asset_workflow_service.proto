syntax = "proto3";

package acme.campaigns.v1;

import "acme/campaigns/v1/campaigns.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Campaigns.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/campaigns/v1;campaignsv1";
option java_multiple_files = true;
option java_outer_classname = "CampaignAssetWorkflowServiceProto";
option java_package = "com.acme.campaigns.v1";

// Runs the long-lived workflow that takes a campaign asset from start to finish.
service CampaignAssetWorkflowService {
  // Starts a campaign asset.
  rpc StartCampaignAssetWorkflow(StartCampaignAssetWorkflowRequest) returns (StartCampaignAssetWorkflowResponse);

  // Advances a campaign asset.
  rpc AdvanceCampaignAssetWorkflow(AdvanceCampaignAssetWorkflowRequest) returns (AdvanceCampaignAssetWorkflowResponse);

  // Cancels a campaign asset.
  rpc CancelCampaignAssetWorkflow(CancelCampaignAssetWorkflowRequest) returns (CancelCampaignAssetWorkflowResponse);

  // Retrys a campaign asset.
  rpc RetryCampaignAssetWorkflow(RetryCampaignAssetWorkflowRequest) returns (RetryCampaignAssetWorkflowResponse);

  // Pauses a campaign asset.
  rpc PauseCampaignAssetWorkflow(PauseCampaignAssetWorkflowRequest) returns (PauseCampaignAssetWorkflowResponse);

  // Resumes a campaign asset.
  rpc ResumeCampaignAssetWorkflow(ResumeCampaignAssetWorkflowRequest) returns (ResumeCampaignAssetWorkflowResponse);

  // Returns a campaign asset.
  rpc InspectCampaignAssetWorkflow(InspectCampaignAssetWorkflowRequest) returns (InspectCampaignAssetWorkflowResponse);

  // Lists campaign assets a page at a time.
  rpc ListCampaignAssetWorkflows(ListCampaignAssetWorkflowsRequest) returns (ListCampaignAssetWorkflowsResponse);

  // Signals a campaign asset.
  rpc SignalCampaignAssetWorkflow(SignalCampaignAssetWorkflowRequest) returns (SignalCampaignAssetWorkflowResponse);
}

// The request of `StartCampaignAssetWorkflow`.
message StartCampaignAssetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string campaign_asset_id = 2;
  CampaignAsset campaign_asset = 3;
  StartCampaignAssetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCampaignAssetWorkflow`.
message StartCampaignAssetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CampaignAsset campaign_asset = 1;
  StartCampaignAssetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

