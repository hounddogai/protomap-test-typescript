option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "SurveyResponseWorkflowServiceProto";
option java_package = "com.acme.surveys.v1";

// Runs the long-lived workflow that takes a survey response from start to finish.
service SurveyResponseWorkflowService {
  // Starts a survey response.
  rpc StartSurveyResponseWorkflow(StartSurveyResponseWorkflowRequest) returns (StartSurveyResponseWorkflowResponse);

  // Advances a survey response.
  rpc AdvanceSurveyResponseWorkflow(AdvanceSurveyResponseWorkflowRequest) returns (AdvanceSurveyResponseWorkflowResponse);

  // Cancels a survey response.
  rpc CancelSurveyResponseWorkflow(CancelSurveyResponseWorkflowRequest) returns (CancelSurveyResponseWorkflowResponse);

  // Retrys a survey response.
  rpc RetrySurveyResponseWorkflow(RetrySurveyResponseWorkflowRequest) returns (RetrySurveyResponseWorkflowResponse);

  // Pauses a survey response.
  rpc PauseSurveyResponseWorkflow(PauseSurveyResponseWorkflowRequest) returns (PauseSurveyResponseWorkflowResponse);

  // Resumes a survey response.
  rpc ResumeSurveyResponseWorkflow(ResumeSurveyResponseWorkflowRequest) returns (ResumeSurveyResponseWorkflowResponse);

  // Returns a survey response.
  rpc InspectSurveyResponseWorkflow(InspectSurveyResponseWorkflowRequest) returns (InspectSurveyResponseWorkflowResponse);

  // Lists survey responses a page at a time.
  rpc ListSurveyResponseWorkflows(ListSurveyResponseWorkflowsRequest) returns (ListSurveyResponseWorkflowsResponse);

  // Signals a survey response.
  rpc SignalSurveyResponseWorkflow(SignalSurveyResponseWorkflowRequest) returns (SignalSurveyResponseWorkflowResponse);
}

// The request of `StartSurveyResponseWorkflow`.
message StartSurveyResponseWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string survey_response_id = 2;
  SurveyResponse survey_response = 3;
  StartSurveyResponseWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSurveyResponseWorkflow`.
message StartSurveyResponseWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SurveyResponse survey_response = 1;
  StartSurveyResponseWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

