syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "SurveyResponseQueryServiceProto";
option java_package = "com.acme.surveys.v1";

// Answers read-only questions about survey responses, for screens and reports.
service SurveyResponseQueryService {
  // Returns a survey response.
  rpc LookupSurveyResponse(LookupSurveyResponseRequest) returns (LookupSurveyResponseResponse);

  // Lists survey responses a page at a time.
  rpc BrowseSurveyResponses(BrowseSurveyResponsesRequest) returns (BrowseSurveyResponsesResponse);

  // Lists survey responses a page at a time.
  rpc FindSurveyResponses(FindSurveyResponsesRequest) returns (FindSurveyResponsesResponse);

  // Counts survey responses by status.
  rpc CountSurveyResponses(CountSurveyResponsesRequest) returns (CountSurveyResponsesResponse);

  // Returns several survey responses at once.
  rpc ResolveSurveyResponses(ResolveSurveyResponsesRequest) returns (ResolveSurveyResponsesResponse);

  // Streams every matching survey response.
  rpc ExportSurveyResponses(ExportSurveyResponsesRequest) returns (stream ExportSurveyResponsesResponse);

  // Summarizes a survey response.
  rpc SummarizeSurveyResponses(SummarizeSurveyResponsesRequest) returns (SummarizeSurveyResponsesResponse);

  // Lists survey responses a page at a time.
  rpc SuggestSurveyResponses(SuggestSurveyResponsesRequest) returns (SuggestSurveyResponsesResponse);

  // Returns a survey response.
  rpc PeekSurveyResponse(PeekSurveyResponseRequest) returns (PeekSurveyResponseResponse);
}

// The request of `LookupSurveyResponse`.
message LookupSurveyResponseRequest {
  acme.common.v1.RequestContext context = 1;
  string survey_response_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupSurveyResponse`.
message LookupSurveyResponseResponse {
  SurveyResponse survey_response = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseSurveyResponses`.
message BrowseSurveyResponsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SurveyResponseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseSurveyResponsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseSurveyResponses`.
message BrowseSurveyResponsesResponse {
  repeated SurveyResponse survey_responses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindSurveyResponses`.
message FindSurveyResponsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SurveyResponseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindSurveyResponsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindSurveyResponses`.
message FindSurveyResponsesResponse {
  repeated SurveyResponse survey_responses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSurveyResponses`.
message CountSurveyResponsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SurveyResponseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSurveyResponsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSurveyResponses`.
message CountSurveyResponsesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveSurveyResponses`.
message ResolveSurveyResponsesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string survey_response_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveSurveyResponses`.
message ResolveSurveyResponsesResponse {
  repeated SurveyResponse survey_responses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportSurveyResponses`.
message ExportSurveyResponsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SurveyResponseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportSurveyResponsesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportSurveyResponses`.
message ExportSurveyResponsesResponse {
  SurveyResponse survey_response = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeSurveyResponses`.
message SummarizeSurveyResponsesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string survey_response_id = 2;
  SummarizeSurveyResponsesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeSurveyResponses`.
message SummarizeSurveyResponsesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestSurveyResponses`.
message SuggestSurveyResponsesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SurveyResponseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestSurveyResponsesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestSurveyResponses`.
message SuggestSurveyResponsesResponse {
  repeated SurveyResponse survey_responses = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekSurveyResponse`.
message PeekSurveyResponseRequest {
  acme.common.v1.RequestContext context = 1;
  string survey_response_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekSurveyResponse`.
message PeekSurveyResponseResponse {
  SurveyResponse survey_response = 1;
  acme.common.v1.OperationResult result = 2;
}
