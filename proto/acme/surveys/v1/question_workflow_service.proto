syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "QuestionWorkflowServiceProto";
option java_package = "com.acme.surveys.v1";

// Runs the long-lived workflow that takes a question from start to finish.
service QuestionWorkflowService {
  // Starts a question.
  rpc StartQuestionWorkflow(StartQuestionWorkflowRequest) returns (StartQuestionWorkflowResponse);

  // Advances a question.
  rpc AdvanceQuestionWorkflow(AdvanceQuestionWorkflowRequest) returns (AdvanceQuestionWorkflowResponse);

  // Cancels a question.
  rpc CancelQuestionWorkflow(CancelQuestionWorkflowRequest) returns (CancelQuestionWorkflowResponse);

  // Retrys a question.
  rpc RetryQuestionWorkflow(RetryQuestionWorkflowRequest) returns (RetryQuestionWorkflowResponse);

  // Pauses a question.
  rpc PauseQuestionWorkflow(PauseQuestionWorkflowRequest) returns (PauseQuestionWorkflowResponse);

  // Resumes a question.
  rpc ResumeQuestionWorkflow(ResumeQuestionWorkflowRequest) returns (ResumeQuestionWorkflowResponse);

  // Returns a question.
  rpc InspectQuestionWorkflow(InspectQuestionWorkflowRequest) returns (InspectQuestionWorkflowResponse);

  // Lists questions a page at a time.
  rpc ListQuestionWorkflows(ListQuestionWorkflowsRequest) returns (ListQuestionWorkflowsResponse);
}

// The request of `StartQuestionWorkflow`.
message StartQuestionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string question_id = 2;
  Question question = 3;
  StartQuestionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartQuestionWorkflow`.
message StartQuestionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Question question = 1;
  StartQuestionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

