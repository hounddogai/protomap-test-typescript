syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "QuestionCalculationServiceProto";
option java_package = "com.acme.surveys.v1";

// Computes the figures of a question, such as totals, taxes, and estimates.
service QuestionCalculationService {
  // Calculates a question.
  rpc CalculateQuestion(CalculateQuestionRequest) returns (CalculateQuestionResponse);

  // Estimates a question.
  rpc EstimateQuestion(EstimateQuestionRequest) returns (EstimateQuestionResponse);

  // Quotes a question.
  rpc QuoteQuestion(QuoteQuestionRequest) returns (QuoteQuestionResponse);

  // Compares a question.
  rpc CompareQuestionOptions(CompareQuestionOptionsRequest) returns (CompareQuestionOptionsResponse);

  // Recalculates a question.
  rpc RecalculateQuestions(RecalculateQuestionsRequest) returns (RecalculateQuestionsResponse);

  // Simulates a question.
  rpc SimulateQuestion(SimulateQuestionRequest) returns (SimulateQuestionResponse);

  // Explains a question.
  rpc ExplainQuestionCalculation(ExplainQuestionCalculationRequest) returns (ExplainQuestionCalculationResponse);

  // Returns a question.
  rpc GetQuestionRates(GetQuestionRatesRequest) returns (GetQuestionRatesResponse);
}

// The request of `CalculateQuestion`.
message CalculateQuestionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string question_id = 2;
  Question question = 3;
  CalculateQuestionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateQuestion`.
message CalculateQuestionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateQuestionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Question question = 1;
  CalculateQuestionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

