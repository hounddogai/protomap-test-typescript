syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "SurveyApprovalServiceProto";
option java_package = "com.acme.surveys.v1";

// Routes surveys through approval, with escalation and delegation.
service SurveyApprovalService {
  // Submits a survey.
  rpc SubmitSurvey(SubmitSurveyRequest) returns (SubmitSurveyResponse);

  // Approves a survey.
  rpc ApproveSurvey(ApproveSurveyRequest) returns (ApproveSurveyResponse);

  // Rejects a survey.
  rpc RejectSurvey(RejectSurveyRequest) returns (RejectSurveyResponse);

  // Escalates a survey.
  rpc EscalateSurvey(EscalateSurveyRequest) returns (EscalateSurveyResponse);

  // Lists surveys a page at a time.
  rpc ListPendingSurveys(ListPendingSurveysRequest) returns (ListPendingSurveysResponse);

  // Delegates a survey.
  rpc DelegateSurveyApproval(DelegateSurveyApprovalRequest) returns (DelegateSurveyApprovalResponse);

  // Recalls a survey.
  rpc RecallSurvey(RecallSurveyRequest) returns (RecallSurveyResponse);

  // Returns a survey.
  rpc GetSurveyApprovalStatus(GetSurveyApprovalStatusRequest) returns (GetSurveyApprovalStatusResponse);

  // Comments a survey.
  rpc CommentSurveyApproval(CommentSurveyApprovalRequest) returns (CommentSurveyApprovalResponse);
}

// The request of `SubmitSurvey`.
message SubmitSurveyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string survey_id = 2;
  Survey survey = 3;
  SubmitSurveyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSurvey`.
message SubmitSurveyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Survey survey = 1;
  SubmitSurveyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

