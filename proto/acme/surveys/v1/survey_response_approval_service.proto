syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "SurveyResponseApprovalServiceProto";
option java_package = "com.acme.surveys.v1";

// Routes survey responses through approval, with escalation and delegation.
service SurveyResponseApprovalService {
  // Submits a survey response.
  rpc SubmitSurveyResponse(SubmitSurveyResponseRequest) returns (SubmitSurveyResponseResponse);

  // Approves a survey response.
  rpc ApproveSurveyResponse(ApproveSurveyResponseRequest) returns (ApproveSurveyResponseResponse);

  // Rejects a survey response.
  rpc RejectSurveyResponse(RejectSurveyResponseRequest) returns (RejectSurveyResponseResponse);

  // Lists survey responses a page at a time.
  rpc ListPendingSurveyResponses(ListPendingSurveyResponsesRequest) returns (ListPendingSurveyResponsesResponse);

  // Delegates a survey response.
  rpc DelegateSurveyResponseApproval(DelegateSurveyResponseApprovalRequest) returns (DelegateSurveyResponseApprovalResponse);

  // Recalls a survey response.
  rpc RecallSurveyResponse(RecallSurveyResponseRequest) returns (RecallSurveyResponseResponse);

  // Returns a survey response.
  rpc GetSurveyResponseApprovalStatus(GetSurveyResponseApprovalStatusRequest) returns (GetSurveyResponseApprovalStatusResponse);

  // Comments a survey response.
  rpc CommentSurveyResponseApproval(CommentSurveyResponseApprovalRequest) returns (CommentSurveyResponseApprovalResponse);
}

// The request of `SubmitSurveyResponse`.
message SubmitSurveyResponseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string survey_response_id = 2;
  SurveyResponse survey_response = 3;
  SubmitSurveyResponseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSurveyResponse`.
message SubmitSurveyResponseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SurveyResponse survey_response = 1;
  SubmitSurveyResponseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

