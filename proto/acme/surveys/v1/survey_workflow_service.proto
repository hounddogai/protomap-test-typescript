syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "SurveyWorkflowServiceProto";
option java_package = "com.acme.surveys.v1";

// Runs the long-lived workflow that takes a survey from start to finish.
service SurveyWorkflowService {
  // Starts a survey.
  rpc StartSurveyWorkflow(StartSurveyWorkflowRequest) returns (StartSurveyWorkflowResponse);

  // Advances a survey.
  rpc AdvanceSurveyWorkflow(AdvanceSurveyWorkflowRequest) returns (AdvanceSurveyWorkflowResponse);

  // Cancels a survey.
  rpc CancelSurveyWorkflow(CancelSurveyWorkflowRequest) returns (CancelSurveyWorkflowResponse);

  // Retrys a survey.
  rpc RetrySurveyWorkflow(RetrySurveyWorkflowRequest) returns (RetrySurveyWorkflowResponse);

  // Pauses a survey.
  rpc PauseSurveyWorkflow(PauseSurveyWorkflowRequest) returns (PauseSurveyWorkflowResponse);

  // Returns a survey.
  rpc InspectSurveyWorkflow(InspectSurveyWorkflowRequest) returns (InspectSurveyWorkflowResponse);

  // Lists surveys a page at a time.
  rpc ListSurveyWorkflows(ListSurveyWorkflowsRequest) returns (ListSurveyWorkflowsResponse);

  // Signals a survey.
  rpc SignalSurveyWorkflow(SignalSurveyWorkflowRequest) returns (SignalSurveyWorkflowResponse);
}

// The request of `StartSurveyWorkflow`.
message StartSurveyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string survey_id = 2;
  Survey survey = 3;
  StartSurveyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSurveyWorkflow`.
message StartSurveyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Survey survey = 1;
  StartSurveyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

