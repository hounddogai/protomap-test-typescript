syntax = "proto3";

package acme.surveys.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/surveys/v1/surveys.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Surveys.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/surveys/v1;surveysv1";
option java_multiple_files = true;
option java_outer_classname = "QuestionApprovalServiceProto";
option java_package = "com.acme.surveys.v1";

// Routes questions through approval, with escalation and delegation.
service QuestionApprovalService {
  // Submits a question.
  rpc SubmitQuestion(SubmitQuestionRequest) returns (SubmitQuestionResponse);

  // Approves a question.
  rpc ApproveQuestion(ApproveQuestionRequest) returns (ApproveQuestionResponse);

  // Rejects a question.
  rpc RejectQuestion(RejectQuestionRequest) returns (RejectQuestionResponse);

  // Escalates a question.
  rpc EscalateQuestion(EscalateQuestionRequest) returns (EscalateQuestionResponse);

  // Lists questions a page at a time.
  rpc ListPendingQuestions(ListPendingQuestionsRequest) returns (ListPendingQuestionsResponse);

  // Delegates a question.
  rpc DelegateQuestionApproval(DelegateQuestionApprovalRequest) returns (DelegateQuestionApprovalResponse);

  // Recalls a question.
  rpc RecallQuestion(RecallQuestionRequest) returns (RecallQuestionResponse);

  // Returns a question.
  rpc GetQuestionApprovalStatus(GetQuestionApprovalStatusRequest) returns (GetQuestionApprovalStatusResponse);

  // Comments a question.
  rpc CommentQuestionApproval(CommentQuestionApprovalRequest) returns (CommentQuestionApprovalResponse);
}

// The request of `SubmitQuestion`.
message SubmitQuestionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string question_id = 2;
  Question question = 3;
  SubmitQuestionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitQuestion`.
message SubmitQuestionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Question question = 1;
  SubmitQuestionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

