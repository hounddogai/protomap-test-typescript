syntax = "proto3";

package acme.audiences.v1;

import "acme/audiences/v1/audiences.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceMemberQueryServiceProto";
option java_package = "com.acme.audiences.v1";

// Answers read-only questions about audience members, for screens and reports.
service AudienceMemberQueryService {
  // Returns an audience member.
  rpc LookupAudienceMember(LookupAudienceMemberRequest) returns (LookupAudienceMemberResponse);

  // Lists audience members a page at a time.
  rpc BrowseAudienceMembers(BrowseAudienceMembersRequest) returns (BrowseAudienceMembersResponse);

  // Lists audience members a page at a time.
  rpc FindAudienceMembers(FindAudienceMembersRequest) returns (FindAudienceMembersResponse);

  // Counts audience members by status.
  rpc CountAudienceMembers(CountAudienceMembersRequest) returns (CountAudienceMembersResponse);

  // Returns several audience members at once.
  rpc ResolveAudienceMembers(ResolveAudienceMembersRequest) returns (ResolveAudienceMembersResponse);

  // Streams every matching audience member.
  rpc ExportAudienceMembers(ExportAudienceMembersRequest) returns (stream ExportAudienceMembersResponse);

  // Summarizes an audience member.
  rpc SummarizeAudienceMembers(SummarizeAudienceMembersRequest) returns (SummarizeAudienceMembersResponse);

  // Lists audience members a page at a time.
  rpc SuggestAudienceMembers(SuggestAudienceMembersRequest) returns (SuggestAudienceMembersResponse);

  // Returns an audience member.
  rpc PeekAudienceMember(PeekAudienceMemberRequest) returns (PeekAudienceMemberResponse);
}

// The request of `LookupAudienceMember`.
message LookupAudienceMemberRequest {
  acme.common.v1.RequestContext context = 1;
  string audience_member_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupAudienceMember`.
message LookupAudienceMemberResponse {
  AudienceMember audience_member = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseAudienceMembers`.
message BrowseAudienceMembersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AudienceMemberStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseAudienceMembersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseAudienceMembers`.
message BrowseAudienceMembersResponse {
  repeated AudienceMember audience_members = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindAudienceMembers`.
message FindAudienceMembersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AudienceMemberStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindAudienceMembersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindAudienceMembers`.
message FindAudienceMembersResponse {
  repeated AudienceMember audience_members = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAudienceMembers`.
message CountAudienceMembersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AudienceMemberStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAudienceMembersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAudienceMembers`.
message CountAudienceMembersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveAudienceMembers`.
message ResolveAudienceMembersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string audience_member_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveAudienceMembers`.
message ResolveAudienceMembersResponse {
  repeated AudienceMember audience_members = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportAudienceMembers`.
message ExportAudienceMembersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AudienceMemberStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportAudienceMembersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportAudienceMembers`.
message ExportAudienceMembersResponse {
  AudienceMember audience_member = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeAudienceMembers`.
message SummarizeAudienceMembersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_member_id = 2;
  SummarizeAudienceMembersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeAudienceMembers`.
message SummarizeAudienceMembersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestAudienceMembers`.
message SuggestAudienceMembersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AudienceMemberStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestAudienceMembersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestAudienceMembers`.
message SuggestAudienceMembersResponse {
  repeated AudienceMember audience_members = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekAudienceMember`.
message PeekAudienceMemberRequest {
  acme.common.v1.RequestContext context = 1;
  string audience_member_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekAudienceMember`.
message PeekAudienceMemberResponse {
  AudienceMember audience_member = 1;
  acme.common.v1.OperationResult result = 2;
}
