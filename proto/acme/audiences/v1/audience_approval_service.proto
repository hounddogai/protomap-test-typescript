syntax = "proto3";

package acme.audiences.v1;

import "acme/audiences/v1/audiences.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceApprovalServiceProto";
option java_package = "com.acme.audiences.v1";

// Routes audiences through approval, with escalation and delegation.
service AudienceApprovalService {
  // Submits an audience.
  rpc SubmitAudience(SubmitAudienceRequest) returns (SubmitAudienceResponse);

  // Approves an audience.
  rpc ApproveAudience(ApproveAudienceRequest) returns (ApproveAudienceResponse);

  // Rejects an audience.
  rpc RejectAudience(RejectAudienceRequest) returns (RejectAudienceResponse);

  // Escalates an audience.
  rpc EscalateAudience(EscalateAudienceRequest) returns (EscalateAudienceResponse);

  // Lists audiences a page at a time.
  rpc ListPendingAudiences(ListPendingAudiencesRequest) returns (ListPendingAudiencesResponse);

  // Delegates an audience.
  rpc DelegateAudienceApproval(DelegateAudienceApprovalRequest) returns (DelegateAudienceApprovalResponse);

  // Recalls an audience.
  rpc RecallAudience(RecallAudienceRequest) returns (RecallAudienceResponse);

  // Returns an audience.
  rpc GetAudienceApprovalStatus(GetAudienceApprovalStatusRequest) returns (GetAudienceApprovalStatusResponse);

  // Comments an audience.
  rpc CommentAudienceApproval(CommentAudienceApprovalRequest) returns (CommentAudienceApprovalResponse);
}

// The request of `SubmitAudience`.
message SubmitAudienceRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_id = 2;
  Audience audience = 3;
  SubmitAudienceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAudience`.
message SubmitAudienceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Audience audience = 1;
  SubmitAudienceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

