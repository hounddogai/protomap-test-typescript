}

// The response of `ExplainAudienceSyncCalculation`.
message ExplainAudienceSyncCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AudienceSync audience_sync = 1;
  ExplainAudienceSyncCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
