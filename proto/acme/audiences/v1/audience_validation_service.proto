syntax = "proto3";

package acme.audiences.v1;

import "acme/audiences/v1/audiences.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceValidationServiceProto";
option java_package = "com.acme.audiences.v1";

// Checks audiences against the rules before anything acts on them.
service AudienceValidationService {
  // Validates an audience.
  rpc ValidateAudience(ValidateAudienceRequest) returns (ValidateAudienceResponse);

  // Previews an audience.
  rpc PreviewAudience(PreviewAudienceRequest) returns (PreviewAudienceResponse);

  // Checks an audience.
  rpc CheckAudienceEligibility(CheckAudienceEligibilityRequest) returns (CheckAudienceEligibilityResponse);

  // Normalizes an audience.
  rpc NormalizeAudience(NormalizeAudienceRequest) returns (NormalizeAudienceResponse);

  // Explains an audience.
  rpc ExplainAudienceDecision(ExplainAudienceDecisionRequest) returns (ExplainAudienceDecisionResponse);

  // Scores an audience.
  rpc ScoreAudience(ScoreAudienceRequest) returns (ScoreAudienceResponse);

  // Lints an audience.
  rpc LintAudiences(LintAudiencesRequest) returns (LintAudiencesResponse);

  // Returns an audience.
  rpc GetAudienceRules(GetAudienceRulesRequest) returns (GetAudienceRulesResponse);
}

// The request of `ValidateAudience`.
message ValidateAudienceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_id = 2;
  Audience audience = 3;
  ValidateAudienceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAudience`.
message ValidateAudienceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Audience audience = 1;
  ValidateAudienceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

