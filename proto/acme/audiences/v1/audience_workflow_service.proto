option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceWorkflowServiceProto";
option java_package = "com.acme.audiences.v1";

// Runs the long-lived workflow that takes an audience from start to finish.
service AudienceWorkflowService {
  // Starts an audience.
  rpc StartAudienceWorkflow(StartAudienceWorkflowRequest) returns (StartAudienceWorkflowResponse);

  // Advances an audience.
  rpc AdvanceAudienceWorkflow(AdvanceAudienceWorkflowRequest) returns (AdvanceAudienceWorkflowResponse);

  // Cancels an audience.
  rpc CancelAudienceWorkflow(CancelAudienceWorkflowRequest) returns (CancelAudienceWorkflowResponse);

  // Retrys an audience.
  rpc RetryAudienceWorkflow(RetryAudienceWorkflowRequest) returns (RetryAudienceWorkflowResponse);

  // Pauses an audience.
  rpc PauseAudienceWorkflow(PauseAudienceWorkflowRequest) returns (PauseAudienceWorkflowResponse);

  // Resumes an audience.
  rpc ResumeAudienceWorkflow(ResumeAudienceWorkflowRequest) returns (ResumeAudienceWorkflowResponse);

  // Returns an audience.
  rpc InspectAudienceWorkflow(InspectAudienceWorkflowRequest) returns (InspectAudienceWorkflowResponse);

  // Lists audiences a page at a time.
  rpc ListAudienceWorkflows(ListAudienceWorkflowsRequest) returns (ListAudienceWorkflowsResponse);

  // Signals an audience.
  rpc SignalAudienceWorkflow(SignalAudienceWorkflowRequest) returns (SignalAudienceWorkflowResponse);
}

// The request of `StartAudienceWorkflow`.
message StartAudienceWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_id = 2;
  Audience audience = 3;
  StartAudienceWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAudienceWorkflow`.
message StartAudienceWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Audience audience = 1;
  StartAudienceWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

