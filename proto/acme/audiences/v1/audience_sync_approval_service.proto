syntax = "proto3";

package acme.audiences.v1;

import "acme/audiences/v1/audiences.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceSyncApprovalServiceProto";
option java_package = "com.acme.audiences.v1";

// Routes audience syncs through approval, with escalation and delegation.
service AudienceSyncApprovalService {
  // Submits an audience sync.
  rpc SubmitAudienceSync(SubmitAudienceSyncRequest) returns (SubmitAudienceSyncResponse);

  // Approves an audience sync.
  rpc ApproveAudienceSync(ApproveAudienceSyncRequest) returns (ApproveAudienceSyncResponse);

  // Rejects an audience sync.
  rpc RejectAudienceSync(RejectAudienceSyncRequest) returns (RejectAudienceSyncResponse);

  // Escalates an audience sync.
  rpc EscalateAudienceSync(EscalateAudienceSyncRequest) returns (EscalateAudienceSyncResponse);

  // Lists audience syncs a page at a time.
  rpc ListPendingAudienceSyncs(ListPendingAudienceSyncsRequest) returns (ListPendingAudienceSyncsResponse);

  // Delegates an audience sync.
  rpc DelegateAudienceSyncApproval(DelegateAudienceSyncApprovalRequest) returns (DelegateAudienceSyncApprovalResponse);

  // Recalls an audience sync.
  rpc RecallAudienceSync(RecallAudienceSyncRequest) returns (RecallAudienceSyncResponse);

  // Returns an audience sync.
  rpc GetAudienceSyncApprovalStatus(GetAudienceSyncApprovalStatusRequest) returns (GetAudienceSyncApprovalStatusResponse);

  // Comments an audience sync.
  rpc CommentAudienceSyncApproval(CommentAudienceSyncApprovalRequest) returns (CommentAudienceSyncApprovalResponse);
}

// The request of `SubmitAudienceSync`.
message SubmitAudienceSyncRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_sync_id = 2;
  AudienceSync audience_sync = 3;
  SubmitAudienceSyncRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAudienceSync`.
message SubmitAudienceSyncResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AudienceSync audience_sync = 1;
  SubmitAudienceSyncResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

