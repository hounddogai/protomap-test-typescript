syntax = "proto3";

package acme.audiences.v1;

import "acme/audiences/v1/audiences.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceSyncValidationServiceProto";
option java_package = "com.acme.audiences.v1";

// Checks audience syncs against the rules before anything acts on them.
service AudienceSyncValidationService {
  // Validates an audience sync.
  rpc ValidateAudienceSync(ValidateAudienceSyncRequest) returns (ValidateAudienceSyncResponse);

  // Previews an audience sync.
  rpc PreviewAudienceSync(PreviewAudienceSyncRequest) returns (PreviewAudienceSyncResponse);

  // Normalizes an audience sync.
  rpc NormalizeAudienceSync(NormalizeAudienceSyncRequest) returns (NormalizeAudienceSyncResponse);

  // Explains an audience sync.
  rpc ExplainAudienceSyncDecision(ExplainAudienceSyncDecisionRequest) returns (ExplainAudienceSyncDecisionResponse);

  // Scores an audience sync.
  rpc ScoreAudienceSync(ScoreAudienceSyncRequest) returns (ScoreAudienceSyncResponse);

  // Lints an audience sync.
  rpc LintAudienceSyncs(LintAudienceSyncsRequest) returns (LintAudienceSyncsResponse);

  // Returns an audience sync.
  rpc GetAudienceSyncRules(GetAudienceSyncRulesRequest) returns (GetAudienceSyncRulesResponse);
}

// The request of `ValidateAudienceSync`.
message ValidateAudienceSyncRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_sync_id = 2;
  AudienceSync audience_sync = 3;
  ValidateAudienceSyncRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAudienceSync`.
message ValidateAudienceSyncResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AudienceSync audience_sync = 1;
  ValidateAudienceSyncResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

