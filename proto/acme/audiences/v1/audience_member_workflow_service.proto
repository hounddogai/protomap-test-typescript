option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceMemberWorkflowServiceProto";
option java_package = "com.acme.audiences.v1";

// Runs the long-lived workflow that takes an audience member from start to finish.
service AudienceMemberWorkflowService {
  // Starts an audience member.
  rpc StartAudienceMemberWorkflow(StartAudienceMemberWorkflowRequest) returns (StartAudienceMemberWorkflowResponse);

  // Advances an audience member.
  rpc AdvanceAudienceMemberWorkflow(AdvanceAudienceMemberWorkflowRequest) returns (AdvanceAudienceMemberWorkflowResponse);

  // Cancels an audience member.
  rpc CancelAudienceMemberWorkflow(CancelAudienceMemberWorkflowRequest) returns (CancelAudienceMemberWorkflowResponse);

  // Retrys an audience member.
  rpc RetryAudienceMemberWorkflow(RetryAudienceMemberWorkflowRequest) returns (RetryAudienceMemberWorkflowResponse);

  // Pauses an audience member.
  rpc PauseAudienceMemberWorkflow(PauseAudienceMemberWorkflowRequest) returns (PauseAudienceMemberWorkflowResponse);

  // Resumes an audience member.
  rpc ResumeAudienceMemberWorkflow(ResumeAudienceMemberWorkflowRequest) returns (ResumeAudienceMemberWorkflowResponse);

  // Returns an audience member.
  rpc InspectAudienceMemberWorkflow(InspectAudienceMemberWorkflowRequest) returns (InspectAudienceMemberWorkflowResponse);

  // Lists audience members a page at a time.
  rpc ListAudienceMemberWorkflows(ListAudienceMemberWorkflowsRequest) returns (ListAudienceMemberWorkflowsResponse);

  // Signals an audience member.
  rpc SignalAudienceMemberWorkflow(SignalAudienceMemberWorkflowRequest) returns (SignalAudienceMemberWorkflowResponse);
}

// The request of `StartAudienceMemberWorkflow`.
message StartAudienceMemberWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_member_id = 2;
  AudienceMember audience_member = 3;
  StartAudienceMemberWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAudienceMemberWorkflow`.
message StartAudienceMemberWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AudienceMember audience_member = 1;
  StartAudienceMemberWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

