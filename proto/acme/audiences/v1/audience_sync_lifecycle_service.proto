option csharp_namespace = "Acme.Audiences.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audiences/v1;audiencesv1";
option java_multiple_files = true;
option java_outer_classname = "AudienceSyncLifecycleServiceProto";
option java_package = "com.acme.audiences.v1";

// Moves an audience sync between the states of its lifecycle.
service AudienceSyncLifecycleService {
  // Activates an audience sync.
  rpc ActivateAudienceSync(ActivateAudienceSyncRequest) returns (ActivateAudienceSyncResponse);

  // Suspends an audience sync.
  rpc SuspendAudienceSync(SuspendAudienceSyncRequest) returns (SuspendAudienceSyncResponse);

  // Reinstates an audience sync.
  rpc ReinstateAudienceSync(ReinstateAudienceSyncRequest) returns (ReinstateAudienceSyncResponse);

  // Terminates an audience sync.
  rpc TerminateAudienceSync(TerminateAudienceSyncRequest) returns (TerminateAudienceSyncResponse);

  // Renews an audience sync.
  rpc RenewAudienceSync(RenewAudienceSyncRequest) returns (RenewAudienceSyncResponse);

  // Expires an audience sync.
  rpc ExpireAudienceSync(ExpireAudienceSyncRequest) returns (ExpireAudienceSyncResponse);

  // Returns an audience sync.
  rpc GetAudienceSyncLifecycle(GetAudienceSyncLifecycleRequest) returns (GetAudienceSyncLifecycleResponse);

  // Schedules an audience sync.
  rpc ScheduleAudienceSyncExpiry(ScheduleAudienceSyncExpiryRequest) returns (ScheduleAudienceSyncExpiryResponse);
}

// The request of `ActivateAudienceSync`.
message ActivateAudienceSyncRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audience_sync_id = 2;
  ActivateAudienceSyncRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateAudienceSync`.
message ActivateAudienceSyncResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AudienceSync audience_sync = 1;
  ActivateAudienceSyncResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

