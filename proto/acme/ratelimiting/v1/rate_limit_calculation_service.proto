syntax = "proto3";

package acme.ratelimiting.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/ratelimiting/v1/ratelimiting.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ratelimiting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ratelimiting/v1;ratelimitingv1";
option java_multiple_files = true;
option java_outer_classname = "RateLimitCalculationServiceProto";
option java_package = "com.acme.ratelimiting.v1";

// Computes the figures of a rate limit, such as totals, taxes, and estimates.
service RateLimitCalculationService {
  // Calculates a rate limit.
  rpc CalculateRateLimit(CalculateRateLimitRequest) returns (CalculateRateLimitResponse);

  // Estimates a rate limit.
  rpc EstimateRateLimit(EstimateRateLimitRequest) returns (EstimateRateLimitResponse);

  // Quotes a rate limit.
  rpc QuoteRateLimit(QuoteRateLimitRequest) returns (QuoteRateLimitResponse);

  // Compares a rate limit.
  rpc CompareRateLimitOptions(CompareRateLimitOptionsRequest) returns (CompareRateLimitOptionsResponse);

  // Recalculates a rate limit.
  rpc RecalculateRateLimits(RecalculateRateLimitsRequest) returns (RecalculateRateLimitsResponse);

  // Simulates a rate limit.
  rpc SimulateRateLimit(SimulateRateLimitRequest) returns (SimulateRateLimitResponse);

  // Explains a rate limit.
  rpc ExplainRateLimitCalculation(ExplainRateLimitCalculationRequest) returns (ExplainRateLimitCalculationResponse);

  // Returns a rate limit.
  rpc GetRateLimitRates(GetRateLimitRatesRequest) returns (GetRateLimitRatesResponse);
}

// The request of `CalculateRateLimit`.
message CalculateRateLimitRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rate_limit_id = 2;
  RateLimit rate_limit = 3;
  CalculateRateLimitRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRateLimit`.
message CalculateRateLimitResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRateLimitResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  RateLimit rate_limit = 1;
  CalculateRateLimitResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

